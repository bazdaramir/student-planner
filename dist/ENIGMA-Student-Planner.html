          : null,
        UI.button("انصراف", { onClick: UI.closeModal }),
        !task
          ? UI.button("ذخیره و افزودن بعدی", {
              onClick: function () {
                var data = collect();
                var err = validate(data);
                if (err) {
                  UI.toast(err, "danger");
                  return;
                }
                A.addTask(dayId, data);
                UI.toast("فعالیت افزوده شد.", "success");
                UI.closeModal();
                K.openTaskEditor(dayId, null);
              }
            })
          : null,
        UI.button("ذخیره", {
          variant: "primary",
          icon: "check",
          onClick: function () {
            var data = collect();
            var err = validate(data);
            if (err) {
              UI.toast(err, "danger");
              return;
            }
            if (task) A.updateTask(task.id, data);
            else A.addTask(dayId, data);
            UI.closeModal();
            UI.toast("فعالیت ذخیره شد.", "success");
          }
        })
      ]
    });
  };

  K.openMoveTask = function (taskId) {
    var state = HDML.store.get();
    var task = state.consultant.tasks[taskId];
    if (!task) return;
    var day = state.consultant.days[task.dayId];
    var days = Q.daysOfWeek(day.weekId, state);

    var form = el("div", { class: "stack" }, [
      UI.field({
        label: "انتقال به روز",
        name: "dayId",
        type: "select",
        value: task.dayId,

      })

      title: "انتقال فعالیت به روز دیگر",

      body: form,

        UI.button("انصراف", { onClick: UI.closeModal }),

      UI.field({
        label: "یادداشت مشاور برای این روز",
        name: "note",
        type: "textarea",

        full: true,
        value: day.consultantNote || ""

    ]);

    UI.openModal({
      title: "یادداشت روز — " + D.format(day.date, "full"),
      size: "narrow",
      body: form,
      footer: [
        UI.button("انصراف", { onClick: UI.closeModal }),
        UI.button("ذخیره", {
          variant: "primary",
          onClick: function () {
            A.setDayNote(dayId, UI.valueOf(form, "note"));
            UI.closeModal();
            UI.toast("یادداشت ذخیره شد.", "success");
          }
        })
      ]
    });
  };

  function examList(state, ctx) {
    var exams = Q.examsSorted(state);
    if (!exams.length) {
      return UI.empty({
        icon: "exam",
        title: "آزمونی تعریف نشده است",
        text: "آزمون‌های پیش‌رو را تعریف کنید تا دانش‌آموز بتواند نتیجه را ثبت کند."
      });
    }
    return el("div", { class: "table-wrap" }, [
      el("table", { class: "data-table" }, [
        el("thead", {}, [
          el("tr", {}, [
            el("th", { text: "تاریخ" }),
            el("th", { text: "نام" }),
            el("th", { text: "نوع" }),
            el("th", { class: "num-cell", text: "دروس" }),
            el("th", { text: "نتیجه" }),
            el("th", { text: "" })
          ])
        ]),
        el(
          "tbody",
          {},
          exams.map(function (e) {
            var es = S.examStats(e.id, state);
            return el("tr", {}, [
              el("td", { class: "num-cell", text: D.format(e.date, "numeric") }),
              el("td", { class: "cell-subject", text: e.name }),
              el("td", { text: util.examTypeLabel(e.type) }),
              el("td", { class: "num-cell", text: util.n((e.subjectIds || []).length) }),
              el("td", {}, [
                es.hasResult
                  ? UI.badge(util.fmtPct(es.overallPercentage), "success")
                  : UI.badge("بدون نتیجه", "muted")
              ]),
              el("td", {}, [
                el("div", { class: "planner-task__actions" }, [
                  UI.iconButton("edit", {
                    title: "ویرایش آزمون",
                    onClick: function () {
                      HDML.examUI.openExamEditor(e.id);
                    }
                  }),
                  UI.iconButton("eye", {
                    title: "جزئیات",
                    onClick: function () {
                      HDML.examUI.openExamDetails(e.id);
                    }
                  })
                ])
              ])
            ]);
          })
        )
      ])
    ]);
  }
})(typeof window !== "undefined" ? window : globalThis);

    var today = D.today();

    var weekDefs = [

    weekDefs.forEach(function (def, weekIdx) {
      state.consultant.weeks[def.id] = {

        index: def.index,
        title: def.title,
        startDate: def.start,
        endDate: D.addDays(def.start, 6),
        locked: weekIdx === 0,
        consultantNote:
          weekIdx === 0
            ? "تمرکز این هفته روی جبران عقب‌ماندگی زیست و افزایش تعداد تست شیمی است."
            : "پس از آزمون این هفته، حتماً تحلیل آزمون را کامل بنویس. تعداد تست فیزیک را نسبت به هفته‌ی قبل بیشتر کرده‌ام.",
        createdAt: D.now()
      };

      D.weekDates(def.start).forEach(function (iso, dowIndex) {
        var dayId = "day_demo_" + weekIdx + "_" + dowIndex;
        state.consultant.days[dayId] = {
          id: dayId,
          weekId: def.id,
          date: iso,
          dowIndex: dowIndex,
          consultantNote:
            dowIndex === 6
              ? "جمعه سبک‌تر برنامه‌ریزی شده است؛ از این روز برای دوره و استراحت استفاده کن."
              : ""
        };

        /* Friday is a light day; the rest carry 4-7 tasks. */
        var taskCount = dowIndex === 6 ? 3 : 4 + Math.floor(rand() * 4);
        var used = {};

        for (var i = 0; i < taskCount; i++) {
          var name = subjectNames[Math.floor(rand() * subjectNames.length)];
          var options = PLANS[name];
          var pick = options[Math.floor(rand() * options.length)];
          var key = name + "|" + pick[0];
          if (used[key]) continue;
          used[key] = true;

          var taskId = "tsk_demo_" + taskCounter++;
          state.consultant.tasks[taskId] = {
            id: taskId,
            dayId: dayId,
            subjectId: subjectId(name),
            topic: pick[0],
            title: pick[1] + " — " + pick[0],
            description: "",
            type: pick[2],
            plannedMinutes: pick[3],
            startTime: "",
            targetQuestions: pick[4],
            priority: i === 0 ? "high" : rand() > 0.8 ? "low" : "normal",
            consultantNote:
              i === 0 && dowIndex < 2
                ? "این فعالیت را حتماً اول صبح انجام بده؛ بیشترین تمرکز را همان موقع داری."
                : "",
            order: i,
            createdAt: D.now()
          };
        }
      });
    });

    Object.keys(state.consultant.tasks).forEach(function (taskId) {
      var task = state.consultant.tasks[taskId];
      var day = state.consultant.days[task.dayId];
      if (day.date > today) return; /* future days stay untouched */

      var roll = rand();
      var isPastWeek = day.weekId === "wk_demo_1";
      var skipChance = isPastWeek ? 0.12 : 0.16;

      if (roll < skipChance) {
        state.student.taskLogs[taskId] = {
          taskId: taskId,
          status: "skipped",
          actualMinutes: null,
          timeSource: "none",
          questions: null,
          note: "",
          skipReason: ["no_time", "fatigue", "overload", "difficulty", "focus"][
            Math.floor(rand() * 5)

          skipNote: "",
          completedAt: null,
          updatedAt: D.now()

      var ratio = 0.68 + rand() * 0.5;
      var actual = Math.round(task.plannedMinutes * ratio);
      /* One in eight completions has no recorded time -> "estimated". */
      var recordTime = rand() > 0.12;

      var questions = null;
      if (task.targetQuestions > 0) {
        var completedQ = Math.round(
          task.targetQuestions * (0.6 + rand() * 0.45)
        );
        completedQ = Math.min(completedQ, task.targetQuestions);
        var correct = Math.round(completedQ * (0.5 + rand() * 0.38));
        var unanswered = Math.round((completedQ - correct) * rand() * 0.5);
        var wrong = completedQ - correct - unanswered;
        questions = {
          completed: completedQ,
          correct: correct,
          wrong: Math.max(0, wrong),
          unanswered: unanswered
        };

      state.student.taskLogs[taskId] = {
        taskId: taskId,
        status: "completed",
        actualMinutes: recordTime ? actual : null,
        timeSource: recordTime ? "actual" : "estimated",
        questions: questions,
        note: rand() > 0.85 ? "این مبحث نیاز به دوره‌ی دوباره دارد." : "",
        skipReason: null,
        skipNote: "",
        completedAt: day.date + "T20:00:00.000Z",
        updatedAt: D.now()
      };
    });

    var noteTexts = [
      "صبح تمرکز خوبی داشتم، بعدازظهر افت کردم.",
      "تست‌های شیمی سخت‌تر از انتظارم بود؛ وقت بیشتری گرفت.",
      "امروز طبق برنامه پیش رفتم و از نتیجه راضی‌ام.",
      "خواب کافی نداشتم و بازدهی‌ام پایین بود.",
      "دوره‌ی زیست خیلی مفید بود؛ مطالب جا افتاد."
    ];
    Object.keys(state.consultant.days).forEach(function (dayId, i) {
      var day = state.consultant.days[dayId];
      if (day.date > today) return;
      if (i % 2 === 0) {
        state.student.dailyNotes[dayId] = {
          note: noteTexts[i % noteTexts.length],
          updatedAt: D.now()
        };
      }
    });

    state.student.weeklyReflections["wk_demo_1"] = {
      wentWell: "تعداد تست زیست را نسبت به هفته‌ی قبل بیشتر کردم و نظم صبح‌ها بهتر شد.",
      difficult: "شیمی همچنان کند پیش می‌رود و وقت‌گیر است.",
      improve: "هفته‌ی بعد شیمی را زودتر در روز شروع می‌کنم و تست‌های زمان‌دار می‌زنم.",
      updatedAt: D.now()
    };

    state.consultant.feedback["wk_demo_1"] = {
      text:
        "عملکرد کلی مثبت بود. زمان مطالعه‌ی شیمی از برنامه عقب است؛ در هفته‌ی جدید بازه‌ی شیمی را به صبح منتقل کردم. روی تست زمان‌دار تمرکز کن.",
      at: D.now()
    };

    var examSubjects = ["زیست‌شناسی", "شیمی", "فیزیک", "ریاضی", "ادبیات"].map(subjectId);

    var examDefs = [
      {
        id: "exm_demo_1",
        name: "آزمون آزمایشی ۲",
        date: D.addDays(thisWeekStart, -21),
        pcts: [58, 41, 47, 39, 62],
        rank: 3120
      },
      {
        id: "exm_demo_2",
        name: "آزمون آزمایشی ۳",
        date: D.addDays(thisWeekStart, -7),
        pcts: [67, 52, 55, 46, 68],
        rank: 2260
      },
      {
        id: "exm_demo_3",
        name: "آزمون آزمایشی ۴",
        date: D.addDays(thisWeekStart, 5),
        pcts: null,
        rank: null
      }
    ];

    examDefs.forEach(function (def) {
      state.consultant.exams[def.id] = {
        id: def.id,
        name: def.name,
        date: def.date,
        type: "mock",
        scoreMode: "percentage",
        subjectIds: examSubjects,
        targetPercentage: 65,
        consultantNote:
          def.pcts === null
            ? "برای این آزمون حتماً بخش ژنتیک را مرور کن."
            : "",
        createdAt: D.now()
      };

      if (!def.pcts) return;

      /* Build counts that actually produce the intended Konkur percentage. */
      var subjectResults = examSubjects.map(function (sid, i) {
        var total = [50, 35, 45, 40, 25][i];
        var target = def.pcts[i];
        /* pct = (3c - w) / (3 total) * 100  ->  choose c, derive w. */
        var correct = Math.round((target / 100) * total * 0.92);
        var raw = (target / 100) * 3 * total;
        var wrong = Math.max(0, Math.round(3 * correct - raw));
        wrong = Math.min(wrong, total - correct);
        var unanswered = total - correct - wrong;
        return {
          subjectId: sid,
          totalQuestions: total,
          correct: correct,
          wrong: wrong,
          unanswered: Math.max(0, unanswered),
          score: null,
          percentage: null
        };
      });

      state.student.examResults[def.id] = {
        examId: def.id,
        taken: true,
        rank: def.rank,
        totalParticipants: 42000,
        overallPercentageOverride: null,
        subjectResults: subjectResults,
        analysis: {
          good: "مدیریت زمان در زیست بهتر از آزمون قبل بود.",
          bad: "در ریاضی چند تست ساده را از دست دادم.",
          mistakes: "بی‌دقتی در محاسبات شیمی و جاماندن از وقت در فیزیک.",
          review: "ژنتیک، استوکیومتری، دینامیک",
          time: "۱۰ دقیقه از وقت عمومی را در ادبیات هدر دادم."
        },
        studentNote: "روند صعودی است اما هنوز با درصد هدف فاصله دارم.",
        updatedAt: D.now()
      };
    });

    state.ui.currentWeekId = "wk_demo_2";
    state.ui.view = "dashboard";
    state.meta.planStamp = D.now();

    HDML.store.replace(state);
    return state;
  };

    <script>
/* ===== js/app.js ===== */
(function (global) {
  "use strict";

  var HDML = global.HDML;
  var util = HDML.util;
  var UI = HDML.ui;
  var D = HDML.date;
  var A = HDML.actions;
  var Q = HDML.query;
  var el = UI.el;
  var doc = global.document;

  /* Five sections. That is the whole app as far as the student is concerned;
     everything else lives behind the menu button. */
  var NAV = [
    { id: "today", label: "امروز", emoji: "🏠" },
    { id: "week", label: "هفته", emoji: "📅" },
    { id: "progress", label: "پیشرفت", emoji: "📊" },
    { id: "exams", label: "آزمون‌ها", emoji: "📝" },
    { id: "reports", label: "گزارش", emoji: "📤" }
  ];

  /* Reachable from the menu, never from the main navigation. */
  var HIDDEN_VIEWS = ["dashboard", "consultant", "settings"];

  var app = {
    currentView: "dashboard",
    params: null,
    root: null,
    contentNode: null
  };

  HDML.app = app;

  function visibleNav() {
    return NAV;
  }

  function isKnownView(viewId) {
    return (
      NAV.some(function (n) {
        return n.id === viewId;
      }) || HIDDEN_VIEWS.indexOf(viewId) >= 0
    );
  }

  function navigate(viewId, params) {
    app.currentView = isKnownView(viewId) ? viewId : "today";
    app.params = params || null;
    A.setUi({ view: app.currentView });
    closeDrawer();
    render();
    if (app.contentNode) app.contentNode.scrollIntoView({ block: "start" });
    global.scrollTo(0, 0);
  }

  app.navigate = navigate;

  function buildShell() {
    var sidebar = el("aside", { class: "sidebar", id: "sidebar" });
    var topbar = el("header", { class: "topbar" });
    var content = el("main", { class: "content", id: "main-content", tabindex: "-1" });
    var bottomNav = el("nav", { class: "bottom-nav", "aria-label": "ناوبری اصلی" });
    var backdrop = el("div", {
      class: "drawer-backdrop",
      onclick: closeDrawer
    });

    var main = el("div", { class: "main" }, [topbar, content]);
    var shell = el("div", { class: "app", id: "app-shell" }, [
      sidebar,
      main,
      backdrop,
      bottomNav
    ]);

    app.root = shell;
    app.sidebar = sidebar;
    app.topbar = topbar;
    app.contentNode = content;
    app.bottomNav = bottomNav;
    return shell;
  }

  function renderSidebar() {
    var state = HDML.store.get();

    UI.replace(app.sidebar, [
      el("div", { class: "sidebar__brand" }, [
        el("img", { class: "sidebar__logo", src: HDML.LOGO, alt: "لوگو انیگما" }),
        el("div", {}, [
          el("div", { class: "sidebar__title", text: "ENIGMA" }),
          el("div", { class: "sidebar__subtitle", text: "برنامه‌ی مطالعه‌ی من" })
        ])
      ]),
      el("div", { class: "sidebar__student" }, [
        el("div", { class: "sidebar__student-name", text: Q.studentFullName(state) }),
        (function () {
          var week = Q.currentWeek(state);
          return week
            ? el("div", { class: "sidebar__student-meta", text: week.title })
            : null;
        })()
      ]),
      el(
        "nav",
        { class: "sidebar__nav", "aria-label": "منوی اصلی" },
        NAV.map(function (item) {
          return navButton(item, "nav-item");
        })
      ),
      el("div", { class: "sidebar__footer" }, [
        UI.button("منو", {
          icon: "menu",
          block: true,
          onClick: openMenu
        }),
        state.meta.isDemo
          ? el("div", { class: "mode-chip", style: { "margin-top": "10px" } }, "داده‌ی نمونه")
          : null
      ])
    ]);
  }

  function navButton(item, className) {
    var isActive = app.currentView === item.id;
    var badge = null;

    if (item.id === "today") {
      var todayStats = HDML.stats.dayStatsByDate(D.today());
      if (todayStats) {
        var remaining = todayStats.pendingTasks + todayStats.inProgressTasks;

      "button",
      {

        class: className,
        "aria-current": isActive ? "page" : null,
        onclick: function () {

    var state = HDML.store.get();

      return n.id === app.currentView;

    var runningId = A.runningTaskId();

    UI.replace(app.topbar, [
      el(
        "button",
        {
          class: "hamburger",

        src: HDML.LOGO,

      }),

        el("div", {
          class: "topbar__title",

        el("div", { class: "topbar__sub", text: Q.studentFullName(state) })

                })

            )
          : null,
        UI.iconButton("menu", { title: "منو", onClick: openMenu })
      ])
    ]);
  }

  /** Everything that is not day-to-day studying lives here. */
  function openMenu() {
    closeDrawer();

    function item(emoji, label, hint, onClick) {
      return el(

    UI.openModal({
      title: "منو",
      body: el("div", { class: "menu-list" }, [
        item("📥", "دریافت برنامه جدید", "فایل JSON که مشاورت فرستاده", function () {
          HDML.weekImport.openDialog();
        }),
        item("💾", "ذخیره و دریافت فایل جدید", "یک فایل HTML با همه‌ی اطلاعاتت", function () {
          HDML.transfer.exportStudentHtml();
        }),
        item("📊", "خلاصه‌ی کلی", "نمای کلی هفته", function () {
          navigate("dashboard");
        }),
        item("⚙️", "تنظیمات", "نام، دروس، پشتیبان‌گیری", function () {
          navigate("settings");
        }),
        item("🧑‍🏫", "حالت مشاور", "ساخت و ویرایش برنامه", function () {
          navigate("consultant");
        })
      ]),
      footer: [
        el("div", { class: "modal__foot-start text-xs text-muted" }, [

        ]),

      ]
    });
  }

  app.openMenu = openMenu;

  function openDrawer() {
    app.root.classList.add("is-drawer-open");
  }

  function closeDrawer() {
    app.root.classList.remove("is-drawer-open");
  }

  var renderScheduled = false;

  function render() {
    renderSidebar();
    renderTopbar();
    renderBottomNav();

    var view = HDML.views[app.currentView];
    UI.clear(app.contentNode);

    if (!view) {
      app.contentNode.appendChild(
        UI.empty({ title: "این صفحه پیدا نشد", icon: "alert" })
      );
      return;
    }

    try {
      var node = view({
        navigate: navigate,
        rerender: render,
        params: app.params
      });
      app.params = null;
      app.contentNode.appendChild(node);
    } catch (err) {
      if (global.console) console.error(err);
      app.contentNode.appendChild(
        UI.notice(
          "خطایی در نمایش این صفحه رخ داد: " +
            util.escapeHtml(err && err.message ? err.message : String(err)) +
            "<br>اگر مشکل ادامه داشت، از داده‌ها پشتیبان بگیرید و صفحه را دوباره باز کنید.",
          "danger"

      );
    }

  app.render = render;

  /* setTimeout, not requestAnimationFrame: a hidden or background tab never
     runs rAF callbacks, which would leave the view stale after a mutation. */
  function scheduleRender() {
    if (renderScheduled) return;
    renderScheduled = true;
    setTimeout(function () {
      renderScheduled = false;
      render();
    }, 0);
  }

  /**
   * Charts size their viewBox to the viewport so labels stay readable. When
   * the phone rotates (or a window is resized across a breakpoint) they must
   * be redrawn at the new size.
   */
  function startViewportWatch() {
    var lastBucket = HDML.charts.metrics().W;

    var onResize = util.debounce(function () {
      var bucket = HDML.charts.metrics().W;
      if (bucket !== lastBucket) {
        lastBucket = bucket;
        render();
      }
    }, 220);

    global.addEventListener("resize", onResize);
    global.addEventListener("orientationchange", function () {
      /* iOS reports the old size during the event itself. */
      setTimeout(onResize, 260);
    });
  }

  /**
   * Updates only the running clock text once per second. A full re-render
   * every second would be wasteful and would fight with open inputs.
   */
  function startTicker() {
    setInterval(function () {
      var runningId = A.runningTaskId();
      if (!runningId) return;
      var minutes = A.timerMinutes(runningId);
      var text = HDML.taskUI.formatClock(minutes);
      var nodes = doc.querySelectorAll(
        '[data-timer-for="' + runningId + '"] .timer-value'
      );
      for (var i = 0; i < nodes.length; i++) nodes[i].textContent = text;
    }, 1000);

    /* Persist a running timer before the page goes away so the elapsed time
       is not lost on refresh or close. */
    global.addEventListener("beforeunload", function () {
      var runningId = A.runningTaskId();
      if (runningId) HDML.store.persistNow();
    });
  }

  /**
   * If the page was closed while a timer ran, the elapsed wall-clock time is
   * still recoverable from `startedAt`. Ask instead of silently guessing.
   */
  function handleRecoveredTimer() {
    var state = HDML.store.get();
    var runningId = A.runningTaskId();
    if (!runningId) return;
    var timer = state.student.timers[runningId];
    var task = state.consultant.tasks[runningId];
    if (!timer || !task) return;

    var minutes = Math.max(0, (Date.now() - timer.running.startedAt) / 60000);
    if (minutes < 1) return;

    UI.openModal({
      title: "کرنومتر در حال اجرا بود",
      size: "narrow",
      dismissible: false,
      body: el("div", { class: "stack" }, [
        UI.notice(
          "هنگام بستن صفحه، کرنومتر فعالیت «<strong>" +
            util.escapeHtml(task.title) +
            "</strong>» در حال اجرا بود.",
          "warning"
        ),
        UI.kv("زمان سپری‌شده از آن لحظه", util.fmtDur(minutes)),
        el("p", {
          class: "text-sm text-muted",
          text: "آیا این زمان به‌عنوان مطالعه ثبت شود؟"
        })
      ]),
      footer: [
        UI.button("نه، دور بریز", {
          onClick: function () {
            HDML.store.mutate(function (st) {
              if (st.student.timers[runningId]) {
                st.student.timers[runningId].running = null;
              }
            });
            UI.closeModal();
          }
        }),
        UI.button("بله، ثبت کن", {
          variant: "primary",
          onClick: function () {
            A.stopTimer(runningId);
            UI.closeModal();
            UI.toast("زمان ثبت شد.", "success");
          }
        })
      ]
    });
  }

  function offerPlanUpdate() {
    var pending = HDML.store.pendingPlan;
    if (!pending) return;
    var incomingWeeks = Object.keys(pending.consultant.weeks).length;
    var incomingTasks = Object.keys(pending.consultant.tasks).length;

    UI.openModal({
      title: "برنامه‌ی جدیدی در این فایل هست",
      dismissible: false,
      body: el("div", { class: "stack" }, [
        UI.notice(
          "این فایل شامل برنامه‌ی به‌روزتری نسبت به اطلاعات ذخیره‌شده در این مرورگر است. می‌توانید برنامه را به‌روز کنید؛ <strong>عملکرد ثبت‌شده‌ی شما حفظ می‌شود</strong>.",
          "info"
        ),
        el("div", { class: "card" }, [
          el("div", { class: "card__body" }, [
            UI.kv("تعداد هفته در فایل", util.n(incomingWeeks)),
            UI.kv("تعداد فعالیت در فایل", util.n(incomingTasks)),
            UI.kv(
              "تاریخ برنامه‌ی فایل",
              String(pending.meta.planStamp || "").slice(0, 10)
            )
          ])
        ])
      ]),
      footer: [
        UI.button("فعلاً نه", {
          onClick: function () {
            HDML.store.pendingPlan = null;
            UI.closeModal();
          }
        }),
        UI.button("پشتیبان بگیر", {
          icon: "download",
          onClick: function () {
            HDML.transfer.exportBackup();
          }
        }),
        UI.button("برنامه را به‌روز کن", {
          variant: "primary",
          icon: "refresh",
          onClick: function () {
            HDML.store.adoptPlan(pending);
            UI.closeModal();
            UI.toast("برنامه‌ی جدید اعمال شد.", "success");
          }
        })
      ]
    });
  }

  function readEmbeddedPayload() {
    var node = doc.getElementById("hdml-data");
    if (!node) return null;
    var raw = (node.textContent || "").trim();
    if (!raw || raw === "null") return null;
    try {
      return JSON.parse(raw);
    } catch (err) {
      if (global.console) console.error("embedded payload is not valid JSON", err);
      return null;
    }
  }

  function boot() {
    var mountPoint = doc.getElementById("app-root");
    if (!mountPoint) return;

    /* The static fallback in the HTML is only a placeholder; the real app
       replaces it. If we crash before this point the fallback stays on
       screen, which is the whole point of it being there. */
    var fallback = doc.getElementById("boot-fallback");

    var embedded = readEmbeddedPayload();
    var result = HDML.store.boot(embedded);

    var state = HDML.store.get();
    util.usePersianDigits = state.settings.persianDigits !== false;

    /* Always open on "امروز". Opening the file should always answer the same
       question first: what do I have to do today? */
    app.currentView = "today";

    if (fallback && fallback.parentNode) fallback.parentNode.removeChild(fallback);
    mountPoint.appendChild(buildShell());
    HDML.store.subscribe(scheduleRender);
    render();
    startTicker();

    if (!HDML.store.isStorageAvailable()) {
      UI.toast(
        "حافظه‌ی مرورگر در دسترس نیست؛ اطلاعات ذخیره نمی‌شود. لطفاً خروجی پشتیبان بگیرید.",
        "danger",
        8000
      );
    }

    if (result.newerPlanInFile) {
      setTimeout(offerPlanUpdate, 400);
    } else {
      setTimeout(handleRecoveredTimer, 400);
    }

    doc.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !UI.isModalOpen()) closeDrawer();
    });

    startViewportWatch();
  }

  /**
   * Any exception here would otherwise leave the page showing only the static
   * fallback with no explanation. Surface it through the error boundary.
   */
  function safeBoot() {
    try {
      boot();
    } catch (err) {
      if (global.console) console.error("boot failed", err);
      if (typeof global.__enigmaFail === "function") {
        global.__enigmaFail("Boot", (err && err.message) || String(err));
      }
    }
  }

  if (doc.readyState === "loading") {
    doc.addEventListener("DOMContentLoaded", safeBoot);
  } else {
    safeBoot();
  }
})(typeof window !== "undefined" ? window : globalThis);

    </script>
</body>
