  C.examSubjectTrend = function (seriesList, options) {
    var opts = options || {};
    var M = metrics(opts.viewport);
    var series = (seriesList || []).filter(function (s) {
      return s.points.length >= 2;
    });
    if (!series.length) {
      return emptyChart("برای روند درسی، حداقل دو آزمون با نتیجه لازم است");
    }

    var W = opts.width || M.W;
    var H = opts.height || (M.narrow ? 220 : 250);
    var padTop = 16;
    var padBottom = 38;
    var padRight = M.narrow ? 34 : 42;
    var plotW = W - padRight - 8;
    var plotH = H - padTop - padBottom;

    var allDates = {};
    series.forEach(function (s) {
      s.points.forEach(function (p) {
        allDates[p.date] = p.label;
      });
    });
    var dates = Object.keys(allDates).sort();

    var allVals = [];
    series.forEach(function (s) {
      s.points.forEach(function (p) {
        allVals.push(p.value);
      });
    });
    var lo = Math.floor(Math.min.apply(null, allVals.concat([0])) / 10) * 10;
    var hi = Math.ceil((Math.max.apply(null, allVals) * 1.1) / 10) * 10;
    if (hi <= lo) hi = lo + 20;

    var xAt = function (date) {
      var i = dates.indexOf(date);
      return dates.length === 1 ? plotW / 2 : plotW - (i / (dates.length - 1)) * plotW;
    };
    var yAt = function (v) {
      return plotH - ((v - lo) / (hi - lo)) * plotH;
    };

    var svg = chartRoot(W, H, "روند درصد هر درس در آزمون‌ها");
    var g = svgEl("g", { transform: "translate(8," + padTop + ")" });

    for (var i = 0; i <= M.ticks; i++) {
      var v = lo + ((hi - lo) / M.ticks) * i;
      var y = yAt(v);
      g.appendChild(
        svgEl("line", { x1: 0, x2: plotW, y1: y, y2: y, stroke: PALETTE.grid, "stroke-width": 1 })
      );
      g.appendChild(
        text(util.n(util.round(v, 0)) + "٪", plotW + padRight / 2, y + 4, {
          fill: PALETTE.textSoft,
          "font-size": M.fsSmall
        })
      );
    }

    series.forEach(function (s) {
      var sorted = s.points.slice().sort(function (a, b) {
        return a.date < b.date ? -1 : 1;
      });
      g.appendChild(
        svgEl("polyline", {
          points: sorted
            .map(function (p) {
              return xAt(p.date) + "," + yAt(p.value);
            })
            .join(" "),
          fill: "none",
          stroke: s.color,
          "stroke-width": 2,
          "stroke-linejoin": "round"
        })
      );
      sorted.forEach(function (p) {
        g.appendChild(
          withTitle(
            svgEl("circle", { cx: xAt(p.date), cy: yAt(p.value), r: 3, fill: s.color }),
            s.name + " — " + p.label + ": " + util.fmtPct(p.value)
          )
        );
      });
    });

    var every = Math.ceil(dates.length / Math.max(2, Math.floor(plotW / 58)));
    dates.forEach(function (dt, idx) {
      if (idx % every !== 0 && idx !== dates.length - 1) return;
      g.appendChild(
        text(util.truncate(allDates[dt], M.narrow ? 8 : 10), xAt(dt), plotH + 16, {
          fill: PALETTE.textSoft,
          "font-size": M.fsSmall,
          direction: "rtl"
        })
      );
    });

    g.appendChild(
      svgEl("line", {
        x1: 0,
        x2: plotW,
        y1: plotH,
        y2: plotH,
        stroke: PALETTE.axis,
        "stroke-width": 1
      })
    );

    svg.appendChild(g);

    return UI.el("div", {}, [
      UI.el("div", { class: "chart-box" }, svg),
      legend(
        series.map(function (s) {
          return { label: s.name, color: s.color };
        })
      )
    ]);
  };

  C.completionDonut = function (agg, options) {
    var opts = options || {};
    var M = metrics(opts.viewport);
    var total = agg.totalTasks;
    if (!total) return emptyChart("هنوز کاری تعریف نشده است");

    var size = opts.size || (M.narrow ? 170 : 190);
    var cx = size / 2;
    var cy = size / 2;
    var r = size / 2 - 16;
    var stroke = 20;

    var slices = [
      { label: "انجام‌شده", value: agg.completedTasks, color: "#16875a" },
      { label: "در حال انجام", value: agg.inProgressTasks, color: "#2368e7" },
      { label: "انجام‌نشد", value: agg.skippedTasks, color: "#b06f0a" },
      { label: "مانده", value: agg.pendingTasks, color: "#dfe4ee" }
    ].filter(function (s) {
      return s.value > 0;
    });

    var svg = chartRoot(size, size, "توزیع وضعیت کارها");
    svg.setAttribute("width", size);
    svg.setAttribute("height", size);

    var circumference = 2 * Math.PI * r;
    var offset = 0;

    slices.forEach(function (s) {
      var len = (s.value / total) * circumference;
      svg.appendChild(
        withTitle(
          svgEl("circle", {
            cx: cx,
            cy: cy,
            r: r,
            fill: "none",
            stroke: s.color,
            "stroke-width": stroke,
            "stroke-dasharray": len + " " + (circumference - len),
            "stroke-dashoffset": -offset,
            transform: "rotate(-90 " + cx + " " + cy + ")"
          }),
          s.label + ": " + util.n(s.value) + " کار"
        )
      );
      offset += len;
    });

    svg.appendChild(
      text(util.n(agg.completedTasks) + "/" + util.n(total), cx, cy + 2, {
        "font-size": "19",
        "font-weight": "700",
        fill: PALETTE.navy
      })
    );
    svg.appendChild(
      text("انجام‌شده", cx, cy + 19, {
        "font-size": "11",
        fill: PALETTE.textSoft,
        direction: "rtl"
      })
    );

    return UI.el("div", { style: { display: "flex", "justify-content": "center" } }, [
      UI.el("div", {}, [
        svg,
        legend(
          slices.map(function (s) {
            return { label: s.label + " (" + util.n(s.value) + ")", color: s.color };
          })
        )
      ])
    ]);
  };
})(typeof window !== "undefined" ? window : globalThis);

    </script>
    <script>
/* ===== js/transfer.js ===== */
/* ==========================================================================
   transfer.js - export / import

   The lifecycle this implements:
     consultant builds plan
       -> "خروجی HTML دانش‌آموز"  (a self-contained copy of THIS app + plan)
       -> student works in that file
       -> "خروجی عملکرد" (activity JSON)
       -> consultant imports it, reviews, builds next week
   ========================================================================== */
(function (global) {
  "use strict";

  var HDML = global.HDML;
  var util = HDML.util;
  var UI = HDML.ui;
  var D = HDML.date;
  var Q = HDML.query;
  var el = UI.el;

  var TR = (HDML.transfer = {});

  var DATA_TAG_OPEN = '<script id="hdml-data" type="application/json">';
  var DATA_TAG_CLOSE = "<\/script>";

  TR.downloadFile = function (content, filename, mime) {
    try {
      var blob = new global.Blob([content], {
        type: mime || "application/octet-stream"
      });
      var url = global.URL.createObjectURL(blob);
      var a = global.document.createElement("a");
      a.href = url;
      a.download = filename;
      a.style.display = "none";
      global.document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        global.document.body.removeChild(a);
        global.URL.revokeObjectURL(url);
      }, 1200);
      return true;
    } catch (err) {
      if (global.console) console.error(err);
      UI.toast(
        "ذخیره‌ی فایل ناموفق بود. مرورگر اجازه‌ی دانلود نداد.",
        "danger",
        5000
      );
      return false;
    }
  };

  function stamp() {
    var j = D.jalaliOf(D.today());
    function p(n) {
      return n < 10 ? "0" + n : String(n);
    }
    return j.jy + "-" + p(j.jm) + "-" + p(j.jd);
  }

  function studentSlug() {
    return HDML.reports.sanitizeFilename(Q.studentFullName() || "student");
  }

  /** JSON that can live safely inside a <script> tag. */
  function safeJson(value) {
    return JSON.stringify(value).replace(/</g, "\\u003c");
  }

  TR.safeJson = safeJson;

  /**
   * Rewrites the payload inside a pristine copy of this document.
   * @returns {string|null} full HTML, or null when the tag is missing
   */
  TR.embedPayload = function (html, payload) {
    var startIdx = html.indexOf(DATA_TAG_OPEN);
    if (startIdx < 0) return null;
    var contentStart = startIdx + DATA_TAG_OPEN.length;
    var endIdx = html.indexOf(DATA_TAG_CLOSE, contentStart);
    if (endIdx < 0) return null;
    return (
      html.slice(0, contentStart) + safeJson(payload) + html.slice(endIdx)
    );
  };

  TR.exportStudentHtml = function () {
    var state = HDML.store.get();

    if (!HDML.PRISTINE_HTML) {
      UI.toast("امکان ساخت فایل خروجی در این حالت وجود ندارد.", "danger");
      return;
    }
    if (HDML.IS_MULTIFILE) {
      UI.confirm({
        title: "این نسخه، نسخه‌ی توسعه است",
        message:
          "شما نسخه‌ی چندفایلی (<code>src/index.html</code>) را باز کرده‌اید. فایل خروجی به CSS و JS بیرونی وابسته می‌ماند و روی رایانه‌ی دانش‌آموز کار نمی‌کند.",
        detail:
          "برای تحویل به دانش‌آموز، فایل تک‌فایلی <strong>dist/student.html</strong> را باز کنید و از همان‌جا خروجی بگیرید.",
        confirmLabel: "با این‌حال خروجی بگیر",
        danger: true
      }).then(function (ok) {
        if (ok) doExportStudentHtml(state);
      });
      return;
    }
    doExportStudentHtml(state);
  };

  function doExportStudentHtml(state) {
    var includeActivity = { value: false };

    includeActivity.value = true;

    var form = el("div", { class: "stack" }, [
      UI.notice(
        "یک فایل HTML ساخته می‌شود که <strong>همه‌چیز داخل خودش است</strong>: برنامه، کارهای انجام‌شده، زمان مطالعه، تست‌ها، آزمون‌ها و یادداشت‌ها. هر وقت این فایل را باز کنی، همه‌چیز سر جایش است.",
        "info"
      ),
      el("label", { class: "check-row" }, [
        (function () {
          var cb = el("input", {
            type: "checkbox",
            onchange: function (e) {
              includeActivity.value = e.target.checked;
            }
          });
          cb.checked = true;
          return cb;
        })(),
        el("span", { text: "کارهای انجام‌شده و نتایج من هم داخل فایل باشد" })
      ]),
      UI.notice(
        "اگر تیک بالا را برداری، فایل فقط شامل برنامه می‌شود (مناسب برای وقتی می‌خواهی برنامه را به کسی بدهی).",
        "warning"
      )
    ]);

    UI.openModal({
      title: "💾 ذخیره و دریافت فایل جدید",
      body: form,
      footer: [
        UI.button("بستن", { onClick: UI.closeModal }),
        UI.button("ساخت فایل", {
          variant: "primary",
          size: "lg",
          icon: "download",
          onClick: function () {
            var payload = util.clone(state);
            payload.meta.exportedForStudent = true;
            payload.meta.exportedAt = D.now();
            payload.ui = {
              view: "today",
              currentWeekId: HDML.store.pickCurrentWeek(payload),
              selectedDate: null,
              taskFilter: { status: "all", subjectId: "all", type: "all" },
              consultantUnlocked: false
            };

            if (!includeActivity.value) {
              payload.student = {
                taskLogs: {},
                timers: {},
                dailyNotes: {},
                weeklyReflections: {},
                examResults: {}
              };
            }

            var html = TR.embedPayload(HDML.PRISTINE_HTML, payload);
            if (!html) {
              UI.toast("ساخت فایل ناموفق بود.", "danger");
              return;
            }
            /* e.g. ENIGMA-امیر-رضایی-هفته-۳-Updated.html */
            var week = Q.currentWeek(state);
            var weekPart = week
              ? "-" + HDML.reports.sanitizeFilename(week.title)
              : "";
            TR.downloadFile(
              html,
              "ENIGMA-" + studentSlug() + weekPart + "-Updated.html",
              "text/html;charset=utf-8"
            );
            UI.closeModal();
            UI.toast("فایل ساخته شد. در پوشه‌ی دانلودها پیدایش می‌کنی.", "success", 4500);
          }
        })
      ]
    });
  }

  /** Student performance only - what the consultant imports back. */
  TR.exportActivity = function () {
    var state = HDML.store.get();
    var payload = {
      kind: "hdml-activity",
      schemaVersion: HDML.SCHEMA_VERSION,
      appVersion: HDML.VERSION,
      exportedAt: D.now(),
      studentId: state.consultant.student.id,
      studentName: Q.studentFullName(state),
      planStamp: state.meta.planStamp,
      weeks: Q.weeksSorted(state).map(function (w) {
        return { id: w.id, title: w.title, startDate: w.startDate, endDate: w.endDate };
      }),
      student: util.clone(state.student)
    };
    TR.downloadFile(
      JSON.stringify(payload, null, 2),
      "ENIGMA-" + studentSlug() + "-" + stamp() + "-activity.json",
      "application/json"
    );
    UI.toast("فایل عملکرد ذخیره شد.", "success");
  };

  /** Everything - the safety net before any destructive action. */
  TR.exportBackup = function () {
    var state = HDML.store.get();
    var payload = {
      kind: "hdml-backup",
      schemaVersion: HDML.SCHEMA_VERSION,
      appVersion: HDML.VERSION,
      exportedAt: D.now(),
      state: util.clone(state)
    };
    TR.downloadFile(
      JSON.stringify(payload, null, 2),
      "ENIGMA-" + studentSlug() + "-" + stamp() + "-backup.json",
      "application/json"
    );
    UI.toast("پشتیبان ذخیره شد.", "success");
  };

  /**
   * Structural validation. Returns { ok, kind, errors[], warnings[], info{} }.
   * A failed validation NEVER touches existing data.
   */
  TR.validateImport = function (raw) {
    var result = { ok: false, kind: null, errors: [], warnings: [], info: {} };

    if (!util.isObject(raw)) {
      result.errors.push("فایل واردشده یک شیء JSON معتبر نیست.");
      return result;
    }

    var state = HDML.store.get();

    if (raw.kind === "hdml-backup" || (raw.state && raw.state.consultant)) {
      result.kind = "backup";
      var st = raw.state;
      if (!util.isObject(st) || !util.isObject(st.consultant) || !util.isObject(st.student)) {
        result.errors.push("ساختار پشتیبان ناقص است (بخش consultant یا student یافت نشد).");
        return result;
      }
      result.info = {
        studentName:
          ((st.consultant.student && st.consultant.student.firstName) || "") +
          " " +
          ((st.consultant.student && st.consultant.student.lastName) || ""),
        weeks: Object.keys(st.consultant.weeks || {}).length,
        tasks: Object.keys(st.consultant.tasks || {}).length,
        exams: Object.keys(st.consultant.exams || {}).length,
        logs: Object.keys(st.student.taskLogs || {}).length,
        exportedAt: raw.exportedAt || (st.meta && st.meta.updatedAt) || null
      };
      if (raw.schemaVersion && raw.schemaVersion > HDML.SCHEMA_VERSION) {
        result.warnings.push(
          "این فایل با نسخه‌ی جدیدتری از برنامه ساخته شده است؛ ممکن است بخشی از اطلاعات پشتیبانی نشود."
        );
      }
      result.ok = true;
      return result;
    }

    if (raw.kind === "hdml-activity" || (raw.student && !raw.consultant)) {
      result.kind = "activity";
      var s = raw.student;
      if (!util.isObject(s) || !util.isObject(s.taskLogs)) {
        result.errors.push("ساختار فایل عملکرد ناقص است (بخش taskLogs یافت نشد).");
        return result;
      }

      var logIds = Object.keys(s.taskLogs);
      var known = 0;
      var unknown = 0;
      logIds.forEach(function (id) {
        if (state.consultant.tasks[id]) known++;
        else unknown++;
      });

      var badLogs = 0;
      logIds.forEach(function (id) {
        var log = s.taskLogs[id];
        if (!util.isObject(log)) {
          badLogs++;
          return;
        }
        if (
          log.actualMinutes !== null &&
          log.actualMinutes !== undefined &&
          (!isFinite(log.actualMinutes) || log.actualMinutes < 0)
        ) {
          badLogs++;
        }
      });

      if (badLogs) {
        result.errors.push(
          util.n(badLogs) + " رکورد عملکرد مقدار نامعتبر دارد. ورود اطلاعات انجام نشد."
        );
        return result;
      }

      if (raw.studentId && raw.studentId !== state.consultant.student.id) {
        result.warnings.push(
          "شناسه‌ی دانش‌آموز این فایل با دانش‌آموز فعلی یکسان نیست" +
            (raw.studentName ? " (فایل: " + raw.studentName + ")" : "") +
            ". مطمئن شوید فایل درست را انتخاب کرده‌اید."
        );
      }
      if (unknown) {
        result.warnings.push(
          util.n(unknown) +
            " رکورد مربوط به فعالیت‌هایی است که در برنامه‌ی فعلی وجود ندارند و نادیده گرفته می‌شوند."
        );
      }
      if (!known) {
        result.warnings.push(
          "هیچ‌کدام از رکوردها با فعالیت‌های برنامه‌ی فعلی مطابقت ندارند. احتمالاً فایل مربوط به برنامه‌ی دیگری است."
        );
      }

      result.info = {
        studentName: raw.studentName || "—",
        logs: logIds.length,
        matched: known,
        unmatched: unknown,
        exams: Object.keys(s.examResults || {}).length,
        notes: Object.keys(s.dailyNotes || {}).length,
        exportedAt: raw.exportedAt || null
      };
      result.ok = true;
      return result;
    }

    result.errors.push(
      "نوع فایل شناسایی نشد. فایل باید خروجی «عملکرد» یا «پشتیبان» همین برنامه باشد."
    );
    return result;
  };

  TR.openImportDialog = function (expectedKind) {
    var input = el("input", {
      type: "file",
      accept: ".json,application/json",
      class: "input",
      onchange: function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        var reader = new global.FileReader();
        reader.onload = function () {
          var raw;
          try {
            raw = JSON.parse(reader.result);
          } catch (err) {
            showResult(
              null,
              ["فایل انتخاب‌شده JSON معتبر نیست و خوانده نشد."],
              null
            );
            return;
          }
          var validation = TR.validateImport(raw);
          if (!validation.ok) {
            showResult(null, validation.errors, null);
            return;
          }
          if (expectedKind && validation.kind !== expectedKind) {
            showResult(
              null,
              [
                expectedKind === "activity"
                  ? "این فایل، فایل عملکرد دانش‌آموز نیست."
                  : "این فایل، فایل پشتیبان نیست."
              ],
              null
            );
            return;
          }
          showResult(raw, [], validation);
        };
        reader.onerror = function () {
          showResult(null, ["خواندن فایل ناموفق بود."], null);
        };
        reader.readAsText(file);
      }
    });

    var resultBox = el("div", { class: "stack" });

    function showResult(raw, errors, validation) {
      UI.clear(resultBox);
      if (errors && errors.length) {
        errors.forEach(function (msg) {
          resultBox.appendChild(UI.notice(util.escapeHtml(msg), "danger"));
        });
        resultBox.appendChild(
          UI.notice("هیچ تغییری در اطلاعات فعلی ایجاد نشد.", "info")
        );
        return;
      }
      if (!validation) return;

      var info = validation.info;
      resultBox.appendChild(
        UI.notice(
          "فایل معتبر است. پیش از تأیید، خلاصه‌ی زیر را بررسی کنید.",
          "success"
        )
      );
      validation.warnings.forEach(function (w) {
        resultBox.appendChild(UI.notice(util.escapeHtml(w), "warning"));
      });

      var rows =
        validation.kind === "backup"
          ? [
              ["دانش‌آموز", (info.studentName || "").trim() || "—"],
              ["تعداد هفته", util.n(info.weeks)],
              ["تعداد فعالیت", util.n(info.tasks)],
              ["تعداد آزمون", util.n(info.exams)],
              ["رکورد عملکرد", util.n(info.logs)]
            ]
          : [
              ["دانش‌آموز", info.studentName],
              ["رکورد عملکرد", util.n(info.logs)],
              ["منطبق با برنامه‌ی فعلی", util.n(info.matched)],
              ["بدون تطابق", util.n(info.unmatched)],
              ["نتیجه‌ی آزمون", util.n(info.exams)],
              ["یادداشت روزانه", util.n(info.notes)]
            ];

      if (info.exportedAt) {
        rows.push(["تاریخ خروجی", String(info.exportedAt).slice(0, 10)]);
      }

      resultBox.appendChild(
        el(
          "div",
          { class: "card" },
          el(
            "div",
            { class: "card__body" },
            rows.map(function (r) {
              return UI.kv(r[0], r[1]);
            })
          )
        )
      );

      if (validation.kind === "activity") {
        resultBox.appendChild(
          el("div", { class: "btn-row" }, [
            UI.button("ادغام با اطلاعات فعلی", {
              variant: "primary",
              icon: "upload",
              onClick: function () {
                applyActivity(raw, "merge");
              }
            }),
            UI.button("جایگزینی کامل عملکرد", {
              variant: "danger-ghost",
              icon: "refresh",
              onClick: function () {
                UI.confirm({
                  title: "جایگزینی عملکرد",
                  message:
                    "همه‌ی عملکرد ثبت‌شده‌ی فعلی پاک و با محتوای این فایل جایگزین می‌شود. برنامه‌ی مشاور دست‌نخورده می‌ماند.",
                  danger: true,
                  confirmLabel: "جایگزین کن"
                }).then(function (ok) {
                  if (ok) applyActivity(raw, "replace");
                });
              }
            })
          ])
        );
        resultBox.appendChild(
          UI.notice(
            "<strong>ادغام:</strong> رکوردهای فایل روی رکوردهای هم‌نام نوشته می‌شود و بقیه دست‌نخورده می‌مانند.<br><strong>جایگزینی:</strong> کل عملکرد فعلی با فایل عوض می‌شود.",
            "info"
          )
        );
      } else {
        resultBox.appendChild(
          UI.button("بازیابی کامل از پشتیبان", {
            variant: "danger-ghost",
            icon: "upload",
            onClick: function () {
              UI.confirm({
                title: "بازیابی از پشتیبان",
                message:
                  "کل اطلاعات فعلی (برنامه و عملکرد) با محتوای این پشتیبان جایگزین می‌شود.",
                detail: "پیش از ادامه، از وضعیت فعلی پشتیبان بگیرید.",
                danger: true,
                confirmLabel: "بازیابی کن"
              }).then(function (ok) {
                if (!ok) return;
                var next = HDML.store.normalize(raw.state);
                HDML.store.replace(next);
                util.usePersianDigits = next.settings.persianDigits !== false;
                UI.closeModal();
                UI.toast("پشتیبان بازیابی شد.", "success");
              });
            }
          })
        );
      }
    }

    function applyActivity(raw, mode) {
      var incoming = raw.student;
      HDML.store.mutate(function (st) {
        if (mode === "replace") {
          st.student = {
            taskLogs: {},
            timers: {},
            dailyNotes: {},
            weeklyReflections: {},
            examResults: {}
          };
        }
        ["taskLogs", "timers", "dailyNotes", "weeklyReflections", "examResults"].forEach(
          function (key) {
            var src = incoming[key];
            if (!util.isObject(src)) return;
            Object.keys(src).forEach(function (id) {
              st.student[key][id] = src[id];
            });
          }
        );
        /* A restored timer must never come back "running". */
        Object.keys(st.student.timers).forEach(function (id) {
          if (st.student.timers[id]) st.student.timers[id].running = null;
        });
      });
      UI.closeModal();
      UI.toast("عملکرد دانش‌آموز وارد شد.", "success");
    }

    UI.openModal({
      title:
        expectedKind === "activity"
          ? "ورود عملکرد دانش‌آموز"
          : expectedKind === "backup"
          ? "بازیابی از پشتیبان"
          : "ورود اطلاعات",
      size: "wide",
      body: el("div", { class: "stack" }, [
        el("div", { class: "field" }, [
          el("span", { class: "field__label", text: "انتخاب فایل JSON" }),
          input,
          el("div", {
            class: "field__hint",
            text: "فایل ابتدا بررسی و پیش‌نمایش می‌شود؛ تا زمان تأیید شما هیچ تغییری اعمال نمی‌گردد."
          })
        ]),
        resultBox
      ]),
      footer: [UI.button("بستن", { onClick: UI.closeModal })]
    });
  };
})(typeof window !== "undefined" ? window : globalThis);

    </script>
    <script>
/* ===== js/week-import.js ===== */
/* ==========================================================================
   week-import.js - "وارد کردن برنامه جدید"

   The consultant prepares next week as a small, human-readable JSON file
   (see examples/ENIGMA-Week-03.json). The student picks the file and the week
   appears in the app. After importing, the HTML no longer needs the JSON.
   ========================================================================== */
(function (global) {
  "use strict";

  var HDML = global.HDML;
  var util = HDML.util;
  var UI = HDML.ui;
  var D = HDML.date;
  var A = HDML.actions;
  var el = UI.el;

  var W = (HDML.weekImport = {});

  /* Persian day names -> index (Saturday = 0), plus a few spellings. */
  var DAY_ALIASES = {
    "شنبه": 0,
    "يكشنبه": 1,
    "یکشنبه": 1,
    "یک‌شنبه": 1,
    "دوشنبه": 2,
    "دو‌شنبه": 2,
    "سه‌شنبه": 3,
    "سه شنبه": 3,
    "سهشنبه": 3,
    "چهارشنبه": 4,
    "چهار‌شنبه": 4,
    "پنجشنبه": 5,
    "پنج‌شنبه": 5,
    "پنج شنبه": 5,
    "جمعه": 6
  };

  /* Friendly Persian task types -> internal ids. */
  var TYPE_ALIASES = {
    "درس": "study",
    "مطالعه": "study",
    "درسنامه": "study",
    "تست": "practice",
    "تمرین": "practice",
    "آزمونک": "test",
    "دوره": "review",
    "مرور": "review",
    "جمع‌بندی": "summary",
    "جمع بندی": "summary",
    "خلاصه‌نویسی": "summary",
    "تحلیل آزمون": "exam_analysis",
    "سایر": "other"
  };

  W.DAY_ALIASES = DAY_ALIASES;
  W.TYPE_ALIASES = TYPE_ALIASES;

  function normalizeDay(value, fallbackIndex) {
    if (typeof value === "number" && value >= 0 && value <= 6) return value;
    var key = String(value == null ? "" : value).trim().replace(/\s+/g, " ");
    if (DAY_ALIASES[key] !== undefined) return DAY_ALIASES[key];
    var stripped = key.replace(/[‌\s]/g, "");
    var names = Object.keys(DAY_ALIASES);
    for (var i = 0; i < names.length; i++) {
      if (names[i].replace(/[‌\s]/g, "") === stripped) return DAY_ALIASES[names[i]];
    }
    return fallbackIndex === undefined ? null : fallbackIndex;
  }

  function normalizeType(value) {
    var key = String(value == null ? "" : value).trim();
    if (!key) return "study";
    if (TYPE_ALIASES[key]) return TYPE_ALIASES[key];
    for (var i = 0; i < HDML.TASK_TYPES.length; i++) {
      if (HDML.TASK_TYPES[i].id === key) return key;
    }
    return "study";
  }

  /** Accepts "1405/06/07", "۱۴۰۵/۰۶/۰۷" or a Gregorian "2026-08-29". */
  function normalizeStartDate(value) {
    var raw = String(value == null ? "" : value).trim();
    if (!raw) return null;
    if (D.isValidISO(raw)) return D.weekStart(raw);
    var iso = D.jalaliInputToISO(raw);
    return iso ? D.weekStart(iso) : null;
  }

  /**
   * Validates and normalises a plan file.
   * @returns {{ok:boolean, errors:string[], warnings:string[], plan?:Object}}
   */
  W.parse = function (raw) {
    var errors = [];
    var warnings = [];

    if (!util.isObject(raw)) {
      return { ok: false, errors: ["فایل انتخاب‌شده یک فایل برنامه‌ی معتبر نیست."], warnings: [] };
    }

    /* An activity or backup file is a different thing - say so clearly. */
    if (raw.kind === "hdml-activity" || raw.kind === "hdml-backup") {
      return {
        ok: false,
        errors: [
          "این فایل، فایل برنامه‌ی هفته نیست (فایل عملکرد یا پشتیبان است). از بخش تنظیمات استفاده کنید."
        ],
        warnings: []
      };
    }

    var weekBlock = util.isObject(raw.week) ? raw.week : {};
    var daysRaw = raw.days;
    if (!Array.isArray(daysRaw) || !daysRaw.length) {
      errors.push("در این فایل هیچ روزی تعریف نشده است (بخش days خالی است).");
    }

    var startDate = normalizeStartDate(weekBlock.startDate || raw.startDate);
    if (!startDate) {
      errors.push(
        "تاریخ شروع هفته نامعتبر است. نمونه‌ی درست: \"startDate\": \"۱۴۰۵/۰۶/۰۷\""
      );
    }

    if (errors.length) return { ok: false, errors: errors, warnings: warnings };

    var days = [];
    var totalTasks = 0;
    var totalMinutes = 0;
    var subjects = {};
    var usedDow = {};

    daysRaw.forEach(function (dayRaw, index) {
      if (!util.isObject(dayRaw)) {
        warnings.push("روز شماره‌ی " + util.n(index + 1) + " نادیده گرفته شد (ساختار نادرست).");
        return;
      }
      var dow = normalizeDay(dayRaw.day !== undefined ? dayRaw.day : dayRaw.name, null);
      if (dow === null) {
        warnings.push(
          "نام روز «" + util.escapeHtml(String(dayRaw.day || "")) + "» شناخته نشد و نادیده گرفته شد."
        );
        return;
      }
      if (usedDow[dow]) {
        warnings.push("روز «" + D.WEEK_DAYS[dow] + "» بیش از یک بار آمده و ادغام شد.");
      }
      usedDow[dow] = true;

      var tasksRaw = Array.isArray(dayRaw.tasks) ? dayRaw.tasks : [];
      var tasks = [];

      tasksRaw.forEach(function (t, ti) {
        if (!util.isObject(t)) return;
        var title = String(t.title || t.task || "").trim();
        if (!title) {
          warnings.push(
            "یک فعالیت در روز «" + D.WEEK_DAYS[dow] + "» بدون عنوان بود و نادیده گرفته شد."
          );
          return;
        }
        var minutes = util.toInt(
          t.minutes !== undefined ? t.minutes : t.plannedMinutes,
          0
        );
        if (minutes < 0 || minutes > 1440) {
          warnings.push(
            "زمان فعالیت «" + util.escapeHtml(title) + "» نامعتبر بود و صفر در نظر گرفته شد."
          );
          minutes = 0;
        }
        var questions = util.toInt(
          t.questions !== undefined ? t.questions : t.targetQuestions,
          0
        );
        if (questions < 0) questions = 0;

        var subject = String(t.subject || "سایر").trim() || "سایر";
        subjects[subject] = true;

        tasks.push({
          subject: subject,
          topic: String(t.topic || "").trim(),
          title: title,
          description: String(t.description || "").trim(),
          type: normalizeType(t.type),
          plannedMinutes: minutes,
          targetQuestions: questions,
          startTime: String(t.startTime || t.time || "").trim(),
          priority: t.priority === "high" || t.priority === "زیاد" ? "high" : "normal",
          note: String(t.note || t.consultantNote || "").trim()
        });

        totalTasks += 1;
        totalMinutes += minutes;
      });

      days.push({
        dowIndex: dow,
        note: String(dayRaw.note || "").trim(),
        tasks: tasks
      });
    });

    if (!totalTasks) {
      return {
        ok: false,
        errors: ["در این فایل هیچ فعالیتی پیدا نشد."],
        warnings: warnings
      };
    }

    var studentBlock = util.isObject(raw.student) ? raw.student : {};

    return {
      ok: true,
      errors: [],
      warnings: warnings,
      plan: {
        title: String(weekBlock.title || raw.title || "").trim() || "هفته‌ی جدید",
        startDate: startDate,
        endDate: D.addDays(startDate, 6),
        weekNote: String(weekBlock.note || "").trim(),
        studentName: String(studentBlock.name || raw.studentName || "").trim(),
        consultantName: String(studentBlock.consultant || raw.consultantName || "").trim(),
        days: days,
        summary: {
          tasks: totalTasks,
          minutes: totalMinutes,
          days: days.filter(function (d) {
            return d.tasks.length;
          }).length,
          subjects: Object.keys(subjects)
        }
      }
    };
  };

  /**
   * Reads a chosen file and routes it to the preview or an error dialog.
   * Everything is local: FileReader only, never a network request.
   */
  function handleFile(file) {
    if (!file) return;

    if (!/\.json$/i.test(file.name) && file.type.indexOf("json") < 0) {
      showErrorDialog([
        "فایل انتخاب‌شده «" +
          util.escapeHtml(file.name) +
          "» یک فایل برنامه (json.) نیست."
      ]);
      return;
    }

    var reader;
    try {
      reader = new global.FileReader();
    } catch (err) {
      showErrorDialog(["مرورگر شما امکان خواندن فایل را ندارد."]);
      return;
    }

    reader.onload = function () {
      var raw;
      try {
        raw = JSON.parse(String(reader.result));
      } catch (err) {
        showErrorDialog(["فایل انتخاب‌شده خراب است و خوانده نشد."]);
        return;
      }
      var parsed = W.parse(raw);
      if (!parsed.ok) {
        showErrorDialog(parsed.errors, parsed.warnings);
        return;
      }
      showPreviewDialog(parsed);
    };

    reader.onerror = function () {
      showErrorDialog(["خواندن فایل ممکن نشد. دوباره تلاش کن."]);
    };

    try {
      reader.readAsText(file);
    } catch (err) {
      showErrorDialog(["خواندن فایل ممکن نشد: " + (err.message || "")]);
    }
  }

  /**
   * A big, obviously tappable control that IS the file input.
   *
   * Deliberately a <label> wrapping a hidden <input type="file">: tapping a
   * label natively opens the OS file picker on Android and iOS with a single
   * tap, with no scripted .click() that a mobile browser might block for not
   * being a trusted gesture.
   *
   * @param {{title:string, hint?:string, small?:boolean}} config
   */
  W.picker = function (config) {
    var input = el("input", {
      type: "file",
      accept: ".json,application/json",
      class: "file-input",
      /* Re-selecting the same file must still fire change. */
      onclick: function (e) {
        e.target.value = "";
      },
      onchange: function (e) {
        var file = e.target.files && e.target.files[0];
        e.target.value = "";
        handleFile(file);
      }
    });

    return el(
      "label",
      { class: "file-cta" + (config.small ? " file-cta--small" : "") },
      [
        el("span", { class: "file-cta__icon", text: "📥" }),
        el("span", { class: "file-cta__body" }, [
          el("span", { class: "file-cta__title", text: config.title }),
          config.hint ? el("span", { class: "file-cta__hint", text: config.hint }) : null
        ]),
        input
      ]
    );
  };

  function showErrorDialog(errors, warnings) {
    UI.openModal({
      title: "این فایل خوانده نشد",
      body: el("div", { class: "stack" }, [
        el(
          "div",
          { class: "stack stack--sm" },
          (errors || []).map(function (msg) {
            return UI.notice(util.escapeHtml(msg), "danger");
          })
        ),
        el(
          "div",
          { class: "stack stack--sm" },
          (warnings || []).map(function (msg) {
            return UI.notice(util.escapeHtml(msg), "warning");
          })
        ),
        UI.notice("هیچ تغییری در برنامه‌ی فعلی تو ایجاد نشد.", "info"),
        W.picker({ title: "انتخاب یک فایل دیگر", small: true })
      ]),
      footer: [UI.button("بستن", { onClick: UI.closeModal })]
    });
  }

  function showPreviewDialog(parsed) {
    var plan = parsed.plan;

    var body = el("div", { class: "stack" }, [
      UI.notice("فایل سالم است. یک نگاه بینداز و بعد تأیید کن.", "success"),
      el(
        "div",
        { class: "stack stack--sm" },
        parsed.warnings.map(function (msg) {
          return UI.notice(util.escapeHtml(msg), "warning");
        })
      ),
      el("div", { class: "simple-card" }, [
        el("div", { class: "simple-card__title", text: plan.title }),
        el("div", {
          class: "simple-card__sub",
          text: D.formatRange(plan.startDate, plan.endDate)
        }),
        el("div", { class: "big-stats", style: { "margin-top": "14px" } }, [
          bigStat(util.n(plan.summary.tasks), "کار"),
          bigStat(util.fmtHours(plan.summary.minutes), "ساعت"),
          bigStat(util.n(plan.summary.days), "روز")
        ]),
        el(
          "div",
          { class: "row", style: { "margin-top": "14px" } },
          plan.summary.subjects.slice(0, 12).map(function (name) {
            return UI.badge(name, "muted");
          })
        )
      ]),
      el(
        "div",
        { class: "stack stack--sm" },
        plan.days
          .filter(function (d) {
            return d.tasks.length;
          })
          .map(function (d) {
            var minutes = d.tasks.reduce(function (a, t) {
              return a + t.plannedMinutes;
            }, 0);
            return el("div", { class: "kv" }, [
              el("span", { class: "kv__key", text: D.WEEK_DAYS[d.dowIndex] }),
              el("span", {
                class: "kv__value",
                text: util.n(d.tasks.length) + " کار · " + util.fmtHM(minutes)
              })
            ]);
          })
      )
    ]);

    UI.openModal({
      title: "برنامه‌ی جدید",
      subtitle: plan.title,
      body: body,
      footer: [
        UI.button("بستن", { onClick: UI.closeModal }),
        UI.button("وارد کن", {
          variant: "primary",
          size: "lg",
          icon: "check",
          onClick: function () {
            var weekId = A.createWeekFromPlan(plan);
            A.setUi({ currentWeekId: weekId, selectedDate: null });
            UI.closeModal();
            UI.toast("برنامه‌ی جدید اضافه شد.", "success");
            if (HDML.app) HDML.app.navigate("week");
          }
        })
      ]
    });
  }

  W.handleFile = handleFile;

  /** Menu route: a sheet whose main content is the one-tap picker. */
  W.openDialog = function () {
    UI.openModal({
      title: "دریافت برنامه جدید",
      body: el("div", { class: "stack" }, [
        W.picker({
          title: "دریافت برنامه جدید",
          hint: "فایل برنامه‌ی هفتگی (json.) را از گوشی‌ات انتخاب کن"
        }),
        UI.notice(
          "برنامه‌های قبلی‌ات پاک نمی‌شوند؛ هفته‌ی جدید به برنامه اضافه می‌شود.",
          "info"
        )
      ]),
      footer: [UI.button("بستن", { onClick: UI.closeModal })]
    });
  };

  function bigStat(value, label) {
    return el("div", { class: "big-stat" }, [
      el("div", { class: "big-stat__value", text: value }),
      el("div", { class: "big-stat__label", text: label })
    ]);
  }
})(typeof window !== "undefined" ? window : globalThis);

    <script>
/* ===== js/views/task-ui.js ===== */
(function (global) {
  "use strict";

  var HDML = global.HDML;
  var util = HDML.util;
  var UI = HDML.ui;
  var A = HDML.actions;
  var Q = HDML.query;
  var S = HDML.stats;
  var el = UI.el;

  var T = (HDML.taskUI = {});

  /**
   * @param {Object} ts stats.taskStats() result
   * @param {{readOnly?:boolean}} [options]
   */
  T.card = function (ts, options) {
    var opts = options || {};
    var task = ts.task;
    var color = Q.subjectColor(task.subjectId);
    var running = A.runningTaskId() === task.id;

    var classes = ["task-simple"];
    if (ts.isCompleted) classes.push("is-done");
    if (ts.isSkipped) classes.push("is-skipped");
    if (running) classes.push("is-running");

    var body = el(
      "button",
      {
        type: "button",
        class: "task-simple__body",
        "aria-label": "جزئیات " + (task.title || "فعالیت"),
        onclick: function () {
          T.openDetails(task.id);
        }
      },
      [
        el("div", { class: "row", style: { gap: "8px" } }, [
          ts.isCompleted
            ? el("span", { class: "task-simple__tick task-simple__tick--done" }, UI.icon("check"))
            : null,
          ts.isSkipped
            ? el("span", { class: "task-simple__tick task-simple__tick--skip" }, UI.icon("minus"))
            : null,
          el("span", { class: "task-simple__subject", text: Q.subjectName(task.subjectId) })
        ]),
        task.topic ? el("div", { class: "task-simple__topic", text: task.topic }) : null,
        el("div", { class: "task-simple__title", text: task.title || "فعالیت" }),
        el("div", { class: "task-simple__time" }, [
          el("span", { class: "task-simple__chip" }, [
            el("span", { text: "⏱" }),
            el("strong", { text: util.fmtDur(ts.plannedMinutes) })
          ]),
          task.targetQuestions
            ? el("span", { class: "task-simple__chip" }, [
                el("span", { text: "🎯" }),
                el("strong", { text: util.n(task.targetQuestions) + " تست" })
              ])
            : null,
          running
            ? el("span", { class: "timer-pill", dataset: { timerFor: task.id } }, [
                el("span", { class: "timer-pill__dot" }),
                el("span", { class: "timer-value", text: formatClock(A.timerMinutes(task.id)) })
              ])
            : null
        ]),
        resultLine(ts)
      ]
    );

    var foot = opts.readOnly ? null : el("div", { class: "task-simple__foot" }, footer(ts, running));

    return el(
      "article",
      {
        class: classes.join(" "),
        style: { "--task-color": color },
        dataset: { taskId: task.id }
      },
      [body, foot]
    );
  };

  /** The one line of "what actually happened", shown only once it exists. */
  function resultLine(ts) {
    if (ts.isSkipped) {
      return el("div", { class: "task-simple__result", style: { color: "#b06f0a" } }, [
        el("span", { text: "انجام نشد — " + util.skipReasonLabel(ts.skipReason) })
      ]);
    }
    if (!ts.isCompleted) return null;

    var parts = [util.fmtDur(ts.actualMinutes) + " خوندی"];
    if (ts.questionsCompleted) parts.push(util.n(ts.questionsCompleted) + " تست");
    if (ts.accuracy !== null) parts.push(util.fmtPct(ts.accuracy) + " درست");

    return el("div", { class: "task-simple__result" }, [
      UI.icon("check", 15),
      el("span", { text: parts.join(" · ") }),
      ts.isEstimated
        ? el("span", {
            class: "text-xs",
            style: { color: "#b06f0a", "font-weight": "400" },
            text: "(زمان دقیق ثبت نشده)"
          })
        : null
    ]);
  }

  function footer(ts, running) {
    var id = ts.taskId;

    if (ts.isCompleted) {
      return el("div", { class: "mini-actions" }, [
        el("button", {
          type: "button",
          class: "mini-link",
          text: "✏️ ویرایش",
          onclick: function () {
            T.openComplete(id);
          }
        }),
        el("button", {
          type: "button",
          class: "mini-link",
          text: "↩️ برگردان به انجام‌نشده",
          onclick: function () {
            UI.confirm({
              title: "برگرداندن این کار",
              message: "زمان و تست‌هایی که ثبت کردی پاک می‌شود. مطمئنی؟"
            }).then(function (ok) {
              if (ok) {
                A.resetTask(id);
                UI.toast("برگردانده شد.");
              }
            });
          }
        })
      ]);
    }

    if (ts.isSkipped) {
      return el("div", { class: "mini-actions" }, [
        el("button", {
          type: "button",
          class: "mini-link",
          text: "✅ در واقع انجامش دادم",
          onclick: function () {
            T.openComplete(id);
          }
        })
      ]);
    }

    return el("div", {}, [
      el(
        "button",
        {
          type: "button",
          class: "done-btn",
          onclick: function () {
            T.openComplete(id);
          }
        },
        [UI.icon("check"), el("span", { text: "انجام شد" })]
      ),
      el("div", { class: "mini-actions" }, [
        el("button", {
          type: "button",
          class: "mini-link",
          text: running ? "⏹ توقف زمان‌سنج" : "▶️ شروع زمان‌سنج",
          onclick: function () {
            if (running) {
              A.stopTimer(id);
              UI.toast("زمان ثبت شد.", "success");
            } else {
              A.startTimer(id);
              UI.toast("زمان‌سنج شروع شد.", "success");
            }
          }
        }),
        el("button", {
          type: "button",
          class: "mini-link",
          text: "✖️ انجام نشد",
          onclick: function () {
            T.openSkip(id);
          }
        })
      ])
    ]);
  }

  function formatClock(minutes) {
    var totalSeconds = Math.floor(minutes * 60);
    var h = Math.floor(totalSeconds / 3600);
    var m = Math.floor((totalSeconds % 3600) / 60);
    var s = totalSeconds % 60;
    function p(v) {
      return v < 10 ? "0" + v : String(v);
    }
    return util.n(h > 0 ? h + ":" + p(m) + ":" + p(s) : p(m) + ":" + p(s));
  }

  T.formatClock = formatClock;

  /**
   * Two questions, nothing more:
   *   چقدر زمان برد؟   چند تست زدی؟
   * Correct/wrong/blank and a note hide behind "جزئیات بیشتر".
   */
  T.openComplete = function (taskId) {
    var state = HDML.store.get();
    var task = state.consultant.tasks[taskId];
    if (!task) return;
    var ts = S.taskStats(task, state);
    var timerMinutes = Math.round(A.timerMinutes(taskId));
    var wantsQuestions =
      util.taskTypeHasQuestions(task.type) || task.targetQuestions > 0;

    var suggested =
      ts.hasRecordedTime && ts.actualMinutes
        ? ts.actualMinutes
        : timerMinutes > 0
        ? timerMinutes
        : task.plannedMinutes || "";

    var q = (ts.log && ts.log.questions) || null;
    var errorBox = el("div", {});

    var minutesField = UI.field({
      label: "انجام این کار چقدر طول کشید؟ (دقیقه)",
      name: "actualMinutes",
      type: "number",
      min: 0,
      max: 1440,
      inputmode: "numeric",
      controlClass: "input--num",
      value: suggested
    });

    var quick = el("div", { class: "btn-row", style: { "margin-top": "8px" } });
    var choices = [15, 30, 45, 60, 90, 120];
    if (task.plannedMinutes && choices.indexOf(task.plannedMinutes) < 0) {
      choices.unshift(task.plannedMinutes);
    }
    choices.forEach(function (m) {
      quick.appendChild(
        UI.button(util.n(m), {
          size: "sm",
          onClick: function () {
            var input = minutesField.querySelector('[name="actualMinutes"]');
            if (input) input.value = String(m);
          }
        })
      );
    });
    minutesField.appendChild(quick);

    /* Only the per-answer breakdown hides; the note is a first-class field. */
    var advanced = el("div", { class: "more-panel", hidden: true }, [
      el("div", { class: "form-grid" }, [
        wantsQuestions
          ? UI.field({
              label: "درست",
              name: "qCorrect",
              type: "number",
              min: 0,
              inputmode: "numeric",
              controlClass: "input--num",
              value: q ? q.correct : ""
            })
          : null,
        wantsQuestions
          ? UI.field({
              label: "غلط",
              name: "qWrong",
              type: "number",
              min: 0,
              inputmode: "numeric",
              controlClass: "input--num",
              value: q ? q.wrong : ""
            })
          : null,
        wantsQuestions
          ? UI.field({
              label: "نزده",
              name: "qUnanswered",
              type: "number",
              min: 0,
              inputmode: "numeric",
              controlClass: "input--num",
              value: q ? q.unanswered : ""
            })
          : null
      ])
    ]);

    var noteField = UI.field({
      label: "یادداشت (اختیاری)",
      name: "note",
      type: "textarea",
      rows: 2,
      full: true,
      placeholder: "مثلاً: این مبحث را باید دوباره دوره کنم.",
      value: ts.log ? ts.log.note : ""
    });

    var moreBtn = wantsQuestions
      ? el(
          "button",
          {
            type: "button",
            class: "more-toggle",
            "aria-expanded": "false",
            onclick: function () {
              var open = advanced.hidden;
              advanced.hidden = !open;
              moreBtn.setAttribute("aria-expanded", open ? "true" : "false");
            }
          },
          [UI.icon("chevronDown"), el("span", { text: "درست / غلط / نزده" })]
        )
      : null;

    var form = el("div", { class: "stack" }, [
      minutesField,
      wantsQuestions
        ? UI.field({
            label:
              "چند تست زدی؟" +
              (task.targetQuestions ? " (هدف: " + util.n(task.targetQuestions) + ")" : ""),
            name: "qCompleted",
            type: "number",
            min: 0,
            inputmode: "numeric",
            controlClass: "input--num",
            value: q ? q.completed : ""
          })
        : null,
      moreBtn,
      advanced,
      noteField,
      errorBox
    ]);

    function readValues() {
      var values = { actualMinutes: UI.numberOf(form, "actualMinutes", null) };
      if (wantsQuestions) {
        values.questions = A.normalizeQuestions({
          completed: UI.numberOf(form, "qCompleted", 0) || 0,
          correct: UI.numberOf(form, "qCorrect", 0) || 0,
          wrong: UI.numberOf(form, "qWrong", 0) || 0,
          unanswered: UI.numberOf(form, "qUnanswered", 0) || 0
        });
      }
      values.note = UI.valueOf(form, "note");
      return values;
    }

    UI.openModal({
      title: "انجام شد ✅",
      subtitle: task.title,
      body: form,
      footer: [
        UI.button("بستن", { onClick: UI.closeModal }),
        UI.button("ذخیره", {
          variant: "primary",
          size: "lg",
          icon: "check",
          onClick: function () {
            var values = readValues();
            var errors = A.validateCompletion(values, task);
            UI.clear(errorBox);
            if (errors.length) {
              errors.forEach(function (msg) {
                errorBox.appendChild(UI.notice(util.escapeHtml(msg), "danger"));
              });
              /* Most validation failures are about the answer breakdown, so
                 reveal it - but it only exists for question-based tasks. */
              if (moreBtn) {
                advanced.hidden = false;
                moreBtn.setAttribute("aria-expanded", "true");
              }
              return;
            }
            A.completeTask(taskId, values);
            UI.closeModal();
            UI.toast("آفرین! ثبت شد.", "success");
          }
        })
      ]
    });
  };

  T.openSkip = function (taskId) {
    var state = HDML.store.get();
    var task = state.consultant.tasks[taskId];
    if (!task) return;
    var log = state.student.taskLogs[taskId];
    var selected = (log && log.skipReason) || null;

    var buttons = [];
    var list = el(
      "div",
      { class: "reason-list" },
      HDML.SKIP_REASONS.map(function (reason) {
        var btn = el("button", {
          type: "button",
          class: "reason-option",
          text: reason.label,
          "aria-pressed": selected === reason.id ? "true" : "false",
          onclick: function () {
            selected = reason.id;
            buttons.forEach(function (b) {
              b.setAttribute("aria-pressed", b === btn ? "true" : "false");
            });
          }
        });
        buttons.push(btn);
        return btn;
      })
    );

    var form = el("div", { class: "stack" }, [
      el("p", { class: "text-sm text-muted", text: "چرا نشد؟ (برای مشاورت مفیده)" }),
      list
    ]);

    UI.openModal({
      title: "این کار انجام نشد",
      subtitle: task.title,
      body: form,
      footer: [
        UI.button("بستن", { onClick: UI.closeModal }),
        UI.button("ثبت", {
          variant: "primary",
          onClick: function () {
            if (!selected) {
              UI.toast("یک دلیل انتخاب کن.", "danger");
              return;
            }
            A.skipTask(taskId, selected, "");
            UI.closeModal();
            UI.toast("ثبت شد.");
          }
        })
      ]
    });
  };

  T.openDetails = function (taskId) {
    var state = HDML.store.get();
    var task = state.consultant.tasks[taskId];
    if (!task) return;
    var ts = S.taskStats(task, state);

    var rows = [
      UI.kv("درس", Q.subjectName(task.subjectId)),
      task.topic ? UI.kv("مبحث", task.topic) : null,
      UI.kv("نوع", util.taskTypeLabel(task.type)),
      UI.kv("زمان برنامه", util.fmtDur(ts.plannedMinutes)),
      ts.actualMinutes > 0
        ? UI.kv(
            "زمان واقعی",
            util.fmtDur(ts.actualMinutes) + (ts.isEstimated ? " (تخمینی)" : "")
          )
        : null,
      task.targetQuestions ? UI.kv("تست هدف", util.n(task.targetQuestions)) : null,
      ts.questionsCompleted ? UI.kv("تست زده‌شده", util.n(ts.questionsCompleted)) : null,
      ts.questionsCompleted
        ? UI.kv(
            "درست / غلط / نزده",
            util.n(ts.correct) + " / " + util.n(ts.wrong) + " / " + util.n(ts.unanswered)
          )
        : null,
      ts.accuracy !== null ? UI.kv("درصد درست", util.fmtPct(ts.accuracy)) : null
    ];

    var body = el("div", { class: "stack" }, [
      task.description
        ? el("p", { class: "text-sm", style: { "white-space": "pre-wrap" }, text: task.description })
        : null,
      el("div", {}, rows),
      task.consultantNote
        ? UI.noteBlock("پیام مشاور", task.consultantNote, "consultant")
        : null,
      ts.note ? UI.noteBlock("یادداشت تو", ts.note, "student") : null
    ]);

    UI.openModal({
      title: task.title || "فعالیت",
      body: body,
      footer: [
        UI.button("بستن", { onClick: UI.closeModal }),
        ts.isCompleted
          ? UI.button("ویرایش", {
              variant: "primary",
              icon: "edit",
              onClick: function () {
                UI.closeModal();
                T.openComplete(taskId);
              }
            })
          : UI.button("انجام شد", {
              variant: "primary",
              icon: "check",
              onClick: function () {
                UI.closeModal();
                T.openComplete(taskId);
              }
            })
      ]
    });
  };

  /** Three plain chips. No subject/type dropdowns on the student screens. */
  T.filterBar = function (taskStatsList, onChange) {
    var filter = HDML.store.get().ui.taskFilter || { status: "all" };

    var options = [
      { id: "all", label: "همه", count: taskStatsList.length },
      {
        id: "pending",
        label: "مانده",
        count: taskStatsList.filter(function (t) {
          return t.isPending || t.isInProgress;
        }).length
      },
      {
        id: "completed",
        label: "انجام‌شده",
        count: taskStatsList.filter(function (t) {
          return t.isCompleted;
        }).length
      }
    ];

    return el(
      "div",
      { class: "filter-bar" },
      options.map(function (opt) {
        return el(
          "button",
          {
            type: "button",
            class: "chip",
            "aria-pressed": filter.status === opt.id ? "true" : "false",
            onclick: function () {
              A.setUi({ taskFilter: { status: opt.id, subjectId: "all", type: "all" } });
              if (onChange) onChange();
            }
          },
          [
            el("span", { text: opt.label }),
            el("span", { class: "chip__count", text: " " + util.n(opt.count) })
          ]
        );
      })
    );
  };

  T.applyFilter = function (taskStatsList) {
    var f = HDML.store.get().ui.taskFilter || {};
    return taskStatsList.filter(function (t) {
      if (f.status === "pending") return t.isPending || t.isInProgress;
      if (f.status === "completed") return t.isCompleted;
      if (f.status === "skipped") return t.isSkipped;
      return true;
    });
  };
})(typeof window !== "undefined" ? window : globalThis);

    <script>
/* ===== js/views/shared.js ===== */
(function (global) {
  "use strict";

  var HDML = global.HDML;
  var util = HDML.util;
  var UI = HDML.ui;
  var D = HDML.date;
  var A = HDML.actions;
  var Q = HDML.query;
  var S = HDML.stats;
  var el = UI.el;

  var V = (HDML.viewShared = {});

  V.weekSwitcher = function () {
    var state = HDML.store.get();
    var weeks = Q.weeksSorted(state);
    var current = Q.currentWeek(state);
    if (!weeks.length) return null;

    var index = weeks.findIndex(function (w) {
      return w.id === (current && current.id);
    });

    var select = el(
      "select",
      {
        class: "select",
        style: { width: "auto", border: "none", background: "transparent", "font-weight": "600" },
        "aria-label": "انتخاب هفته",
        onchange: function (e) {
          A.setUi({ currentWeekId: e.target.value, selectedDate: null });
        }
      },
      weeks.map(function (w) {
        return el("option", {
          value: w.id,
          text: w.title + " — " + D.formatRange(w.startDate, w.endDate)
        });
      })
    );
    if (current) select.value = current.id;

    return el("div", { class: "week-switch" }, [
      UI.iconButton("chevronRight", {
        title: "هفته‌ی قبل",
        disabled: index <= 0,
        onClick: function () {
          if (index > 0) A.setUi({ currentWeekId: weeks[index - 1].id, selectedDate: null });
        }
      }),
      select,
      UI.iconButton("chevronLeft", {
        title: "هفته‌ی بعد",
        disabled: index < 0 || index >= weeks.length - 1,
        onClick: function () {
          if (index >= 0 && index < weeks.length - 1)
            A.setUi({ currentWeekId: weeks[index + 1].id, selectedDate: null });
        }
      })
    ]);
  };

  V.dayStrip = function (weekId, selectedDate, onSelect) {
    var days = Q.daysOfWeek(weekId);
    if (!days.length) return null;
    var today = D.today();

    return el(
      "div",
      { class: "day-strip", role: "tablist", "aria-label": "روزهای هفته" },
      days.map(function (day) {
        var ds = S.dayStats(day.id);
        var tone =
          !ds || ds.totalTasks === 0
            ? "none"
            : ds.completedTasks === ds.totalTasks
            ? "done"
            : ds.completedTasks > 0
            ? "partial"
            : "none";

        return el(
          "button",
          {
            type: "button",
            class: "day-pill",
            role: "tab",
            "aria-pressed": day.date === selectedDate ? "true" : "false",
            "aria-selected": day.date === selectedDate ? "true" : "false",
            title:
              D.format(day.date, "full") +
              " — " +
              util.n(ds ? ds.completedTasks : 0) +
              " از " +
              util.n(ds ? ds.totalTasks : 0) +
              " فعالیت",
            onclick: function () {
              onSelect(day.date);
            }
          },
          [
            /* Both spellings ship; CSS shows whichever fits the screen. */
            el("div", { class: "day-pill__name day-pill__name--full", text: D.WEEK_DAYS[day.dowIndex] }),
            el("div", {
              class: "day-pill__name day-pill__name--short",
              text: D.WEEK_DAYS_SHORT[day.dowIndex]
            }),
            el("div", { class: "day-pill__date day-pill__date--full", text: D.format(day.date, "short") }),
            el("div", {
              class: "day-pill__date day-pill__date--short",
              text: util.n(D.jalaliOf(day.date).jd)
            }),
            el("div", { class: "day-pill__dot day-pill__dot--" + tone }),
            day.date === today ? el("div", { class: "day-pill__today", text: "امروز" }) : null
          ]
        );
      })
    );
  };

  /**
   * The three components are always shown separately - never collapsed into
   * one meaningless number (the composite score is labelled and explained).
   */
  V.kpiRow = function (agg, options) {
    var opts = options || {};
    var items = [
      UI.kpi({
        label: "زمان مطالعه",
        icon: "clock",
        value: util.fmtDur(agg.actualMinutes),
        foot: [
          el("span", {
            text: "از " + util.fmtDur(agg.plannedMinutes) + " برنامه"
          }),
          agg.hasEstimatedTime
            ? UI.badge("شامل برآورد", "warning", {
                title:
                  util.fmtDur(agg.estimatedMinutes) +
                  " از این زمان، برآورد از زمان برنامه است چون دانش‌آموز زمان واقعی را ثبت نکرده."
              })
            : null
        ],
        rate: agg.studyAchievementRate
      }),
      UI.kpi({
        label: "فعالیت‌ها",
        icon: "today",
        value: util.n(agg.completedTasks) + " / " + util.n(agg.totalTasks),
        foot: [
          agg.skippedTasks
            ? UI.badge(util.n(agg.skippedTasks) + " انجام‌نشد", "warning")
            : null,
          agg.pendingTasks
            ? el("span", { text: util.n(agg.pendingTasks) + " باقی‌مانده" })
            : null
        ],
        rate: agg.taskCompletionRate
      }),
      UI.kpi({
        label: "تست",
        icon: "target",
        value:
          agg.targetQuestions || agg.completedQuestions
            ? util.n(agg.completedQuestions) + " / " + util.n(agg.targetQuestions)
            : "—",
        foot: [
          agg.accuracy !== null
            ? el("span", { text: "درصد صحیح: " + util.fmtPct(agg.accuracy) })
            : el("span", { class: "text-muted", text: "بدون داده‌ی تست" })
        ],
        rate: agg.questionCompletionRate
      })
    ];

    if (opts.showScore !== false) {
      items.push(
        UI.kpi({
          label: "امتیاز کلی",
          icon: "sparkle",
          gold: true,
          value: agg.overallScore === null ? "—" : util.fmtPct(agg.overallScore),
          foot: [
            el("span", {
              class: "text-xs",
              text:
                agg.overallScore === null
                  ? "بدون داده"
                  : "میانگین " + util.n(agg.overallParts) + " شاخص بالا"
            })
          ],
          rate: agg.overallScore
        })
      );
    }

    return el("div", { class: "grid grid--kpi" }, items);
  };

  /**
   * "Subject | Planned | Actual | Difference | Achievement" - the study-time
   * table from the reference sheet, filled automatically from task logs.
   */
  V.subjectTable = function (rows, options) {
    var opts = options || {};
    if (!rows || !rows.length) {
      return UI.empty({
        icon: "book",
        title: "هنوز مطالعه‌ای ثبت نشده است",
        text: "با تکمیل فعالیت‌ها، زمان هر درس به‌صورت خودکار در این جدول محاسبه می‌شود."
      });
    }

    var totals = rows.reduce(
      function (acc, r) {
        acc.planned += r.plannedMinutes;
        acc.actual += r.actualMinutes;
        acc.questions += r.completedQuestions;
        acc.target += r.targetQuestions;
        return acc;
      },
      { planned: 0, actual: 0, questions: 0, target: 0 }
    );

    function deltaCell(delta) {
      var cls = delta > 0 ? "delta--pos" : delta < 0 ? "delta--neg" : "delta--zero";
      return el("td", { class: "num-cell" }, [
        el("span", { class: "delta " + cls, text: util.fmtDelta(delta) })
      ]);
    }

    return el("div", { class: "table-wrap" }, [
      el("table", { class: "data-table" }, [
        el("thead", {}, [
          el("tr", {}, [
            el("th", { text: "درس" }),
            el("th", { class: "num-cell", text: "برنامه" }),
            el("th", { class: "num-cell", text: "واقعی" }),
            el("th", { class: "num-cell", text: "اختلاف" }),
            el("th", { class: "num-cell", text: "تحقق" }),
            opts.showQuestions !== false
              ? el("th", { class: "num-cell", text: "تست" })
              : null
          ])
        ]),
        el(
          "tbody",
          {},
          rows.map(function (r) {
            return el("tr", {}, [
              el("td", {}, [
                el("span", { class: "cell-subject" }, [
                  UI.subjectBadge(r.name, r.color)
                ])
              ]),
              el("td", { class: "num-cell", text: util.fmtHM(r.plannedMinutes) }),
              el("td", { class: "num-cell", text: util.fmtHM(r.actualMinutes) }),
              deltaCell(r.deltaMinutes),
              el("td", { class: "num-cell" }, [
                el("div", { style: { "min-width": "84px" } }, [
                  el("span", {
                    text:
                      r.studyAchievementRate === null
                        ? "—"
                        : util.fmtPct(r.studyAchievementRate)
                  }),
                  UI.meter(r.studyAchievementRate, { label: r.name })
                ])
              ]),
              opts.showQuestions !== false
                ? el("td", { class: "num-cell" }, [
                    r.targetQuestions || r.completedQuestions
                      ? el("span", {
                          text:
                            util.n(r.completedQuestions) +
                            " / " +
                            util.n(r.targetQuestions)
                        })
                      : el("span", { class: "text-muted", text: "—" })
                  ])
                : null
            ]);
          })
        ),
        el("tfoot", {}, [
          el("tr", {}, [
            el("td", { text: "مجموع" }),
            el("td", { class: "num-cell", text: util.fmtHM(totals.planned) }),
            el("td", { class: "num-cell", text: util.fmtHM(totals.actual) }),
            deltaCell(totals.actual - totals.planned),
            el("td", {
              class: "num-cell",
              text:
                totals.planned > 0
                  ? util.fmtPct(util.pct(totals.actual, totals.planned))
                  : "—"
            }),
            opts.showQuestions !== false
              ? el("td", {
                  class: "num-cell",
                  text: util.n(totals.questions) + " / " + util.n(totals.target)
                })
              : null
          ])
        ])
      ])
    ]);
  };

  /**
   * Shown whenever there is no week yet. For a student the answer is almost
   * always "import the file your consultant sent you".
   * @param {Object} [ctx] view context, used for the secondary action
   */
  V.noPlan = function (ctx) {
    return el("div", { class: "welcome" }, [
      el("img", { class: "welcome__logo", src: HDML.LOGO, alt: "ENIGMA" }),
      el("div", { class: "welcome__brand", text: "🔐 ENIGMA" }),
      el("div", { class: "welcome__hi", text: "سلام 👋" }),
      el("p", { class: "welcome__line", text: "هنوز برنامه‌ای برای این هفته نداری." }),
      el("p", {
        class: "welcome__line",
        text: "برنامه‌ای که مشاورت برات فرستاده رو از اینجا وارد کن."
      }),
      /* The picker itself, not a button that opens a dialog first: one tap
         on a phone goes straight to the native file chooser. */
      el("div", { class: "welcome__cta" }, [
        HDML.weekImport.picker({
          title: "دریافت برنامه جدید",
          hint: "برنامه هفتگی مشاورت رو از فایل انتخاب کن"
        })
      ]),
      ctx && ctx.navigate
        ? el("button", {
            type: "button",
            class: "welcome__alt",
            text: "یا خودم برنامه می‌سازم",
            onclick: function () {
              ctx.navigate("consultant");
            }
          })
        : null
    ]);
  };

  V.skipSummary = function (reasons, skipped) {
    if (!skipped || !skipped.length) return null;
    return el("div", { class: "stack" }, [
      el(
        "div",
        { class: "row" },
        reasons.map(function (r) {
          return UI.badge(r.label + " × " + util.n(r.count), "warning");
        })
      ),
      el(
        "div",
        { class: "stack stack--sm" },
        skipped.map(function (ts) {
          return el("div", { class: "report-task-line" }, [
            el("span", {
              class: "report-task-line__mark report-task-line__mark--skip",
              text: "×"
            }),
            el("span", { class: "report-task-line__body" }, [
              el("strong", { text: Q.subjectName(ts.task.subjectId) + " — " }),
              el("span", { text: ts.task.title }),
              ts.log && ts.log.skipNote
                ? el("span", { class: "text-muted", text: " — " + ts.log.skipNote })
                : null
            ]),
            el("span", {
              class: "report-task-line__num",
              text: util.skipReasonLabel(ts.skipReason)
            })
          ]);
        })
      )
    ]);
  };

  /** Debounced textarea that writes straight into the store. */
  V.noteEditor = function (config) {
    var save = util.debounce(function (value) {
      config.onSave(value);
    }, 500);

    var ta = el("textarea", {
      class: "textarea",
      rows: config.rows || 3,
      placeholder: config.placeholder || "",
      "aria-label": config.label,
      oninput: function (e) {
        save(e.target.value);
      }
    });
    ta.value = config.value || "";

    return el("div", { class: "field" }, [
      el("span", { class: "field__label", text: config.label }),
      ta,
      config.hint ? el("div", { class: "field__hint", text: config.hint }) : null
    ]);
  };

  V.runningBanner = function () {
    var runningId = A.runningTaskId();
    if (!runningId) return null;
    var task = HDML.store.get().consultant.tasks[runningId];
    if (!task) return null;

    return el("div", { class: "running-banner no-print" }, [
      el("div", {}, [
        el("div", { class: "running-banner__label", text: "در حال مطالعه" }),
        el("div", { class: "running-banner__title", text: task.title })
      ]),
      el("div", { style: { flex: "1" } }),
      el("div", { class: "timer-pill", dataset: { timerFor: runningId } }, [
        el("span", { class: "timer-pill__dot" }),
        el("span", {
          class: "timer-value",
          text: HDML.taskUI.formatClock(A.timerMinutes(runningId))
        })
      ]),
      UI.button("توقف و ثبت", {
        icon: "stop",
        size: "sm",
        variant: "gold",
        onClick: function () {
          A.stopTimer(runningId);
          UI.toast("زمان مطالعه ثبت شد.", "success");
        }
      })
    ]);
  };
})(typeof window !== "undefined" ? window : globalThis);
