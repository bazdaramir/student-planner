/* ===== js/views/dashboard.js ===== */
(function (global) {
  "use strict";

  var HDML = global.HDML;
  var util = HDML.util;
  var UI = HDML.ui;
  var D = HDML.date;
  var A = HDML.actions;
  var Q = HDML.query;
  var S = HDML.stats;
  var V = HDML.viewShared;
  var T = HDML.taskUI;
  var C = HDML.charts;
  var el = UI.el;

  HDML.views = HDML.views || {};

  HDML.views.dashboard = function (ctx) {
    var state = HDML.store.get();
    var week = Q.currentWeek(state);
    var profile = state.consultant.student;
    var container = el("div", {});

    if (!week) {
      return V.noPlan(ctx);
    }

    var ws = S.weekStats(week.id);
    var todayIso = D.today();
    var todayStats = S.dayStatsByDate(todayIso);

    container.appendChild(
      el("div", { class: "hero" }, [
        el("div", { class: "hero__eyebrow", text: "سامانه‌ی برنامه‌ریزی و گزارش عملکرد" }),
        el("h1", { class: "hero__title", text: Q.studentFullName(state) }),
        el("div", {
          class: "hero__sub",
          text:
            [profile.grade, util.trackLabel(profile.track)]
              .filter(Boolean)
              .join(" — ") +
            (profile.consultantName ? " · مشاور: " + profile.consultantName : "") +
            " · " +
            D.format(todayIso, "full")
        }),
        profile.goal
          ? el("div", {
              class: "hero__sub",
              style: { "margin-top": "6px" },
              text: "هدف: " + profile.goal
            })
          : null,
        el("div", { class: "hero__stats" }, [
          heroStat(
            "مطالعه‌ی امروز",
            todayStats ? util.fmtDur(todayStats.actualMinutes) : "—",
            todayStats
              ? "از " + util.fmtDur(todayStats.plannedMinutes)
              : "امروز در این هفته نیست",
            todayStats ? todayStats.studyAchievementRate : null
          ),
          heroStat(
            "مطالعه‌ی هفته",
            util.fmtDur(ws.actualMinutes),
            "از " + util.fmtDur(ws.plannedMinutes),
            ws.studyAchievementRate
          ),
          heroStat(
            "فعالیت‌های هفته",
            util.n(ws.completedTasks) + " / " + util.n(ws.totalTasks),
            ws.taskCompletionRate === null
              ? "بدون فعالیت"
              : util.fmtPct(ws.taskCompletionRate) + " انجام‌شده",
            ws.taskCompletionRate
          ),
          heroStat(
            "تست هفته",
            ws.targetQuestions || ws.completedQuestions
              ? util.n(ws.completedQuestions) + " / " + util.n(ws.targetQuestions)
              : "—",
            ws.accuracy !== null ? "درصد صحیح: " + util.fmtPct(ws.accuracy) : "بدون داده",
            ws.questionCompletionRate
          )
        ])
      ])
    );

    var banner = V.runningBanner();
    if (banner) container.appendChild(banner);

    var todaySection = el("div", { class: "view-section" });
    todaySection.appendChild(
      UI.sectionHead(
        "فعالیت‌های امروز",
        todayStats ? D.format(todayIso, "full") : null,
        UI.button("مشاهده‌ی کامل", {
          icon: "today",
          size: "sm",
          onClick: function () {
            ctx.navigate("today");
          }
        })
      )
    );

    if (!todayStats) {
      todaySection.appendChild(
        UI.empty({
          icon: "today",
          title: "امروز در بازه‌ی هفته‌ی انتخاب‌شده نیست",
          text:
            "هفته‌ی جاری از " +
            D.format(week.startDate, "long") +
            " تا " +
            D.format(week.endDate, "long") +
            " است.",
          action: UI.button("رفتن به برنامه‌ی هفته", {
            variant: "primary",
            onClick: function () {
              ctx.navigate("week");
            }
          })
        })
      );
    } else if (!todayStats.taskStats.length) {
      todaySection.appendChild(
        UI.empty({
          icon: "inbox",
          title: "برای امروز فعالیتی تعریف نشده است",
          text: "روز دیگری را از برنامه‌ی هفتگی انتخاب کنید."
        })
      );
    } else {
      /* Unfinished work first; show at most five, the rest live in Today. */
      var pending = todayStats.taskStats.filter(function (t) {
        return !t.isCompleted && !t.isSkipped;
      });
      var shown = (pending.length ? pending : todayStats.taskStats).slice(0, 5);

      todaySection.appendChild(
        el(
          "div",
          { class: "task-list" },
          shown.map(function (ts) {
            return T.card(ts, { compact: true });
          })
        )
      );

      var remaining = (pending.length ? pending : todayStats.taskStats).length - shown.length;
      if (remaining > 0) {
        todaySection.appendChild(
          el("div", { class: "text-center", style: { "margin-top": "12px" } }, [
            UI.button(util.n(remaining) + " فعالیت دیگر", {
              variant: "ghost",
              onClick: function () {
                ctx.navigate("today");
              }
            })
          ])
        );
      }
      if (!pending.length) {
        todaySection.appendChild(
          el(
            "div",
            { style: { "margin-top": "12px" } },
            UI.notice("همه‌ی فعالیت‌های امروز تعیین‌تکلیف شده‌اند.", "success")
          )
        );
      }
    }
    container.appendChild(todaySection);

    container.appendChild(
      el("div", { class: "view-section grid grid--2" }, [
        UI.card({
          title: "برنامه در برابر عملکرد واقعی",
          icon: "progress",
          hint: week.title,
          body: C.plannedVsActual(S.trend({ weekId: week.id }), { height: 230 })
        }),
        UI.card({
          title: "پیشرفت دروس",
          icon: "target",
          hint: "زمان واقعی / زمان برنامه",
          body: C.subjectRadar(S.subjectRadar(week.id), { size: 300 })
        })
      ])
    );

    var exams = S.allExamStats();
    var withResult = exams.filter(function (e) {
      return e.hasResult;
    });
    var lastExam = withResult.length ? withResult[withResult.length - 1] : null;
    var upcoming = exams.filter(function (e) {
      return e.isUpcoming;
    })[0];

    container.appendChild(
      el("div", { class: "view-section grid grid--2" }, [
        UI.card({
          title: "آخرین آزمون",
          icon: "exam",
          actions: UI.button("همه‌ی آزمون‌ها", {
            size: "sm",
            variant: "ghost",
            onClick: function () {
              ctx.navigate("exams");
            }
          }),
          body: lastExam
            ? examSummary(lastExam, ctx)
            : upcoming
            ? el("div", { class: "stack" }, [
                UI.notice(
                  "آزمون پیش‌رو: <strong>" +
                    util.escapeHtml(upcoming.name) +
                    "</strong> در تاریخ " +
                    util.escapeHtml(D.format(upcoming.date, "long")),
                  "info"
                ),
                UI.button("ثبت نتیجه", {
                  variant: "primary",
                  icon: "plus",
                  onClick: function () {
                    ctx.navigate("exams");
                  }
                })
              ])
            : UI.empty({
                icon: "exam",
                title: "هنوز آزمونی ثبت نشده است",
                text: "آزمون‌ها را در بخش آزمون‌ها اضافه و نتیجه‌شان را ثبت کنید.",
                action: UI.button("رفتن به آزمون‌ها", {
                  variant: "primary",
                  onClick: function () {
                    ctx.navigate("exams");
                  }
                })
              })
        }),
        UI.card({
          title: "آخرین یادداشت‌ها",
          icon: "note",
          body: latestNotes(state, ws)
        })
      ])
    );

    var trendSeries = S.trend({ limit: 28 });
    container.appendChild(
      el("div", { class: "view-section" }, [
        UI.card({
          title: "روند ساعت مطالعه",
          icon: "progress",
          hint: "تا ۲۸ روز اخیر — با اضافه‌شدن هفته‌های جدید ادامه پیدا می‌کند",
          actions: UI.button("جزئیات بیشتر", {
            size: "sm",
            variant: "ghost",
            onClick: function () {
              ctx.navigate("progress");
            }
          }),
          body: C.studyTrend(trendSeries)
        })
      ])
    );

    return container;
  };

  function heroStat(label, value, foot, rate) {
    return el("div", { class: "hero__stat" }, [
      el("div", { class: "hero__stat-label", text: label }),
      el("div", { class: "hero__stat-value", text: value }),
      UI.meter(rate, { label: label }),
      el("div", {
        class: "hero__stat-label",
        style: { "margin-top": "4px" },
        text: foot
      })
    ]);
  }

  function examSummary(es, ctx) {
    return el("div", { class: "stack" }, [
      el("div", { class: "exam-card__head" }, [
        el("div", {}, [
          el("div", { class: "exam-card__name", text: es.name }),
          el("div", { class: "exam-card__date", text: D.format(es.date, "long") })
        ]),
        el("div", { class: "exam-card__score" }, [
          el("div", {
            class: "exam-card__score-value",
            text: es.overallPercentage === null ? "—" : util.fmtPct(es.overallPercentage)
          }),
          el("div", { class: "exam-card__score-label", text: "درصد کل" })
        ])
      ]),
      es.rank
        ? UI.kv("رتبه", util.n(es.rank) + (es.totalParticipants ? " از " + util.n(es.totalParticipants) : ""))
        : null,
      el(
        "div",
        { class: "subject-score-grid" },
        es.subjectRows
          .filter(function (r) {
            return r.hasData;
          })
          .slice(0, 6)
          .map(function (r) {
            return el("div", { class: "subject-score" }, [
              el("div", { class: "subject-score__name", text: r.name }),
              el("div", {
                class: "subject-score__value",
                style: { color: util.toneColor(util.rateTone(r.percentage)) },
                text: util.fmtPct(r.percentage)
              })
            ]);
          })
      ),
      UI.button("مشاهده‌ی جزئیات آزمون", {
        size: "sm",
        variant: "ghost",
        onClick: function () {
          ctx.navigate("exams", { examId: es.examId });
        }
      })
    ]);
  }

  function latestNotes(state, ws) {
    var items = [];

    if (ws.week.consultantNote) {
      items.push(UI.noteBlock("یادداشت مشاور — هفته", ws.week.consultantNote, "consultant"));
    }
    if (ws.consultantFeedback && ws.consultantFeedback.text) {
      items.push(UI.noteBlock("بازخورد مشاور", ws.consultantFeedback.text, "consultant"));
    }

    var dayNotes = ws.days
      .filter(function (d) {
        return d.note;
      })
      .slice(-3)
      .reverse();

    dayNotes.forEach(function (d) {
      items.push(
        UI.noteBlock(
          "یادداشت " + d.dayName + " " + D.format(d.date, "medium"),
          util.truncate(d.note, 220),
          "student"
        )
      );
    });

    if (ws.reflection && ws.reflection.improve) {
      items.push(
        UI.noteBlock("برای هفته‌ی بعد", ws.reflection.improve, "student")
      );
    }

    if (!items.length) {
      return UI.empty({
        icon: "note",
        title: "هنوز یادداشتی نوشته نشده است",
        text: "در پایان هر روز، تجربه‌ی آن روز را در بخش «برنامه امروز» یادداشت کنید."
      });
    }

    return el("div", { class: "stack" }, items);
  }
})(typeof window !== "undefined" ? window : globalThis);

    <script>
/* ===== js/views/today.js ===== */
(function (global) {
  "use strict";

  var HDML = global.HDML;
  var util = HDML.util;
  var UI = HDML.ui;
  var D = HDML.date;
  var A = HDML.actions;
  var Q = HDML.query;
  var S = HDML.stats;
  var V = HDML.viewShared;
  var T = HDML.taskUI;
  var el = UI.el;

  HDML.views = HDML.views || {};

  HDML.views.today = function (ctx) {
    var state = HDML.store.get();
    var week = Q.currentWeek(state);

    if (!week) return V.noPlan(ctx);

    var days = Q.daysOfWeek(week.id);
    var todayIso = D.today();
    var selected = state.ui.selectedDate;
    if (!selected || !days.some(function (d) { return d.date === selected; })) {
      selected = days.some(function (d) { return d.date === todayIso; })
        ? todayIso
        : days.length
        ? days[0].date
        : null;
    }

    var day = days.filter(function (d) {
      return d.date === selected;
    })[0];
    if (!day) return V.noPlan(ctx);

    var ds = S.dayStats(day.id);
    var isToday = day.date === todayIso;
    var box = el("div", {});

    box.appendChild(
      el("div", { class: "greet" }, [
        el("div", {
          class: "greet__hello",
          text: isToday
            ? "سلام " + (state.consultant.student.firstName || "") + " 👋"
            : "برنامه‌ی این روز"
        }),
        el("div", {
          class: "greet__big",
          text: isToday ? "امروز" : D.relativeLabel(day.date, todayIso)
        }),
        el("div", { class: "greet__date", text: D.format(day.date, "full") })
      ])
    );

    box.appendChild(
      el("div", { class: "today-box" }, [
        el("div", { class: "today-box__row" }, [
          el("div", { class: "today-box__item" }, [
            el("div", { class: "today-box__q", text: "برنامه امروز" }),
            el("div", { class: "today-box__a", text: util.fmtDur(ds.plannedMinutes) })
          ]),
          el("div", { class: "today-box__item" }, [
            el("div", { class: "today-box__q", text: "انجام شده" }),
            el("div", { class: "today-box__a", text: util.fmtDur(ds.actualMinutes) })
          ])
        ]),
        UI.meter(ds.studyAchievementRate, { label: "پیشرفت امروز", large: true }),
        el("div", {
          class: "today-box__note",
          text:
            ds.totalTasks === 0
              ? "برای این روز کاری ثبت نشده."
              : util.n(ds.completedTasks) +
                " کار از " +
                util.n(ds.totalTasks) +
                " کار انجام شده" +
                (ds.completedQuestions ? " · " + util.n(ds.completedQuestions) + " تست زدی" : "")
        })
      ])
    );

    box.appendChild(
      el("div", { class: "no-print", style: { "margin-bottom": "20px" } }, [
        V.dayStrip(week.id, selected, function (date) {
          A.setUi({ selectedDate: date });
        })
      ])
    );

    var banner = V.runningBanner();
    if (banner) box.appendChild(banner);

    if (ds.consultantNote) {
      box.appendChild(
        el("div", { style: { "margin-bottom": "20px" } },
          UI.noteBlock("پیام مشاور", ds.consultantNote, "consultant"))
      );
    }

    var all = ds.taskStats;

    box.appendChild(
      el("div", { class: "section-title" }, [
        el("span", { text: "کارهای امروز" }),
        el("span", { class: "section-title__count", text: util.n(all.length) + " کار" })
      ])
    );

    if (!all.length) {
      box.appendChild(
        UI.empty({
          icon: "inbox",
          title: "برای این روز کاری نداری",
          text: "روز دیگری را انتخاب کن، یا برنامه‌ی جدید را از مشاورت بگیر."
        })
      );
      return box;
    }

    box.appendChild(
      el("div", { class: "no-print", style: { "margin-bottom": "16px" } }, [
        T.filterBar(all, function () {
          ctx.rerender();
        })
      ])
    );

    var filtered = T.applyFilter(all);

    if (!filtered.length) {
      box.appendChild(
        UI.empty({ icon: "check", title: "چیزی برای نمایش نیست", text: "فیلتر را عوض کن." })
      );
    } else {
      /* Unfinished first, finished stays visible underneath. */
      var order = { in_progress: 0, pending: 1, completed: 2, skipped: 3 };
      var sorted = filtered.slice().sort(function (a, b) {
        var oa = order[a.status];
        var ob = order[b.status];
        if (oa !== ob) return oa - ob;
        return (a.task.order || 0) - (b.task.order || 0);
      });

      box.appendChild(
        el(
          "div",
          {},
          sorted.map(function (ts) {
            return T.card(ts);
          })
        )
      );
    }

    if (ds.totalTasks && ds.completedTasks === ds.totalTasks) {
      box.appendChild(
        el("div", { style: { "margin-top": "20px" } },
          UI.notice("🎉 همه‌ی کارهای امروز را انجام دادی. عالی بود!", "success"))
      );
    }

    box.appendChild(el("div", { class: "section-title", text: "یادداشت امروز" }));
    box.appendChild(
      el("div", { class: "simple-card" }, [
        V.noteEditor({
          label: "امروز چطور بود؟ (اختیاری)",
          placeholder: "مثلاً: صبح تمرکز خوبی داشتم، عصر خسته بودم.",
          value: ds.note,
          rows: 3,
          hint: "این یادداشت در گزارش تو برای مشاور می‌آید.",
          onSave: function (value) {
            A.setDailyNote(day.id, value);
          }
        })
      ])
    );

    box.appendChild(
      el("div", { class: "no-print", style: { "margin-top": "20px" } }, [
        UI.button("📤 گزارش امروز را بساز", {
          size: "lg",
          block: true,
          onClick: function () {
            ctx.navigate("reports", { reportType: "daily", date: day.date });
          }
        })
      ])
    );

    return box;
  };
})(typeof window !== "undefined" ? window : globalThis);

    <script>
/* ===== js/views/week.js ===== */
(function (global) {
  "use strict";

  var HDML = global.HDML;
  var util = HDML.util;
  var UI = HDML.ui;
  var D = HDML.date;
  var A = HDML.actions;
  var Q = HDML.query;
  var S = HDML.stats;
  var V = HDML.viewShared;
  var T = HDML.taskUI;
  var el = UI.el;

  HDML.views = HDML.views || {};

  /* Pure view state - not persisted, not exported. */
  var open = {};

  HDML.views.week = function (ctx) {
    var state = HDML.store.get();
    var week = Q.currentWeek(state);

    if (!week) return V.noPlan(ctx);

    var ws = S.weekStats(week.id);
    var box = el("div", {});

    box.appendChild(
      el("div", { class: "greet" }, [
        el("div", { class: "greet__hello", text: week.title }),
        el("div", {
          class: "greet__date",
          text: D.formatRange(week.startDate, week.endDate)
        })
      ])
    );

    var switcher = V.weekSwitcher();
    if (switcher) {
      box.appendChild(
        el("div", { class: "no-print", style: { "margin-bottom": "18px" } }, switcher)
      );
    }

    box.appendChild(
      el("div", { class: "today-box" }, [
        el("div", { class: "today-box__row" }, [
          el("div", { class: "today-box__item" }, [
            el("div", { class: "today-box__q", text: "برنامه‌ی این هفته" }),
            el("div", { class: "today-box__a", text: util.fmtDur(ws.plannedMinutes) })
          ]),
          el("div", { class: "today-box__item" }, [
            el("div", { class: "today-box__q", text: "خوندی" }),
            el("div", { class: "today-box__a", text: util.fmtDur(ws.actualMinutes) })
          ])
        ]),
        UI.meter(ws.studyAchievementRate, { label: "پیشرفت هفته", large: true }),
        el("div", {
          class: "today-box__note",
          text:
            util.n(ws.completedTasks) +
            " کار از " +
            util.n(ws.totalTasks) +
            " کار انجام شده" +
            (ws.completedQuestions ? " · " + util.n(ws.completedQuestions) + " تست" : "")
        })
      ])
    );

    if (week.consultantNote) {
      box.appendChild(
        el("div", { style: { "margin-bottom": "18px" } },
          UI.noteBlock("پیام مشاور برای این هفته", week.consultantNote, "consultant"))
      );
    }

    box.appendChild(el("div", { class: "section-title", text: "روزهای هفته" }));

    ws.days.forEach(function (ds) {
      box.appendChild(dayRow(ds, ctx));
    });

    box.appendChild(
      el("div", { class: "no-print", style: { "margin-top": "22px" } }, [
        UI.button("📤 گزارش این هفته را بساز", {
          size: "lg",
          block: true,
          onClick: function () {
            ctx.navigate("reports", { reportType: "weekly", weekId: week.id });
          }
        })
      ])
    );

    return box;
  };

  function dayRow(ds, ctx) {
    var isOpen = !!open[ds.dayId];

    var head = el(
      "button",
      {
        type: "button",
        class: "day-simple__head",
        "aria-expanded": isOpen ? "true" : "false",
        onclick: function () {
          open[ds.dayId] = !isOpen;
          ctx.rerender();
        }
      },
      [
        el("div", { class: "day-simple__top" }, [
          el("span", { class: "day-simple__name", text: ds.dayName }),
          el("span", { class: "day-simple__date", text: D.format(ds.date, "medium") }),
          ds.isToday ? UI.badge("امروز", "type") : null,
          el("span", { class: "day-simple__summary" }, [
            ds.totalTasks
              ? el("span", {}, [
                  el("strong", { text: util.fmtHM(ds.actualMinutes) }),
                  el("span", { text: " از " }),
                  el("strong", { text: util.fmtHM(ds.plannedMinutes) }),
                  el("span", { text: " ساعت" })
                ])
              : el("span", { class: "text-muted", text: "بدون برنامه" })
          ])
        ]),
        ds.totalTasks
          ? el("div", { style: { "margin-top": "10px" } }, [
              UI.meter(ds.taskCompletionRate, { label: ds.dayName, large: true }),
              el("div", { class: "day-simple__foot" }, [
                el("span", {
                  class: "day-simple__date",
                  text:
                    util.n(ds.completedTasks) + " از " + util.n(ds.totalTasks) + " کار انجام شده"
                }),
                el("span", {
                  class: "day-simple__cta",
                  text: isOpen ? "بستن ▲" : "مشاهده برنامه ▼"
                })
              ])
            ])
          : null
      ]
    );

    var children = [head];

    if (isOpen) {
      var body = el("div", { class: "day-simple__body" });

      if (ds.consultantNote) {
        body.appendChild(UI.noteBlock("پیام مشاور", ds.consultantNote, "consultant"));
        body.appendChild(el("div", { style: { height: "12px" } }));
      }

      if (!ds.taskStats.length) {
        body.appendChild(
          el("div", { class: "day-simple__empty", text: "برای این روز کاری ثبت نشده." })
        );
      } else {
        body.appendChild(
          el(
            "div",
            {},
            ds.taskStats.map(function (ts) {
              return T.card(ts);
            })
          )
        );
        body.appendChild(
          el("div", { class: "no-print", style: { "margin-top": "14px" } }, [
            UI.button("رفتن به این روز", {
              block: true,
              onClick: function () {
                A.setUi({ selectedDate: ds.date });
                ctx.navigate("today");
              }
            })
          ])
        );
      }

      if (ds.note) {
        body.appendChild(el("div", { style: { height: "12px" } }));
        body.appendChild(UI.noteBlock("یادداشت تو", ds.note, "student"));
      }

      children.push(body);
    }

    return el(
      "div",
      { class: "day-simple" + (ds.isToday ? " is-today" : "") },
      children
    );
  }
})(typeof window !== "undefined" ? window : globalThis);

    <script>
/* ===== js/views/exams.js ===== */
(function (global) {
  "use strict";

  var HDML = global.HDML;
  var util = HDML.util;
  var UI = HDML.ui;
  var D = HDML.date;
  var A = HDML.actions;
  var Q = HDML.query;
  var S = HDML.stats;
  var V = HDML.viewShared;
  var C = HDML.charts;
  var el = UI.el;

  HDML.views = HDML.views || {};
  var E = (HDML.examUI = {});

  HDML.views.exams = function (ctx) {
    var exams = S.allExamStats();
    var box = el("div", {});

    box.appendChild(
      el("div", { class: "greet" }, [
        el("div", { class: "greet__hello", text: "آزمون‌های من" }),
        el("div", { class: "greet__date", text: "نتیجه‌ی آزمون‌هایت را اینجا ثبت کن" })
      ])
    );

    box.appendChild(
      el("div", { class: "no-print", style: { "margin-bottom": "22px" } }, [
        UI.button("➕ ثبت آزمون جدید", {
          variant: "primary",
          size: "lg",
          block: true,
          onClick: function () {
            E.openExamForm(null);
          }
        })
      ])
    );

    if (!exams.length) {
      box.appendChild(
        UI.empty({
          icon: "exam",
          title: "هنوز آزمونی ثبت نکردی",
          text: "بعد از هر آزمون، نتیجه‌اش را اینجا وارد کن تا پیشرفتت را ببینی."
        })
      );
      return box;
    }

    var upcoming = exams.filter(function (e) {
      return e.isUpcoming;
    });
    var done = exams
      .filter(function (e) {
        return !e.isUpcoming;
      })
      .reverse();

    if (upcoming.length) {
      box.appendChild(el("div", { class: "section-title", text: "آزمون‌های پیش‌رو" }));
      upcoming.forEach(function (es) {
        box.appendChild(
          el("div", { class: "simple-card" }, [
            el("div", { class: "simple-card__title", text: es.name }),
            el("div", {
              class: "simple-card__sub",
              text: D.format(es.date, "full") + " — " + D.relativeLabel(es.date)
            }),
            es.consultantNote
              ? el("div", { style: { "margin-top": "12px" } },
                  UI.noteBlock("پیام مشاور", es.consultantNote, "consultant"))
              : null,
            el("div", { style: { "margin-top": "14px" } }, [
              UI.button("ثبت نتیجه", {
                variant: "primary",
                block: true,
                onClick: function () {
                  E.openExamForm(es.examId);
                }
              })
            ])
          ])
        );
      });
    }

    if (done.length) {
      box.appendChild(el("div", { class: "section-title", text: "آزمون‌های گذشته" }));
      done.forEach(function (es) {
        box.appendChild(examCard(es, ctx));
      });
    }

    /* One chart, only once there is something to compare. */
    var trend = S.examTrend();
    if (trend.length >= 2) {
      box.appendChild(el("div", { class: "section-title", text: "روند درصد کل" }));
      box.appendChild(el("div", { class: "simple-card" }, C.examTrend(trend)));
    }

    return box;
  };

  function examCard(es, ctx) {
    var scores = [];
    if (es.taraz) {
      scores.push(scoreBlock(util.n(es.taraz), "تراز"));
    }
    if (es.overallPercentage !== null) {
      scores.push(scoreBlock(util.fmtPct(es.overallPercentage), "درصد کل"));
    }
    if (es.rank) {
      scores.push(scoreBlock(util.n(es.rank), "رتبه"));
    }

    var withData = es.subjectRows.filter(function (r) {
      return r.hasData;
    });

    var details = el("div", { class: "more-panel", hidden: true });
    var detailsBtn = el(
      "button",
      {
        type: "button",
        class: "more-toggle",
        "aria-expanded": "false",
        onclick: function () {
          var opening = details.hidden;
          details.hidden = !opening;
          detailsBtn.setAttribute("aria-expanded", opening ? "true" : "false");
          if (opening && !details.childNodes.length) {
            details.appendChild(examDetails(es));
          }
        }
      },
      [UI.icon("chevronDown"), el("span", { text: "جزئیات بیشتر" })]
    );

    return el("div", { class: "exam-simple" }, [
      el("div", { class: "exam-simple__top" }, [
        el("div", { style: { "min-width": "0" } }, [
          el("div", { class: "exam-simple__name", text: es.name }),
          el("div", { class: "exam-simple__date", text: D.format(es.date, "long") })
        ]),
        scores.length ? el("div", { class: "exam-simple__scores" }, scores) : null
      ]),

      withData.length
        ? el(
            "div",
            { class: "exam-chips" },
            withData.map(function (r) {
              return el("span", { class: "exam-chip" }, [
                el("span", { text: r.name }),
                el("strong", {
                  style: { color: util.toneColor(util.rateTone(r.percentage)) },
                  text:
                    es.scoreMode === "score20"
                      ? util.n(r.score)
                      : util.fmtPct(r.percentage)
                })
              ]);
            })
          )
        : UI.notice("نتیجه‌ی این آزمون هنوز ثبت نشده.", "warning"),

      el("div", { class: "mini-actions no-print" }, [
        el("button", {
          type: "button",
          class: "mini-link",
          text: "✏️ ویرایش",
          onclick: function () {
            E.openExamForm(es.examId);
          }
        }),
        el("button", {
          type: "button",
          class: "mini-link",
          text: "🗑 حذف",
          onclick: function () {
            UI.confirm({
              title: "حذف آزمون",
              message: "این آزمون و نتیجه‌اش حذف می‌شود. مطمئنی؟",
              danger: true,
              confirmLabel: "حذف"
            }).then(function (ok) {
              if (ok) {
                A.deleteExam(es.examId);
                UI.toast("حذف شد.");
              }
            });
          }
        })
      ]),

      withData.length ? detailsBtn : null,
      withData.length ? details : null
    ]);
  }

  function scoreBlock(value, label) {
    return el("div", {}, [
      el("div", { class: "exam-simple__score-v", text: value }),
      el("div", { class: "exam-simple__score-l", text: label })
    ]);
  }

  function examDetails(es) {
    var a = es.analysis || {};
    var hasCounts = es.subjectRows.some(function (r) {
      return r.totalQuestions > 0;
    });

    return el("div", { class: "stack" }, [
      hasCounts
        ? el("div", { class: "table-wrap" }, [
            el("table", { class: "data-table" }, [
              el("thead", {}, [
                el("tr", {}, [
                  el("th", { text: "درس" }),
                  el("th", { class: "num-cell", text: "درست" }),
                  el("th", { class: "num-cell", text: "غلط" }),
                  el("th", { class: "num-cell", text: "نزده" }),
                  el("th", { class: "num-cell", text: "درصد" })
                ])
              ]),
              el(
                "tbody",
                {},
                es.subjectRows.map(function (r) {
                  return el("tr", {}, [
                    el("td", { text: r.name }),
                    el("td", { class: "num-cell", text: r.totalQuestions ? util.n(r.correct) : "—" }),
                    el("td", { class: "num-cell", text: r.totalQuestions ? util.n(r.wrong) : "—" }),
                    el("td", { class: "num-cell", text: r.totalQuestions ? util.n(r.unanswered) : "—" }),
                    el("td", { class: "num-cell", text: r.hasData ? util.fmtPct(r.percentage) : "—" })
                  ]);
                })
              )
            ])
          ])
        : null,
      es.best ? UI.kv("بهترین درس", es.best.name + " (" + util.fmtPct(es.best.percentage) + ")") : null,
      es.worst ? UI.kv("ضعیف‌ترین درس", es.worst.name + " (" + util.fmtPct(es.worst.percentage) + ")") : null,
      a.good ? UI.noteBlock("چی خوب بود", a.good, "student") : null,
      a.bad ? UI.noteBlock("چی بد بود", a.bad, "student") : null,
      a.review ? UI.noteBlock("باید دوره کنم", a.review, "student") : null,
      es.consultantNote ? UI.noteBlock("پیام مشاور", es.consultantNote, "consultant") : null
    ]);
  }

  /**
   * One dialog does everything: define the exam and record its result.
   * Advanced fields (per-question counts, analysis) stay collapsed.
   */
  E.openExamForm = function (examId) {
    var state = HDML.store.get();
    var exam = examId ? state.consultant.exams[examId] : null;
    var es = examId ? S.examStats(examId, state) : null;
    var result = (es && es.result) || {};

    var subjects = Q.activeSubjects(state);
    if (!subjects.length) {
      UI.toast("اول باید حداقل یک درس داشته باشی. یک برنامه وارد کن.", "danger", 4500);
      return;
    }

    var chosen = exam
      ? (exam.subjectIds || []).slice()
      : subjects.map(function (s) {
          return s.id;
        });

    var basics = el("div", { class: "form-grid" }, [
      UI.field({
        label: "نام آزمون",
        name: "name",
        required: true,
        value: exam ? exam.name : "",
        placeholder: "مثلاً: آزمون قلم‌چی ۲۶ مرداد",
        full: true
      }),
      UI.field({
        label: "تاریخ",
        name: "date",
        value: exam ? D.isoToJalaliInput(exam.date) : D.isoToJalaliInput(D.today()),
        hint: "مثل ۱۴۰۵/۰۵/۲۶"
      }),
      UI.field({
        label: "تراز",
        name: "taraz",
        type: "number",
        min: 0,
        inputmode: "numeric",
        controlClass: "input--num",
        value: result.taraz == null ? "" : result.taraz
      }),
      UI.field({
        label: "رتبه",
        name: "rank",
        type: "number",
        min: 0,
        inputmode: "numeric",
        controlClass: "input--num",
        value: result.rank == null ? "" : result.rank
      })
    ]);

    var pctWrap = el("div", { class: "form-grid" });

    function pctFieldFor(s) {
      var row =
        es &&
        es.subjectRows.filter(function (r) {
          return r.subjectId === s.id;
        })[0];
      return UI.field({
        label: s.name,
        name: "p_" + s.id,
        type: "number",
        step: 0.1,
        inputmode: "decimal",
        controlClass: "input--num",
        value: row && row.hasData ? row.percentage : ""
      });
    }

    subjects.forEach(function (s) {
      if (chosen.indexOf(s.id) >= 0) pctWrap.appendChild(pctFieldFor(s));
    });

    var advanced = el("div", { class: "more-panel", hidden: true }, [
      el("p", {
        class: "field__hint",
        text: "اگر تعداد درست و غلط را وارد کنی، درصد خودش دقیق حساب می‌شود و درصد بالا نادیده گرفته می‌شود."
      }),
      countsTable(),
      UI.field({
        label: "چی خوب بود؟",
        name: "aGood",
        type: "textarea",
        rows: 2,
        full: true,
        value: (result.analysis && result.analysis.good) || ""
      }),
      UI.field({
        label: "چی بد بود؟",
        name: "aBad",
        type: "textarea",
        rows: 2,
        full: true,
        value: (result.analysis && result.analysis.bad) || ""
      }),
      UI.field({
        label: "چی را باید دوره کنم؟",
        name: "aReview",
        type: "textarea",
        rows: 2,
        full: true,
        value: (result.analysis && result.analysis.review) || ""
      })
    ]);

    function countsTable() {
      var wrap = el("div", { class: "stack stack--sm" });
      subjects.forEach(function (s) {
        if (chosen.indexOf(s.id) < 0) return;
        var row =
          es &&
          es.subjectRows.filter(function (r) {
            return r.subjectId === s.id;
          })[0];
        wrap.appendChild(
          el("div", {}, [
            el("div", { class: "field__label", text: s.name }),
            el("div", { class: "form-grid" }, [
              UI.field({
                label: "کل",
                name: "c_" + s.id + "_total",
                type: "number",
                min: 0,
                controlClass: "input--num",
                value: row && row.totalQuestions ? row.totalQuestions : ""
              }),
              UI.field({
                label: "درست",
                name: "c_" + s.id + "_correct",
                type: "number",
                min: 0,
                controlClass: "input--num",
                value: row && row.totalQuestions ? row.correct : ""
              }),
              UI.field({
                label: "غلط",
                name: "c_" + s.id + "_wrong",
                type: "number",
                min: 0,
                controlClass: "input--num",
                value: row && row.totalQuestions ? row.wrong : ""
              }),
              UI.field({
                label: "نزده",
                name: "c_" + s.id + "_blank",
                type: "number",
                min: 0,
                controlClass: "input--num",
                value: row && row.totalQuestions ? row.unanswered : ""
              })
            ])
          ])
        );
      });
      return wrap;
    }

    var moreBtn = el(
      "button",
      {
        type: "button",
        class: "more-toggle",
        "aria-expanded": "false",
        onclick: function () {
          var opening = advanced.hidden;
          advanced.hidden = !opening;
          moreBtn.setAttribute("aria-expanded", opening ? "true" : "false");
        }
      },
      [UI.icon("chevronDown"), el("span", { text: "جزئیات بیشتر (تعداد تست و تحلیل)" })]
    );

    var form = el("div", { class: "stack" }, [
      basics,
      el("div", { class: "field__label", text: "درصد هر درس" }),
      pctWrap,
      moreBtn,
      advanced
    ]);

    UI.openModal({
      title: exam ? "ویرایش آزمون" : "ثبت آزمون جدید",
      size: "wide",
      body: form,
      footer: [
        UI.button("بستن", { onClick: UI.closeModal }),
        UI.button("ذخیره", {
          variant: "primary",
          size: "lg",
          icon: "check",
          onClick: function () {
            var name = UI.valueOf(form, "name").trim();
            if (!name) {
              UI.toast("اسم آزمون را بنویس.", "danger");
              return;
            }
            var iso = D.jalaliInputToISO(UI.valueOf(form, "date"));
            if (!iso) {
              UI.toast("تاریخ درست نیست. مثل ۱۴۰۵/۰۵/۲۶ بنویس.", "danger");
              return;
            }

            var payload = {
              name: name,
              date: iso,
              type: exam ? exam.type : "mock",
              scoreMode: "percentage",
              subjectIds: chosen,
              targetPercentage: exam ? exam.targetPercentage : null,
              consultantNote: exam ? exam.consultantNote : ""
            };
            var id = exam ? (A.updateExam(exam.id, payload), exam.id) : A.addExam(payload);

            /* Build subject results: counts win when present. */
            var entries = [];
            var errors = [];
            chosen.forEach(function (sid) {
              var total = UI.numberOf(form, "c_" + sid + "_total", 0) || 0;
              var correct = UI.numberOf(form, "c_" + sid + "_correct", 0) || 0;
              var wrong = UI.numberOf(form, "c_" + sid + "_wrong", 0) || 0;
              var blank = UI.numberOf(form, "c_" + sid + "_blank", 0) || 0;
              var pct = UI.numberOf(form, "p_" + sid, null);

              if (total > 0 && correct + wrong + blank > total) {
                errors.push(
                  Q.subjectName(sid) + ": مجموع درست و غلط و نزده از کل بیشتر است."
                );
              }
              entries.push({
                subjectId: sid,
                totalQuestions: total,
                correct: correct,
                wrong: wrong,
                unanswered: blank,
                score: null,
                percentage: pct
              });
            });

            if (errors.length) {
              UI.toast(errors[0], "danger", 5000);
              advanced.hidden = false;
              return;
            }

            A.setExamResult(id, {
              taken: true,
              taraz: UI.numberOf(form, "taraz", null),
              rank: UI.numberOf(form, "rank", null),
              subjectResults: entries,
              analysis: {
                good: UI.valueOf(form, "aGood"),
                bad: UI.valueOf(form, "aBad"),
                mistakes: (result.analysis && result.analysis.mistakes) || "",
                review: UI.valueOf(form, "aReview"),
                time: (result.analysis && result.analysis.time) || ""
              },
              studentNote: result.studentNote || ""
            });

            UI.closeModal();
            UI.toast("آزمون ثبت شد.", "success");
          }
        })
      ]
    });
  };

  /* Kept so the consultant planner can still open the full editor. */
  E.openExamEditor = function (examId) {
    E.openExamForm(examId);
  };

  E.openExamDetails = function (examId) {
    var es = S.examStats(examId);
    if (!es) return;
    UI.openModal({
      title: es.name,
      subtitle: D.format(es.date, "full"),
      size: "wide",
      body: examDetails(es),
      footer: [
        UI.button("بستن", { onClick: UI.closeModal }),
        UI.button("ویرایش", {
          variant: "primary",
          onClick: function () {
            UI.closeModal();
            E.openExamForm(examId);
          }
        })
      ]
    });
  };
})(typeof window !== "undefined" ? window : globalThis);

    </script>
    <script>
/* ===== js/views/progress.js ===== */
(function (global) {
  "use strict";

  var HDML = global.HDML;
  var util = HDML.util;
  var UI = HDML.ui;
  var Q = HDML.query;
  var S = HDML.stats;
  var V = HDML.viewShared;
  var C = HDML.charts;
  var el = UI.el;

  HDML.views = HDML.views || {};

  HDML.views.progress = function (ctx) {
    var state = HDML.store.get();
    var week = Q.currentWeek(state);
    if (!week) return V.noPlan(ctx);

    var ws = S.weekStats(week.id);
    var box = el("div", {});

    box.appendChild(
      el("div", { class: "greet" }, [
        el("div", { class: "greet__hello", text: "پیشرفت من" }),
        el("div", { class: "greet__date", text: week.title + " — " + HDML.date.formatRange(week.startDate, week.endDate) })
      ])
    );

    var switcher = V.weekSwitcher();
    if (switcher) {
      box.appendChild(
        el("div", { class: "no-print", style: { "margin-bottom": "18px" } }, switcher)
      );
    }

    if (!S.hasAnyActivity(state)) {
      box.appendChild(
        UI.notice(
          "هنوز کاری را تیک نزدی. به‌محض اینکه اولین کار را انجام‌شده کنی، نمودارها اینجا ظاهر می‌شوند.",
          "info"
        )
      );
      return box;
    }

    box.appendChild(el("div", { class: "section-title", text: "📊 ساعت مطالعه این هفته" }));
    box.appendChild(
      el("div", { class: "simple-card" }, [
        el("div", { class: "big-stats" }, [
          bigStat(util.fmtHours(ws.actualMinutes), "ساعت خوندم"),
          bigStat(util.fmtHours(ws.plannedMinutes), "ساعت برنامه بود"),
          bigStat(util.fmtHours(ws.averageDailyMinutes), "ساعت میانگین روزانه")
        ]),
        el("div", { class: "divider" }),
        dayBars(ws.days),
        ws.bestDay
          ? el("div", {
              class: "simple-card__sub",
              style: { "margin-top": "14px" },
              text:
                "بهترین روزت " +
                ws.bestDay.dayName +
                " بود با " +
                util.fmtDur(ws.bestDay.actualMinutes) +
                " مطالعه."
            })
          : null
      ])
    );

    box.appendChild(el("div", { class: "section-title", text: "چقدر از برنامه انجام شد؟" }));
    box.appendChild(
      el("div", { class: "simple-card" }, [
        el("div", { class: "sbar" }, [
          el("div", { class: "sbar__top" }, [
            el("span", { class: "sbar__name", text: "زمان مطالعه" }),
            el("span", {
              class: "sbar__value",
              text:
                ws.studyAchievementRate === null ? "—" : util.fmtPct(ws.studyAchievementRate)
            })
          ]),
          UI.meter(ws.studyAchievementRate, { label: "زمان مطالعه", large: true })
        ]),
        el("div", { class: "sbar" }, [
          el("div", { class: "sbar__top" }, [
            el("span", { class: "sbar__name", text: "کارها" }),
            el("span", {
              class: "sbar__value",
              text: util.n(ws.completedTasks) + " از " + util.n(ws.totalTasks)
            })
          ]),
          UI.meter(ws.taskCompletionRate, { label: "کارها", large: true })
        ]),
        ws.targetQuestions
          ? el("div", { class: "sbar" }, [
              el("div", { class: "sbar__top" }, [
                el("span", { class: "sbar__name", text: "تست‌ها" }),
                el("span", {
                  class: "sbar__value",
                  text: util.n(ws.completedQuestions) + " از " + util.n(ws.targetQuestions)
                })
              ]),
              UI.meter(ws.questionCompletionRate, { label: "تست‌ها", large: true })
            ])
          : null,
        ws.accuracy !== null
          ? el("div", {
              class: "simple-card__sub",
              style: { "margin-top": "14px" },
              text: "از تست‌هایی که زدی، " + util.fmtPct(ws.accuracy) + " درست بوده."
            })
          : null
      ])
    );

    box.appendChild(el("div", { class: "section-title", text: "برای هر درس چقدر وقت گذاشتم؟" }));
    box.appendChild(
      el("div", { class: "simple-card" }, subjectBars(ws.bySubject))
    );

    var trend = S.trend({ limit: 28 });
    box.appendChild(el("div", { class: "section-title", text: "روند مطالعه" }));
    box.appendChild(el("div", { class: "simple-card" }, C.studyTrend(trend)));

    if (ws.skipped.length) {
      box.appendChild(el("div", { class: "section-title", text: "کارهایی که نشد" }));
      box.appendChild(
        el("div", { class: "simple-card" }, [
          el(

          el("div", {
            class: "simple-card__sub",
            style: { "margin-top": "12px" },
            text:
              "در مجموع " +
              util.n(ws.skipped.length) +
              " کار انجام نشد. این اطلاعات به مشاورت کمک می‌کند برنامه‌ی واقع‌بینانه‌تری بنویسد."
          })
        ])
      );
    }

    return box;
  };

  function bigStat(value, label) {
    return el("div", { class: "big-stat" }, [
      el("div", { class: "big-stat__value", text: value }),
      el("div", { class: "big-stat__label", text: label })
    ]);
  }

  /**
   * Study hours per day as plain labelled bars. On a phone this reads far
   * faster than a chart, and it can never overflow the screen.
   */
  function dayBars(days) {
    var max = days.reduce(function (m, d) {
      return Math.max(m, d.actualMinutes, d.plannedMinutes);
    }, 1);

    return el(
      "div",
      {},
      days.map(function (d) {
        var pct = Math.max(d.actualMinutes > 0 ? 3 : 0, (d.actualMinutes / max) * 100);
        return el("div", { class: "daybar" }, [
          el("span", { class: "daybar__name", text: d.dayName }),
          el("span", { class: "daybar__track" }, [
            el("span", {
              class: "daybar__fill",
              style: {
                width: pct + "%",
                background: d.actualMinutes >= d.plannedMinutes && d.plannedMinutes > 0
                  ? "var(--color-success)"
                  : "var(--color-blue)"
              }
            })
          ]),
          el("span", {
            class: "daybar__value",
            text: d.actualMinutes ? util.fmtHM(d.actualMinutes) : "—"
          })
        ]);
      })

  }

  /** Plain labelled bars - easier to read at a glance than a radar. */
  function subjectBars(rows) {

      return r.plannedMinutes > 0 || r.actualMinutes > 0;
    });

    if (!data.length) {
      return el("div", { class: "day-simple__empty", text: "هنوز مطالعه‌ای ثبت نشده." });
    }

    var max = data.reduce(function (m, r) {
      return Math.max(m, r.plannedMinutes, r.actualMinutes);
    }, 1);

    return data.map(function (r) {
      var width = Math.max(2, (r.actualMinutes / max) * 100);
      return el("div", { class: "sbar" }, [
        el("div", { class: "sbar__top" }, [
          el("span", { class: "sbar__name", text: r.name }),
          el("span", {
            class: "sbar__value",
            text:
              util.fmtHM(r.actualMinutes) +
              " از " +
              util.fmtHM(r.plannedMinutes) +
              (r.studyAchievementRate !== null
                ? "  (" + util.fmtPct(r.studyAchievementRate) + ")"
                : "")
          })
        ]),
        el("div", { class: "sbar__track" }, [
          el("div", {
            class: "sbar__fill",
            style: { width: width + "%", background: r.color }

    <script>
/* ===== js/views/reports.js ===== */
(function (global) {
  "use strict";

  var HDML = global.HDML;
  var util = HDML.util;
  var UI = HDML.ui;
  var D = HDML.date;
  var A = HDML.actions;
  var Q = HDML.query;
  var S = HDML.stats;
  var V = HDML.viewShared;
  var C = HDML.charts;
  var el = UI.el;

  HDML.views = HDML.views || {};
  var R = (HDML.reports = {});

  /* View-local selection state. */
  var mode = "daily";
  var selectedDate = null;
  var includeConsultant = true;

  HDML.views.reports = function (ctx) {
    var state = HDML.store.get();
    var week = Q.currentWeek(state);
    var container = el("div", {});

    if (!week) return V.noPlan(ctx);

    /* Honour navigation params (e.g. "گزارش امروز" from the Today view). */
    if (ctx.params) {
      if (ctx.params.reportType) mode = ctx.params.reportType;
      if (ctx.params.date) selectedDate = ctx.params.date;
      if (ctx.params.weekId && ctx.params.weekId !== week.id) {
        A.setUi({ currentWeekId: ctx.params.weekId });
      }
      ctx.params = null;
    }

    var days = Q.daysOfWeek(week.id);
    if (
      !selectedDate ||
      !days.some(function (d) {
        return d.date === selectedDate;
      })
    ) {
      var today = D.today();
      selectedDate = days.some(function (d) {
        return d.date === today;
      })
        ? today
        : days.length
        ? days[0].date
        : null;
    }

    var reportHost = el("div", { id: "report-host" });

    function renderReport() {
      UI.clear(reportHost);
      var node =
        mode === "daily"
          ? R.buildDaily(Q.dayByDate(selectedDate).id, { includeConsultant: includeConsultant })
          : R.buildWeekly(week.id, { includeConsultant: includeConsultant });
      reportHost.appendChild(node);
    }

    container.appendChild(
      el("div", { class: "greet" }, [
        el("div", { class: "greet__hello", text: "گزارش من" }),
        el("div", {
          class: "greet__date",
          text: "گزارش خودکار ساخته می‌شود؛ کافی است بفرستی برای مشاورت."
        })
      ])
    );

    container.appendChild(
      el("div", { class: "big-choice no-print", style: { "margin-bottom": "18px" } }, [
        el(
          "button",
          {
            type: "button",
            class: "big-choice__btn",
            "aria-pressed": mode === "daily" ? "true" : "false",
            onclick: function () {
              mode = "daily";
              ctx.rerender();
            }
          },
          [
            el("div", { class: "big-choice__emoji", text: "📄" }),
            el("div", { class: "big-choice__label", text: "گزارش امروز" }),
            el("div", { class: "big-choice__hint", text: "یک روز" })
          ]
        ),
        el(
          "button",
          {
            type: "button",
            class: "big-choice__btn",
            "aria-pressed": mode === "weekly" ? "true" : "false",
            onclick: function () {
              mode = "weekly";
              ctx.rerender();
            }
          },
          [
            el("div", { class: "big-choice__emoji", text: "🗓" }),
            el("div", { class: "big-choice__label", text: "گزارش این هفته" }),
            el("div", { class: "big-choice__hint", text: "کل هفته" })
          ]
        )
      ])
    );

    if (mode === "daily") {
      container.appendChild(
        el("div", { class: "no-print", style: { "margin-bottom": "18px" } }, [
          V.dayStrip(week.id, selectedDate, function (date) {
            selectedDate = date;
            ctx.rerender();
          })
        ])
      );
    }

    container.appendChild(
      el("div", { class: "btn-row no-print", style: { "margin-bottom": "20px" } }, [
        UI.button("🖨 چاپ یا ذخیره PDF", {
          variant: "navy",
          size: "lg",
          onClick: function () {
            R.print();
          }
        }),
        UI.button("💾 ذخیره به‌صورت فایل", {
          size: "lg",
          onClick: function () {
            R.exportHtml(reportHost.firstChild, reportTitle());
          }
        })
      ])
    );

    container.appendChild(reportHost);
    renderReport();

    function reportTitle() {
      return mode === "daily"
        ? "گزارش روزانه " + D.format(selectedDate, "long")
        : "گزارش هفتگی " + week.title;
    }

    return container;
  };

  function masthead(title, subtitle) {
    return el("div", { class: "report-masthead" }, [
      el("img", { class: "report-masthead__logo", src: HDML.LOGO, alt: "لوگو" }),
      el("div", { class: "report-masthead__center" }, [
        el("div", { class: "report-masthead__title", text: title }),
        el("div", { class: "report-masthead__sub", text: subtitle })
      ]),
      el("img", { class: "report-masthead__logo", src: HDML.LOGO, alt: "لوگو" })
    ]);
  }

  /** The identity bar from the top of the reference sheet. */
  function identityBar(state, extra) {
    var p = state.consultant.student;
    var cells = [
      { label: "نام و نام خانوادگی", value: Q.studentFullName(state) },
      { label: "پایه", value: p.grade || "—" },
      { label: "رشته", value: util.trackLabel(p.track) },
      { label: "مشاور", value: p.consultantName || "—" }
    ].concat(extra || []);

    return el(
      "div",
      { class: "report-identity" },
      cells.map(function (c) {
        return el("div", { class: "report-identity__cell" }, [
          el("div", { class: "report-identity__label", text: c.label }),
          el("div", { class: "report-identity__value", text: c.value })
        ]);
      })
    );
  }

  function section(title, body, opts) {
    var o = opts || {};
    if (!body) return null;
    return el(
      "section",
      { class: "report-section" + (o.break ? " report-section--break" : "") },
      [el("h3", { class: "report-section__title", text: title }), body]
    );
  }

  function kpiGrid(items) {
    return el(
      "div",
      { class: "report-kpis" },
      items.map(function (item) {
        return el("div", { class: "report-kpi" }, [
          el("div", { class: "report-kpi__label", text: item.label }),
          el("div", { class: "report-kpi__value", text: item.value }),
          item.sub ? el("div", { class: "report-kpi__sub", text: item.sub }) : null
        ]);
      })
    );
  }

  function taskLines(list) {
    if (!list.length) return null;
    return el(
      "div",
      {},
      list.map(function (ts) {
        var mark = ts.isCompleted ? "✓" : ts.isSkipped ? "×" : "○";
        var cls = ts.isCompleted ? "done" : ts.isSkipped ? "skip" : "pending";
        var numbers = [];
        if (ts.actualMinutes > 0 || ts.plannedMinutes > 0) {
          numbers.push(
            util.fmtHM(ts.actualMinutes) + " / " + util.fmtHM(ts.plannedMinutes)
          );
        }
        if (ts.questionsCompleted || ts.targetQuestions) {
          numbers.push(
            util.n(ts.questionsCompleted) + "/" + util.n(ts.targetQuestions) + " تست"
          );
        }
        if (ts.accuracy !== null) numbers.push(util.fmtPct(ts.accuracy) + " صحیح");
        if (ts.isEstimated) numbers.push("برآوردی");

        return el("div", { class: "report-task-line" }, [
          el("span", {
            class: "report-task-line__mark report-task-line__mark--" + cls,
            text: mark
          }),
          el("span", { class: "report-task-line__body" }, [
            el("strong", { text: Q.subjectName(ts.task.subjectId) + " · " }),
            el("span", { text: ts.task.title }),
            ts.task.topic
              ? el("span", { class: "text-muted", text: " — " + ts.task.topic })
              : null,
            ts.isSkipped
              ? el("span", {
                  class: "text-muted",
                  text: " — دلیل: " + util.skipReasonLabel(ts.skipReason)
                })
              : null
          ]),
          el("span", { class: "report-task-line__num", text: numbers.join(" · ") })
        ]);
      })
    );
  }

  function subjectTableForReport(rows) {
    if (!rows.length) return null;
    var totals = rows.reduce(
      function (acc, r) {
        acc.planned += r.plannedMinutes;
        acc.actual += r.actualMinutes;
        acc.q += r.completedQuestions;
        acc.t += r.targetQuestions;
        return acc;
      },
      { planned: 0, actual: 0, q: 0, t: 0 }
    );

    return el("table", { class: "report-table" }, [
      el("thead", {}, [
        el("tr", {}, [
          el("th", { text: "درس" }),
          el("th", { text: "برنامه" }),
          el("th", { text: "واقعی" }),
          el("th", { text: "اختلاف" }),
          el("th", { text: "تحقق" }),
          el("th", { text: "تست" })
        ])
      ]),
      el(
        "tbody",
        {},
        rows.map(function (r) {
          return el("tr", {}, [
            el("td", { text: r.name }),
            el("td", { text: util.fmtHM(r.plannedMinutes) }),
            el("td", { text: util.fmtHM(r.actualMinutes) }),
            el("td", { text: util.fmtDelta(r.deltaMinutes) }),
            el("td", {
              text:
                r.studyAchievementRate === null
                  ? "—"
                  : util.fmtPct(r.studyAchievementRate)
            }),
            el("td", {
              text:
                r.targetQuestions || r.completedQuestions
                  ? util.n(r.completedQuestions) + " / " + util.n(r.targetQuestions)
                  : "—"
            })
          ]);
        })
      ),
      el("tfoot", {}, [
        el("tr", {}, [
          el("td", { text: "مجموع" }),
          el("td", { text: util.fmtHM(totals.planned) }),
          el("td", { text: util.fmtHM(totals.actual) }),
          el("td", { text: util.fmtDelta(totals.actual - totals.planned) }),
          el("td", {
            text: totals.planned ? util.fmtPct(util.pct(totals.actual, totals.planned)) : "—"
          }),
          el("td", { text: util.n(totals.q) + " / " + util.n(totals.t) })
        ])
      ])
    ]);
  }

  function reportFoot(state) {
    return el("div", { class: "report-foot" }, [
      el("span", {
        text: "تاریخ تهیه‌ی گزارش: " + D.format(D.today(), "full")
      }),
      el("span", { text: Q.studentFullName(state) }),
      el("span", { text: "سامانه‌ی برنامه‌ریزی و گزارش عملکرد" })
    ]);
  }

  function wrapDoc(children) {
    var doc = el("div", { class: "report-doc" }, [
      el("div", { class: "report-doc__inner" }, children)
    ]);

    /* Reports stay detailed (they are meant for the consultant), but a wide
       table must scroll inside its own box - never push the phone sideways. */
    var tables = doc.querySelectorAll("table.report-table");
    for (var i = 0; i < tables.length; i++) {
      var table = tables[i];
      var wrap = el("div", { class: "report-table-wrap" });
      table.parentNode.insertBefore(wrap, table);
      wrap.appendChild(table);
    }
    return doc;
  }

  R.buildDaily = function (dayId, options) {
    var opts = options || {};
    var state = HDML.store.get();
    var ds = S.dayStats(dayId);
    if (!ds) return UI.empty({ title: "این روز پیدا نشد" });

    var week = state.consultant.weeks[ds.weekId];
    var completed = ds.taskStats.filter(function (t) {
      return t.isCompleted;
    });
    var notDone = ds.taskStats.filter(function (t) {
      return !t.isCompleted;
    });

    return wrapDoc([
      masthead("گزارش عملکرد روزانه", D.format(ds.date, "full")),
      identityBar(state, [
        { label: "هفته", value: week ? week.title : "—" },
        { label: "تاریخ", value: D.format(ds.date, "numeric") }
      ]),

      section(
        "شاخص‌های کلیدی این روز",
        kpiGrid([
          {
            label: "زمان برنامه‌ریزی‌شده",
            value: util.fmtHM(ds.plannedMinutes),
            sub: util.fmtDur(ds.plannedMinutes)
          },
          {
            label: "زمان واقعی مطالعه",
            value: util.fmtHM(ds.actualMinutes),
            sub: ds.hasEstimatedTime
              ? util.fmtHM(ds.estimatedMinutes) + " برآوردی"
              : "کاملاً ثبت‌شده"
          },
          {
            label: "تحقق مطالعه",
            value:
              ds.studyAchievementRate === null ? "—" : util.fmtPct(ds.studyAchievementRate),
            sub: "واقعی ÷ برنامه"
          },
          {
            label: "فعالیت‌ها",
            value: util.n(ds.completedTasks) + " / " + util.n(ds.totalTasks),
            sub:
              ds.taskCompletionRate === null
                ? "بدون فعالیت"
                : util.fmtPct(ds.taskCompletionRate) + " انجام‌شده"
          },
          {
            label: "تست",
            value:
              ds.targetQuestions || ds.completedQuestions
                ? util.n(ds.completedQuestions) + " / " + util.n(ds.targetQuestions)
                : "—",
            sub:
              ds.questionCompletionRate === null
                ? "بدون هدف تست"
                : util.fmtPct(ds.questionCompletionRate) + " تحقق"
          },
          {
            label: "درست / غلط / نزده",
            value:
              util.n(ds.correct) + " / " + util.n(ds.wrong) + " / " + util.n(ds.unanswered),
            sub: ds.accuracy !== null ? "درصد صحیح " + util.fmtPct(ds.accuracy) : "—"
          },
          {
            label: "انجام‌نشده",
            value: util.n(ds.skippedTasks + ds.pendingTasks),
            sub:
              util.n(ds.skippedTasks) + " با دلیل · " + util.n(ds.pendingTasks) + " بدون اقدام"
          },
          {
            label: "امتیاز کلی",
            value: ds.overallScore === null ? "—" : util.fmtPct(ds.overallScore),
            sub: "میانگین شاخص‌های بالا"
          }
        ])

      section("زمان مطالعه به تفکیک درس", subjectTableForReport(ds.bySubject)),

      completed.length
        ? section("فعالیت‌های انجام‌شده", taskLines(completed))
        : section(
            "فعالیت‌های انجام‌شده",
            el("p", { class: "text-muted text-sm", text: "هیچ فعالیتی در این روز تکمیل نشد." })
          ),

      notDone.length ? section("فعالیت‌های انجام‌نشده", taskLines(notDone)) : null,

      ds.skipped.length
        ? section(
            "دلایل انجام‌نشدن فعالیت‌ها",
            el(
              "div",
              {},
              S.countSkipReasons(ds.skipped).map(function (r) {
                return el("div", { class: "report-task-line" }, [
                  el("span", { class: "report-task-line__body", text: r.label }),
                  el("span", {
                    class: "report-task-line__num",
                    text: util.n(r.count) + " فعالیت"
                  })
                ]);
              })
            )
          )
        : null,

      ds.note
        ? section(
            "یادداشت دانش‌آموز",
            el("p", { class: "text-sm", style: { "white-space": "pre-wrap" }, text: ds.note })
          )
        : null,

      opts.includeConsultant !== false && ds.consultantNote
        ? section(
            "یادداشت مشاور برای این روز",
            el("p", {
              class: "text-sm",
              style: { "white-space": "pre-wrap" },
              text: ds.consultantNote
            })
          )
        : null,

      reportFoot(state)
    ]);
  };

  R.buildWeekly = function (weekId, options) {
    var opts = options || {};
    var state = HDML.store.get();
    var ws = S.weekStats(weekId);
    if (!ws) return UI.empty({ title: "این هفته پیدا نشد" });
    var p = state.consultant.student;

    var dailyTable = el("table", { class: "report-table" }, [
      el("thead", {}, [
        el("tr", {}, [
          el("th", { text: "روز" }),
          el("th", { text: "تاریخ" }),
          el("th", { text: "برنامه" }),
          el("th", { text: "واقعی" }),
          el("th", { text: "تحقق" }),
          el("th", { text: "فعالیت" }),
          el("th", { text: "تست" })
        ])
      ]),
      el(
        "tbody",
        {},
        ws.days.map(function (d) {
          return el("tr", {}, [
            el("td", { text: d.dayName }),
            el("td", { text: D.format(d.date, "short") }),
            el("td", { text: util.fmtHM(d.plannedMinutes) }),
            el("td", { text: util.fmtHM(d.actualMinutes) }),
            el("td", {
              text:
                d.studyAchievementRate === null ? "—" : util.fmtPct(d.studyAchievementRate)
            }),
            el("td", {
              text: util.n(d.completedTasks) + " / " + util.n(d.totalTasks)
            }),
            el("td", {
              text:
                d.targetQuestions || d.completedQuestions
                  ? util.n(d.completedQuestions) + " / " + util.n(d.targetQuestions)
                  : "—"
            })
          ]);
        })
      ),
      el("tfoot", {}, [
        el("tr", {}, [
          el("td", { text: "مجموع" }),
          el("td", { text: "—" }),
          el("td", { text: util.fmtHM(ws.plannedMinutes) }),
          el("td", { text: util.fmtHM(ws.actualMinutes) }),
          el("td", {
            text:
              ws.studyAchievementRate === null ? "—" : util.fmtPct(ws.studyAchievementRate)
          }),
          el("td", {
            text: util.n(ws.completedTasks) + " / " + util.n(ws.totalTasks)
          }),
          el("td", {
            text: util.n(ws.completedQuestions) + " / " + util.n(ws.targetQuestions)
          })
        ])
      ])
    ]);

    var examSection = ws.exams.length
      ? section(
          "آزمون‌های این هفته",
          el(
            "div",
            {},
            ws.exams.map(function (es) {
              return el("div", { style: { "margin-bottom": "14px" } }, [
                el("div", { class: "report-task-line" }, [
                  el("span", { class: "report-task-line__body" }, [
                    el("strong", { text: es.name }),
                    el("span", { class: "text-muted", text: " — " + D.format(es.date, "long") })
                  ]),
                  el("span", {
                    class: "report-task-line__num",
                    text:

      css +

      ".report-doc{margin:0 auto;}\n</style>\n</head>\n<body>\n" +
      reportNode.outerHTML +

    HDML.transfer.downloadFile(
      html,

  R.exportJson = function (kind, id) {
    var state = HDML.store.get();
    var payload;
    if (kind === "daily") {
      var day = Q.dayByDate(id);
      if (!day) return;
      var ds = S.dayStats(day.id);
      payload = {
        kind: "daily-report",
        generatedAt: D.now(),
        student: state.consultant.student,
        date: ds.date,
        dateJalali: D.isoToJalaliInput(ds.date),
        summary: pickAggregate(ds),
        bySubject: ds.bySubject.map(pickSubject),
        tasks: ds.taskStats.map(pickTask),
        note: ds.note
      };
    } else {
      var ws = S.weekStats(id);
      if (!ws) return;
      payload = {
        kind: "weekly-report",
        generatedAt: D.now(),
        student: state.consultant.student,
        week: {
          title: ws.week.title,
          startDate: ws.week.startDate,
          endDate: ws.week.endDate
        },
        summary: pickAggregate(ws),
        days: ws.days.map(function (d) {
          return Object.assign({ date: d.date, dayName: d.dayName }, pickAggregate(d));
        }),
        bySubject: ws.bySubject.map(pickSubject),
        skipReasons: ws.skipReasons,
        exams: ws.exams.map(function (e) {
          return {
            name: e.name,
            date: e.date,
            overallPercentage: e.overallPercentage,
            rank: e.rank,
            subjects: e.subjectRows.map(function (r) {
              return { name: r.name, percentage: r.percentage };
            })
          };
        }),
        reflection: ws.reflection
      };
    }

    HDML.transfer.downloadFile(
      JSON.stringify(payload, null, 2),
      sanitizeFilename(
        kind === "daily" ? "daily-report-" + id : "weekly-report-" + ws.week.title
      ) + ".json",
      "application/json"
    );
    UI.toast("خروجی JSON ذخیره شد.", "success");
  };

  function pickAggregate(agg) {
    return {
      plannedMinutes: agg.plannedMinutes,
      actualMinutes: agg.actualMinutes,
      estimatedMinutes: agg.estimatedMinutes,
      studyAchievementRate: agg.studyAchievementRate,
      totalTasks: agg.totalTasks,
      completedTasks: agg.completedTasks,
      skippedTasks: agg.skippedTasks,
      taskCompletionRate: agg.taskCompletionRate,
      targetQuestions: agg.targetQuestions,
      completedQuestions: agg.completedQuestions,
      correct: agg.correct,
      wrong: agg.wrong,
      unanswered: agg.unanswered,
      questionCompletionRate: agg.questionCompletionRate,
      accuracy: agg.accuracy,
      overallScore: agg.overallScore
    };
  }

  function pickSubject(r) {
    return {
      name: r.name,
      plannedMinutes: r.plannedMinutes,
      actualMinutes: r.actualMinutes,
      deltaMinutes: r.deltaMinutes,
      studyAchievementRate: r.studyAchievementRate,
      completedQuestions: r.completedQuestions,
      targetQuestions: r.targetQuestions
    };
  }

  function pickTask(ts) {
    return {
      title: ts.task.title,
      subject: Q.subjectName(ts.task.subjectId),
      type: ts.task.type,
      status: ts.status,
      plannedMinutes: ts.plannedMinutes,
      actualMinutes: ts.actualMinutes,
      timeSource: ts.timeSource,
      targetQuestions: ts.targetQuestions,
      questionsCompleted: ts.questionsCompleted,
      correct: ts.correct,
      wrong: ts.wrong,
      unanswered: ts.unanswered,
      accuracy: ts.accuracy,
      skipReason: ts.skipReason,
      note: ts.note
    };
  }

  /** Collects every stylesheet rule in the document (they are all local). */
  function collectCss() {
    var out = [];
    var sheets = global.document.styleSheets;
    for (var i = 0; i < sheets.length; i++) {
      try {
        var rules = sheets[i].cssRules;
        for (var j = 0; j < rules.length; j++) out.push(rules[j].cssText);
      } catch (err) {
        /* Cross-origin sheets cannot be read; there are none in this app. */
      }
    }
    return out.join("\n");
  }

  R.collectCss = collectCss;

  function sanitizeFilename(name) {
    return String(name)
      .replace(/[\\/:*?"<>|]+/g, "-")
      .replace(/\s+/g, "-")
      .slice(0, 80);
  }

  R.sanitizeFilename = sanitizeFilename;

  K.openWeekEditor = function (weekId) {
    var state = HDML.store.get();

      ? week.startDate

        UI.field({
          label: "عنوان هفته",

          required: true
        }),
        UI.field({
          label: "تاریخ شنبه‌ی هفته (شمسی)",
          name: "startDate",
          value: D.isoToJalaliInput(suggestedStart),
          hint: "قالب: ۱۴۰۵/۰۵/۲۳ — به‌صورت خودکار به شنبه گرد می‌شود"
        })
      ]),
      UI.field({
        label: "یادداشت مشاور برای این هفته",
        name: "note",
        type: "textarea",
        rows: 3,
        full: true,
        value: week ? week.consultantNote : ""
      })
    ]);

    UI.openModal({
      title: week ? "ویرایش هفته" : "هفته‌ی جدید",
      body: form,
      footer: [
        UI.button("انصراف", { onClick: UI.closeModal }),
        UI.button("ذخیره", {
          variant: "primary",
          icon: "check",
          onClick: function () {
            var title = UI.valueOf(form, "title").trim();
            var iso = D.jalaliInputToISO(UI.valueOf(form, "startDate"));
            if (!title) {
              UI.toast("عنوان هفته را وارد کنید.", "danger");
              return;
            }
            if (!iso) {
              UI.toast("تاریخ واردشده معتبر نیست. قالب درست: ۱۴۰۵/۰۵/۲۳", "danger");
              return;
            }
            var start = D.weekStart(iso);
            if (week) {
              A.updateWeek(week.id, {
                title: title,
                startDate: start,
                consultantNote: UI.valueOf(form, "note")
              });

              var id = A.createWeek(start, title);
              A.setWeekNote(id, UI.valueOf(form, "note"));

  function plannerDay(day, week, ctx) {
    var tasks = Q.tasksOfDay(day.id);
    var ds = S.dayStats(day.id);
    var isOpen = openDays[day.id] !== false; /* open by default */

    var head = el("div", { class: "planner-day__head" }, [
      el(
        "button",
        {
          type: "button",
          class: "btn btn--ghost btn--sm",
          "aria-expanded": isOpen ? "true" : "false",
          onclick: function () {
            openDays[day.id] = !isOpen;
            ctx.rerender();
          }
        },
        [UI.icon("chevronDown"), el("span", { text: isOpen ? "بستن" : "بازکردن" })]
      ),
      el("div", {}, [
        el("div", { class: "planner-day__name", text: D.WEEK_DAYS[day.dowIndex] }),
        el("div", {
          class: "planner-day__summary",
          text:
            D.format(day.date, "long") +
            " · " +
            util.n(tasks.length) +
            " فعالیت · " +
            util.fmtDur(ds.plannedMinutes)
        })
      ]),
      el("div", { style: { flex: "1" } }),
      UI.button("افزودن فعالیت", {
        size: "sm",
        icon: "plus",
        variant: "primary",
        disabled: week.locked,
        onClick: function () {
          K.openTaskEditor(day.id, null);
        }
      }),
      UI.iconButton("note", {
        title: "یادداشت مشاور برای این روز",
        onClick: function () {
          K.openDayNote(day.id);
        }
      })
    ]);

    var children = [head];

    if (isOpen) {
      var body = el("div", { class: "planner-day__body" });

      if (day.consultantNote) {
        body.appendChild(
          UI.noteBlock("یادداشت مشاور", day.consultantNote, "consultant")
        );
        body.appendChild(el("div", { style: { height: "10px" } }));
      }

      if (!tasks.length) {
        body.appendChild(
          UI.empty({
            icon: "inbox",
            title: "برای این روز فعالیتی تعریف نشده است",
            text: "ساخت برنامه‌ی این روز را شروع کنید.",
            action: UI.button("افزودن اولین فعالیت", {
              variant: "primary",
              icon: "plus",
              disabled: week.locked,
              onClick: function () {
                K.openTaskEditor(day.id, null);
              }
            })
          })
        );
      } else {
        tasks.forEach(function (task, index) {
          body.appendChild(plannerTask(task, index, tasks.length, week, ctx));
        });
      }

      children.push(body);
    }

    return el("div", { class: "planner-day" }, children);
  }

  K.openTaskEditor = function (dayId, taskId) {
    var state = HDML.store.get();
    var task = taskId ? state.consultant.tasks[taskId] : null;
    var subjects = Q.activeSubjects(state);

    if (!subjects.length) {
      UI.toast("ابتدا دست‌کم یک درس تعریف کنید.", "danger");
      K.openSubjectEditor(null);
      return;
    }

    var defaults = A.taskDefaults();
    var value = task || defaults;

    var form = el("div", { class: "stack" }, [
      el("div", { class: "form-grid" }, [
        UI.field({
          label: "درس",
          name: "subjectId",
          type: "select",
          required: true,
          value: value.subjectId || subjects[0].id,
          options: subjects.map(function (s) {
            return { value: s.id, label: s.name };
          })
        }),
        UI.field({
          label: "نوع فعالیت",
          name: "type",
          type: "select",
          value: value.type,
          options: HDML.TASK_TYPES.map(function (t) {
            return { value: t.id, label: t.label };
          })
        }),
        UI.field({
          label: "عنوان فعالیت",
          name: "title",
          required: true,
          value: value.title,
          placeholder: "مثلاً: حل ۳۰ تست مشتق",
          full: true
        }),
        UI.field({
          label: "مبحث",
          name: "topic",
          value: value.topic,
          placeholder: "مثلاً: مشتق‌پذیری"
        }),
        UI.field({
          label: "زمان برنامه‌ریزی‌شده (دقیقه)",
          name: "plannedMinutes",
          type: "number",
          min: 0,
          max: 1440,
          required: true,
          controlClass: "input--num",
          value: value.plannedMinutes
        }),
        UI.field({
          label: "تعداد تست هدف",
          name: "targetQuestions",
          type: "number",
          min: 0,
          controlClass: "input--num",
          value: value.targetQuestions || ""
        }),
        UI.field({
          label: "ساعت شروع (اختیاری)",
          name: "startTime",
          type: "time",
          value: value.startTime
        }),
        UI.field({
          label: "اولویت",
          name: "priority",
          type: "select",
          value: value.priority,
          options: HDML.PRIORITIES.map(function (p) {
            return { value: p.id, label: p.label };
          })
        })
      ]),
      UI.field({
        label: "توضیح فعالیت",
        name: "description",
        type: "textarea",
        rows: 2,
        full: true,
        value: value.description,
        placeholder: "مثلاً: صفحات ۴۰ تا ۵۵ کتاب، تمرین‌های فرد"
      }),
      UI.field({
        label: "یادداشت مشاور (به دانش‌آموز نمایش داده می‌شود)",
        name: "consultantNote",
        type: "textarea",
        rows: 2,
        full: true,
        value: value.consultantNote
      })
    ]);

    function collect() {
      return {
        subjectId: UI.valueOf(form, "subjectId"),
        type: UI.valueOf(form, "type"),
        title: UI.valueOf(form, "title").trim(),
        topic: UI.valueOf(form, "topic").trim(),
        plannedMinutes: UI.numberOf(form, "plannedMinutes", 0) || 0,
        targetQuestions: UI.numberOf(form, "targetQuestions", 0) || 0,
        startTime: UI.valueOf(form, "startTime"),
        priority: UI.valueOf(form, "priority"),
        description: UI.valueOf(form, "description"),
        consultantNote: UI.valueOf(form, "consultantNote")
      };
    }

    function validate(data) {
      if (!data.title) return "عنوان فعالیت را وارد کنید.";
      if (!data.subjectId) return "درس فعالیت را انتخاب کنید.";
      if (data.plannedMinutes < 0 || data.plannedMinutes > 1440)
        return "زمان برنامه‌ریزی‌شده باید بین ۰ تا ۱۴۴۰ دقیقه باشد.";
      if (data.targetQuestions < 0) return "تعداد تست نمی‌تواند منفی باشد.";
      return null;
    }

    UI.openModal({
      title: task ? "ویرایش فعالیت" : "افزودن فعالیت",
      subtitle: (function () {
        var day = state.consultant.days[dayId];
        return day ? D.format(day.date, "full") : "";
      })(),
      size: "wide",
      body: form,
      footer: [
        task
          ? el("div", { class: "modal__foot-start" },
              UI.button("کپی", {
                icon: "copy",
