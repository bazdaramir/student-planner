/* ===== css/tokens.css ===== */
/* ==========================================================================
   Design tokens
   Palette sampled directly from reference/logo.png:
     navy  #0E1A32   blue #2368E7   gold #CEAD3A   white #FFFFFF
   Gold is a controlled accent only - never a surface colour.
   ========================================================================== */

:root {
  --color-navy: #0e1a32;
  --color-navy-700: #16264a;
  --color-navy-600: #1e3160;
  --color-blue: #2368e7;
  --color-blue-600: #1a55c4;
  --color-blue-300: #7ba5f2;
  --color-blue-100: #dbe7fd;
  --color-blue-050: #eef4ff;
  --color-gold: #cead3a;
  --color-gold-600: #a98a24;
  --color-gold-100: #f8f0d6;

  --color-background: #f4f6fb;
  --color-surface: #ffffff;
  --color-surface-2: #f8fafd;
  --color-surface-sunken: #eef1f8;
  --color-border: #dfe4ee;
  --color-border-strong: #c3cbdb;
  --color-text: #16203a;
  --color-text-soft: #47536f;
  --color-muted: #77839d;
  --color-muted-2: #9aa4bb;

  --color-success: #16875a;
  --color-success-bg: #e3f5ec;
  --color-warning: #b06f0a;
  --color-warning-bg: #fdf1de;
  --color-danger: #c33232;
  --color-danger-bg: #fdeaea;
  --color-info: var(--color-blue);
  --color-info-bg: var(--color-blue-050);

  /* --- subject palette (assigned per subject, stable) -------------------- */
  --subject-1: #2368e7;
  --subject-2: #7b3fd4;
  --subject-3: #0f9e8e;
  --subject-4: #d4682a;
  --subject-5: #c0392b;
  --subject-6: #2e7d32;
  --subject-7: #a98a24;
  --subject-8: #4a6fa5;
  --subject-9: #b5347a;
  --subject-10: #5c6bc0;

  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 22px;
  --radius-pill: 999px;

  --shadow-xs: 0 1px 2px rgba(14, 26, 50, 0.06);
  --shadow-sm: 0 2px 6px rgba(14, 26, 50, 0.07);
  --shadow-md: 0 6px 18px rgba(14, 26, 50, 0.09);
  --shadow-lg: 0 18px 44px rgba(14, 26, 50, 0.16);
  --shadow-focus: 0 0 0 3px rgba(35, 104, 231, 0.28);

  --spacing-1: 4px;
  --spacing-2: 8px;
  --spacing-3: 12px;
  --spacing-4: 16px;
  --spacing-5: 20px;
  --spacing-6: 24px;
  --spacing-7: 32px;
  --spacing-8: 40px;
  --spacing-9: 56px;

  --font-fa: "Vazirmatn", "IRANSans", "Sahel", "Shabnam", "Segoe UI",
    "Tahoma", "Iranian Sans", "Noto Naskh Arabic", sans-serif;
  --font-num: "Segoe UI", "Tahoma", var(--font-fa);
  --text-xs: 11px;
  --text-sm: 12.5px;
  --text-base: 14px;
  --text-md: 15.5px;
  --text-lg: 18px;
  --text-xl: 22px;
  --text-2xl: 28px;
  --text-3xl: 36px;
  --leading-tight: 1.35;
  --leading-normal: 1.7;

  --sidebar-w: 244px;
  --topbar-h: 62px;
  --content-max: 1320px;
  --transition: 140ms cubic-bezier(0.4, 0, 0.2, 1);
}

/* The sketch asks for a page border in the logo's colour theme
   ("دور تا دور صفحه حاشیه با تم رنگ logo باشه"). Rendered as a brand
   hairline frame on the shell and on printed reports. */
:root {
  --brand-frame: linear-gradient(
    90deg,
    var(--color-navy) 0%,
    var(--color-blue) 45%,
    var(--color-gold) 100%
  );
}

/* ===== css/base.css ===== */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-fa);
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  color: var(--color-text);
  background: var(--color-background);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1,
h2,
h3,
h4,
h5,
p,
figure,
ul,
ol {
  margin: 0;
  padding: 0;
}

ul,
ol {
  list-style: none;
}

h1,
h2,
h3,
h4 {
  line-height: var(--leading-tight);
  font-weight: 700;
  color: var(--color-navy);
}

a {
  color: var(--color-blue);
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
}

img,
svg {
  display: block;
  max-width: 100%;
}

table {
  border-collapse: collapse;
  width: 100%;
}

hr {
  border: none;
  border-top: 1px solid var(--color-border);
  margin: var(--spacing-5) 0;
}

:focus-visible {
  outline: 2px solid var(--color-blue);
  outline-offset: 2px;
  border-radius: var(--radius-xs);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  inset-inline-start: var(--spacing-4);
  top: -60px;
  z-index: 200;
  background: var(--color-navy);
  color: #fff;
  padding: var(--spacing-2) var(--spacing-4);
  border-radius: var(--radius-sm);
  transition: top var(--transition);
}

.skip-link:focus {
  top: var(--spacing-3);
}

/* --- numeric text: keep digits LTR-clean inside RTL ---------------------- */
.num {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  direction: ltr;
  unicode-bidi: isolate;
  display: inline-block;
}

* {
  scrollbar-width: thin;
  scrollbar-color: var(--color-border-strong) transparent;
}

*::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

*::-webkit-scrollbar-thumb {
  background: var(--color-border-strong);
  border-radius: var(--radius-pill);
  border: 3px solid transparent;
  background-clip: content-box;
}

*::-webkit-scrollbar-track {
  background: transparent;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* ===== css/layout.css ===== */
.app {
  min-height: 100vh;
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  background: var(--color-background);
}

/* Brand hairline frame around the whole page (from the reference sketch) */
.app::before {
  content: "";
  position: fixed;
  inset: 0;
  border: 3px solid transparent;
  border-image: var(--brand-frame) 1;
  pointer-events: none;
  z-index: 90;
}

.sidebar {
  grid-column: 1;
  background: var(--color-navy);
  color: #dce4f3;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  z-index: 60;
}

.sidebar__brand {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  padding: var(--spacing-5) var(--spacing-4) var(--spacing-4);
  border-bottom: 1px solid rgba(255, 255, 255, 0.09);
}

.sidebar__logo {
  width: 42px;
  height: 42px;
  flex: 0 0 42px;
  object-fit: contain;
  background: #fff;
  border-radius: var(--radius-md);
  padding: 3px;
}

.sidebar__title {
  font-size: var(--text-md);
  font-weight: 700;
  color: #fff;
  line-height: 1.25;
}

.sidebar__subtitle {
  font-size: var(--text-xs);
  color: #9fb2d4;
  letter-spacing: 0.02em;
}

.sidebar__student {
  padding: var(--spacing-4);
  margin: var(--spacing-4);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--radius-md);
}

.sidebar__student-name {
  color: #fff;
  font-weight: 700;
  font-size: var(--text-base);
  overflow-wrap: anywhere;
}

.sidebar__student-meta {
  font-size: var(--text-xs);
  color: #9fb2d4;
  margin-top: 2px;
}

.sidebar__nav {
  padding: 0 var(--spacing-3) var(--spacing-4);
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
}

.nav-group-label {
  font-size: var(--text-xs);
  color: #7d90b4;
  padding: var(--spacing-4) var(--spacing-3) var(--spacing-1);
  letter-spacing: 0.04em;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  width: 100%;
  padding: 9px var(--spacing-3);
  border-radius: var(--radius-sm);
  color: #c6d3ea;
  font-size: var(--text-base);
  text-align: start;
  transition: background var(--transition), color var(--transition);
  position: relative;
}

.nav-item:hover {
  background: rgba(255, 255, 255, 0.07);
  color: #fff;
}

.nav-item[aria-current="page"] {
  background: var(--color-blue);
  color: #fff;
  font-weight: 600;
}

.nav-item[aria-current="page"]::before {
  content: "";
  position: absolute;
  inset-inline-end: -var(--spacing-3);
  inset-inline-end: calc(var(--spacing-3) * -1);
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 22px;
  border-radius: var(--radius-pill);
  background: var(--color-gold);
}

.nav-item__icon {
  width: 19px;
  height: 19px;
  flex: 0 0 19px;
  opacity: 0.95;
}

.nav-item__badge {
  margin-inline-start: auto;
  background: rgba(255, 255, 255, 0.16);
  border-radius: var(--radius-pill);
  padding: 1px 8px;
  font-size: var(--text-xs);
}

.nav-item[aria-current="page"] .nav-item__badge {
  background: rgba(0, 0, 0, 0.22);
}

.sidebar__footer {
  padding: var(--spacing-4);
  border-top: 1px solid rgba(255, 255, 255, 0.09);
  font-size: var(--text-xs);
  color: #8296b8;
}

.mode-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  background: rgba(206, 173, 58, 0.16);
  border: 1px solid rgba(206, 173, 58, 0.4);
  color: var(--color-gold);
  font-size: var(--text-xs);
  font-weight: 600;
}

.main {
  grid-column: 2;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: var(--topbar-h);
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  padding: 0 var(--spacing-6);
  position: sticky;
  top: 0;
  z-index: 50;
}

.topbar__title {
  font-size: var(--text-lg);
  font-weight: 700;
  color: var(--color-navy);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar__sub {
  font-size: var(--text-xs);
  color: var(--color-muted);
  white-space: nowrap;
}

.topbar__spacer {
  flex: 1;
}

.topbar__actions {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
}

.hamburger {
  display: none;
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  align-items: center;
  justify-content: center;
  border: 1px solid var(--color-border);
  color: var(--color-navy);
}

.content {
  padding: var(--spacing-6);
  max-width: var(--content-max);
  width: 100%;
  margin-inline: auto;
  flex: 1;
}

.view-section {
  margin-bottom: var(--spacing-7);
}

.section-head {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  margin-bottom: var(--spacing-4);
  flex-wrap: wrap;
}

.section-head h2 {
  font-size: var(--text-lg);
}

.section-head p {
  font-size: var(--text-sm);
  color: var(--color-muted);
}

.section-head__spacer {
  flex: 1;
}

.grid {
  display: grid;
  gap: var(--spacing-4);
}

.grid--kpi {
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
}

.grid--2 {
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
}

.grid--3 {
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}

.grid--sidebar-right {
  grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
}

@media (max-width: 1080px) {
  .grid--sidebar-right {
    grid-template-columns: 1fr;
  }
}

.drawer-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(14, 26, 50, 0.5);
  z-index: 55;
}

.bottom-nav {
  display: none;
}

@media (max-width: 900px) {
  .app {
    grid-template-columns: 1fr;
  }

  .main {
    grid-column: 1;
  }

  /* Off-canvas drawer.
     Anchored to the inline START edge (the right in RTL, the left in LTR) and
     pushed away along the matching physical axis. `transform` is physical, so
     the two directions need opposite signs.
     `visibility` + `pointer-events` are the important part: without them a
     closed drawer still hit-tests, and an invisible panel would swallow every
     tap along that edge of the screen. */
  .sidebar {
    position: fixed;
    inset-block: 0;
    inset-inline-start: 0;
    width: 268px;
    transform: translateX(100%);
    visibility: hidden;
    pointer-events: none;
    transition: transform var(--transition), visibility var(--transition);
    box-shadow: var(--shadow-lg);
  }

  [dir="ltr"] .sidebar {
    transform: translateX(-100%);
  }

  .app.is-drawer-open .sidebar {
    transform: translateX(0);
    visibility: visible;
    pointer-events: auto;
  }

  .app.is-drawer-open .drawer-backdrop {
    display: block;
  }

  .hamburger {
    display: inline-flex;
  }

  .topbar {
    padding: 0 var(--spacing-4);
  }

  .content {
    padding: var(--spacing-4);
    padding-bottom: 84px;
  }

  .bottom-nav {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    position: fixed;
    inset-inline: 0;
    bottom: 0;
    background: var(--color-surface);
    border-top: 1px solid var(--color-border);
    z-index: 58;
    padding-bottom: env(safe-area-inset-bottom, 0);
    box-shadow: 0 -2px 12px rgba(14, 26, 50, 0.07);
  }

  .bottom-nav__item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 8px 2px 9px;
    font-size: var(--text-xs);
    color: var(--color-muted);
  }

  .bottom-nav__item svg {
    width: 21px;
    height: 21px;
  }

  .bottom-nav__item[aria-current="page"] {
    color: var(--color-blue);
    font-weight: 700;
  }

  .grid--kpi {
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  }
}

@media (max-width: 520px) {
  .content {
    padding: var(--spacing-3);
    padding-bottom: 84px;
  }

  .grid--kpi {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* ===== css/components.css ===== */
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xs);
}

.card__head {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  padding: var(--spacing-4) var(--spacing-5);
  border-bottom: 1px solid var(--color-border);
}

.card__head h3 {
  font-size: var(--text-md);
}

.card__head .card__spacer {
  flex: 1;
}

.card__hint {
  font-size: var(--text-xs);
  color: var(--color-muted);
  font-weight: 400;
}

.card__body {
  padding: var(--spacing-5);
}

.card__body--flush {
  padding: 0;
}

.card--accent {
  border-top: 3px solid var(--color-gold);
}

.kpi {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--spacing-4) var(--spacing-5);
  box-shadow: var(--shadow-xs);
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.kpi__label {
  font-size: var(--text-xs);
  color: var(--color-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}

.kpi__value {
  font-size: var(--text-2xl);
  font-weight: 700;
  color: var(--color-navy);
  line-height: 1.15;
  letter-spacing: -0.01em;
}

.kpi__value small {
  font-size: var(--text-base);
  font-weight: 600;
  color: var(--color-muted);
}

.kpi__foot {
  font-size: var(--text-xs);
  color: var(--color-text-soft);
  margin-top: var(--spacing-1);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.kpi--gold .kpi__value {
  color: var(--color-gold-600);
}

.meter {
  height: 7px;
  background: var(--color-surface-sunken);
  border-radius: var(--radius-pill);
  overflow: hidden;
  margin-top: var(--spacing-2);
}

.meter__fill {
  height: 100%;
  border-radius: var(--radius-pill);
  background: var(--color-blue);
  transition: width 320ms cubic-bezier(0.4, 0, 0.2, 1);
}

.meter__fill--success {
  background: var(--color-success);

    <!-- Error boundary. Deliberately the FIRST script in the document and
         written in plain ES5 with no dependencies, so it still works if
         everything after it fails to parse. Turns any fatal startup problem
         into a readable message instead of a white screen. -->
    <script>
      (function () {
        var handled = false;

        function mounted() {
          return !!document.querySelector("#app-root .app");
        }

        function showFailure(kind, detail) {
          /* Once the real app is on screen, a later error must not wipe it. */
          if (handled || mounted()) {
            if (window.console) console.error(kind, detail);
            return;
          }
          handled = true;
          var root = document.getElementById("app-root");
          if (!root) return;

          var box = document.createElement("div");
          box.className = "boot-error";

          var title = document.createElement("div");
          title.className = "boot-error__title";
          title.appendChild(document.createTextNode("یک خطای غیرمنتظره رخ داد."));

          var text = document.createElement("p");
          text.className = "boot-error__text";
          text.appendChild(
            document.createTextNode(
              "برنامه به‌درستی باز نشد. لطفاً متن زیر را برای پشتیبانی بفرستید."
            )
          );

          var pre = document.createElement("pre");
          pre.className = "boot-error__detail";
          pre.setAttribute("dir", "ltr");
          pre.appendChild(
            document.createTextNode(
              kind +
                ": " +
                detail +
                "\nUA: " +
                (navigator.userAgent || "?") +
                "\nURL: " +
                String(location.protocol)
            )
          );

          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "boot-error__btn";
          btn.appendChild(document.createTextNode("تلاش دوباره"));
          btn.onclick = function () {
            location.reload();
          };

          root.innerHTML = "";
          box.appendChild(title);
          box.appendChild(text);
          box.appendChild(pre);
          box.appendChild(btn);
          root.appendChild(box);
        }

        window.__enigmaFail = showFailure;

        window.addEventListener("error", function (e) {
          showFailure(
            "Error",
            (e.message || "unknown") + " @" + (e.lineno || 0) + ":" + (e.colno || 0)
          );
        });

        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          showFailure("Promise", String((r && r.message) || r));
        });

        /* Watchdog: if the shell never mounted, say why instead of staying
           blank. Generous delay so a slow phone is not accused unfairly. */
        window.addEventListener("load", function () {
          setTimeout(function () {
            if (!mounted()) {
              showFailure(
                "Startup",
                "برنامه بالا نیامد. HDML=" +
                  (typeof window.HDML) +
                  " views=" +
                  (window.HDML && window.HDML.views ? "yes" : "no")
              );
            }
          }, 4000);
        });
      })();
    </script>

    <!-- Capture a pristine copy of this document so the app can re-emit
         itself with a different payload (the student HTML export). Must run
         before app.js registers its own DOMContentLoaded handler. -->
    <script>
      (function () {
        window.HDML = window.HDML || {};
        function capture() {
          try {
            window.HDML.IS_MULTIFILE =
              document.querySelectorAll('link[rel="stylesheet"]').length > 0;
            window.HDML.PRISTINE_HTML =
              "<!doctype html>\n" + document.documentElement.outerHTML;
          } catch (err) {
            /* Only the "save a new file" feature needs this; never fatal. */
            if (window.console) console.error("pristine capture failed", err);
          }
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", capture);
        } else {
          capture();
        }
      })();
    </script>

      },
      ui: {
        view: "dashboard",
        currentWeekId: null,
        selectedDate: null,
        taskFilter: { status: "all", subjectId: "all", type: "all" },
        consultantUnlocked: false
      }
    };
  }

  HDML.defaultState = defaultState;
  HDML.emptyStudentProfile = emptyStudentProfile;

  var store = (HDML.store = {});

  var state = defaultState();
  var listeners = [];
  var storageAvailable = null;
  var storageKey = null;

  store.version = 0;
  store.storageError = null;

  store.get = function () {
    return state;
  };

  store.subscribe = function (fn) {
    listeners.push(fn);
    return function () {
      var i = listeners.indexOf(fn);
      if (i >= 0) listeners.splice(i, 1);
    };
  };

  var notifyScheduled = false;

  function notify() {
    if (notifyScheduled) return;
    notifyScheduled = true;
    /* Coalesce bursts of mutations into one render pass.
       setTimeout rather than requestAnimationFrame on purpose: rAF does not
       fire in a hidden or background tab, which would silently stall the UI
       until the tab is looked at again. */
    setTimeout(function () {
      notifyScheduled = false;
      var snapshot = listeners.slice();
      for (var i = 0; i < snapshot.length; i++) {
        try {
          snapshot[i](state);
        } catch (err) {
          if (global.console) console.error("listener failed", err);
        }
      }
    }, 0);
  }

  store.notify = notify;

  /**
   * The only way state changes. Bumps the version (invalidating memoised
   * stats), persists, and schedules one render.
   * @param {function(Object)} fn mutator receiving the live state
   * @param {{silent?:boolean, plan?:boolean}} [opts] plan:true marks the
   *        consultant plan as changed, which student files use to detect a
   *        newer plan embedded in a freshly received HTML file.
   */
  store.mutate = function (fn, opts) {
    var options = opts || {};
    fn(state);
    state.meta.updatedAt = D.now();
    if (options.plan) state.meta.planStamp = D.now();
    store.version += 1;
    store.persist();
    if (!options.silent) notify();
  };

  /** Replace the whole state (import / reset / demo). */
  store.replace = function (next, opts) {
    state = next;
    store.version += 1;
    resolveStorageKey();
    store.persist();
    if (!(opts && opts.silent)) notify();
  };

  function testStorage() {
    if (storageAvailable !== null) return storageAvailable;
    try {
      var k = "__hdml_probe__";
      global.localStorage.setItem(k, "1");
      global.localStorage.removeItem(k);
      storageAvailable = true;
    } catch (err) {
      storageAvailable = false;
      store.storageError =
        "حافظه‌ی مرورگر در دسترس نیست. اطلاعات فقط تا زمان باز بودن صفحه نگهداری می‌شود؛ لطفاً از «پشتیبان‌گیری» استفاده کنید.";
    }
    return storageAvailable;
  }

  store.isStorageAvailable = testStorage;

  /* Storage is keyed by student id so two different student files on the same
     machine never overwrite each other (file:// pages share one origin). */
  function resolveStorageKey() {
    storageKey =
      STORAGE_PREFIX +
      ((state.consultant && state.consultant.student && state.consultant.student.id) ||
        "default");
    return storageKey;
  }

  store.storageKey = function () {
    return storageKey || resolveStorageKey();
  };

  var persistPending = false;

  function writeState() {
    global.localStorage.setItem(store.storageKey(), JSON.stringify(state));
    global.localStorage.setItem(LAST_KEY, state.consultant.student.id);
  }

  store.persist = function () {
    if (!testStorage()) return;
    if (persistPending) return;
    persistPending = true;
    setTimeout(function () {
      persistPending = false;
      try {
        writeState();
        store.storageError = null;
      } catch (err) {
        store.storageError =
          "ذخیره‌سازی ناموفق بود (احتمالاً فضای حافظه پر است). لطفاً از داده‌ها خروجی پشتیبان بگیرید.";
        if (global.console) console.error(err);
      }
    }, 120);
  };

  store.persistNow = function () {
    if (!testStorage()) return false;
    try {
      writeState();
      return true;
    } catch (err) {
      return false;
    }
  };

  /** Student id this browser last saved, if any. */
  store.lastStudentId = function () {
    if (!testStorage()) return null;
    try {
      return global.localStorage.getItem(LAST_KEY);
    } catch (err) {
      return null;
    }
  };

  store.readStored = function (studentId) {
    if (!testStorage()) return null;
    try {
      var raw = global.localStorage.getItem(STORAGE_PREFIX + studentId);
      return raw ? JSON.parse(raw) : null;
    } catch (err) {
      return null;
    }
  };

  store.clearStored = function () {
    if (!testStorage()) return;
    try {
      global.localStorage.removeItem(store.storageKey());
      global.localStorage.removeItem(LAST_KEY);
    } catch (err) {
    }
  };

  /** Fills in anything a older/partial payload is missing. Never throws. */
  store.normalize = function (raw) {
    var base = defaultState();
    if (!util.isObject(raw)) return base;

    var out = base;
    out.schemaVersion = HDML.SCHEMA_VERSION;

    if (util.isObject(raw.meta)) {
      out.meta.createdAt = raw.meta.createdAt || out.meta.createdAt;
      out.meta.updatedAt = raw.meta.updatedAt || out.meta.updatedAt;
      out.meta.planStamp = raw.meta.planStamp || out.meta.updatedAt;
      out.meta.exportedForStudent = !!raw.meta.exportedForStudent;
      out.meta.isDemo = !!raw.meta.isDemo;
    }

    if (util.isObject(raw.settings)) {
      out.settings.persianDigits =
        raw.settings.persianDigits === undefined
          ? true
          : !!raw.settings.persianDigits;
    }

    var c = util.isObject(raw.consultant) ? raw.consultant : {};
    out.consultant.student = Object.assign(
      emptyStudentProfile(),
      util.isObject(c.student) ? c.student : {}
    );
    if (!out.consultant.student.id) out.consultant.student.id = util.uid("stu");

    out.consultant.subjects = Array.isArray(c.subjects)
      ? c.subjects.filter(util.isObject).map(function (s, i) {
          return {
            id: s.id || util.uid("sub"),
            name: String(s.name || "بدون‌نام"),
            color: s.color || util.subjectColor(i),
            order: s.order == null ? i : s.order,
            archived: !!s.archived
          };
        })
      : [];

    out.consultant.weeks = util.isObject(c.weeks) ? c.weeks : {};
    out.consultant.days = util.isObject(c.days) ? c.days : {};
    out.consultant.tasks = util.isObject(c.tasks) ? c.tasks : {};
    out.consultant.exams = util.isObject(c.exams) ? c.exams : {};
    out.consultant.templates = Array.isArray(c.templates) ? c.templates : [];
    out.consultant.feedback = util.isObject(c.feedback) ? c.feedback : {};

    var s = util.isObject(raw.student) ? raw.student : {};
    out.student.taskLogs = util.isObject(s.taskLogs) ? s.taskLogs : {};
    out.student.timers = util.isObject(s.timers) ? s.timers : {};
    out.student.dailyNotes = util.isObject(s.dailyNotes) ? s.dailyNotes : {};
    out.student.weeklyReflections = util.isObject(s.weeklyReflections)
      ? s.weeklyReflections
      : {};
    out.student.examResults = util.isObject(s.examResults) ? s.examResults : {};

    if (util.isObject(raw.ui)) {
      out.ui.view = raw.ui.view || "dashboard";
      out.ui.currentWeekId = raw.ui.currentWeekId || null;
      out.ui.consultantUnlocked = !!raw.ui.consultantUnlocked;
    }

    /* A week that no longer exists must not be "current". */
    if (out.ui.currentWeekId && !out.consultant.weeks[out.ui.currentWeekId]) {
      out.ui.currentWeekId = null;
    }
    if (!out.ui.currentWeekId) {
      var weekIds = Object.keys(out.consultant.weeks);
      if (weekIds.length) out.ui.currentWeekId = store.pickCurrentWeek(out);
    }

    return out;
  };

  /** Week containing today, else the most recent week that has started. */
  store.pickCurrentWeek = function (st) {
    var today = D.today();
    var weeks = util.values(st.consultant.weeks).sort(function (a, b) {
      return D.compare(a.startDate, b.startDate);
    });
    if (!weeks.length) return null;
    for (var i = 0; i < weeks.length; i++) {
      if (weeks[i].startDate <= today && today <= weeks[i].endDate) {
        return weeks[i].id;
      }
    }
    var past = weeks.filter(function (w) {
      return w.startDate <= today;
    });
    if (past.length) return past[past.length - 1].id;
    return weeks[0].id;
  };

  /**
   * Boot order:
   *   1. normalise the plan embedded in this HTML file (if any)
   *   2. find the right storage bucket: the embedded student id when this file
   *      carries a plan, otherwise the id this browser last saved
   *   3. prefer local data, but report when the file carries a NEWER plan so
   *      the app can offer a non-destructive plan update
   */
  store.boot = function (embedded) {
    var fromFile = embedded ? store.normalize(embedded) : null;
    /* With no embedded plan (a plan being authored from scratch) fall back to
       the last student this browser saved, so a refresh never loses work. */
    var studentId =
      (fromFile && fromFile.consultant.student.id) || store.lastStudentId();

    var stored = studentId ? store.readStored(studentId) : null;
    var result = { source: "new", newerPlanInFile: false };

    if (stored) {
      state = store.normalize(stored);
      result.source = "storage";
      if (
        fromFile &&
        fromFile.meta.planStamp &&
        state.meta.planStamp &&
        fromFile.meta.planStamp > state.meta.planStamp
      ) {
        result.newerPlanInFile = true;
        store.pendingPlan = fromFile;
      }
    } else if (fromFile) {
      state = fromFile;
      result.source = "file";
    } else {
      state = defaultState();
    }

    util.usePersianDigits = state.settings.persianDigits !== false;
    resolveStorageKey();
    store.version += 1;
    return result;
  };

  /**
   * Adopt a newer plan from the file while KEEPING all student performance.
   * This is the consultant -> student handoff for week 2 onwards.
   */
  store.adoptPlan = function (planState) {
    store.mutate(function (st) {
      st.consultant = util.clone(planState.consultant);
      st.meta.planStamp = planState.meta.planStamp;
      st.meta.exportedForStudent = planState.meta.exportedForStudent;
      st.ui.currentWeekId = store.pickCurrentWeek(st);
    });
    store.pendingPlan = null;
  };

  var A = (HDML.actions = {});

  A.setProfile = function (patch) {
    store.mutate(function (st) {
      Object.assign(st.consultant.student, patch);
    }, { plan: true });
  };

  A.setSetting = function (key, value) {
    store.mutate(function (st) {
      st.settings[key] = value;
      if (key === "persianDigits") util.usePersianDigits = !!value;
    });
  };

  A.setUi = function (patch) {
    store.mutate(function (st) {
      Object.assign(st.ui, patch);
    });
  };

  A.addSubject = function (name, color) {
    var id = util.uid("sub");
    store.mutate(function (st) {
      st.consultant.subjects.push({
        id: id,
        name: String(name || "").trim() || "درس جدید",
        color: color || util.subjectColor(st.consultant.subjects.length),
        order: st.consultant.subjects.length,
        archived: false
      });
    }, { plan: true });
    return id;
  };

  A.updateSubject = function (id, patch) {
    store.mutate(function (st) {
      st.consultant.subjects.forEach(function (s) {
        if (s.id === id) Object.assign(s, patch);
      });
    }, { plan: true });
  };

  A.removeSubject = function (id) {
    store.mutate(function (st) {
      st.consultant.subjects = st.consultant.subjects.filter(function (s) {
        return s.id !== id;
      });
    }, { plan: true });
  };

  A.subjectsInUse = function (subjectId) {
    var st = state;
    var count = 0;
    Object.keys(st.consultant.tasks).forEach(function (id) {
      if (st.consultant.tasks[id].subjectId === subjectId) count++;
    });
    return count;
  };

  A.setDefaultSubjects = function (track) {
    var names = HDML.DEFAULT_SUBJECTS[track] || HDML.DEFAULT_SUBJECTS.other;
    store.mutate(function (st) {
      st.consultant.subjects = names.map(function (name, i) {
        return {
          id: util.uid("sub"),
          name: name,
          color: util.subjectColor(i),
          order: i,
          archived: false
        };
      });
    }, { plan: true });
  };

  /** Creates a week plus its seven day records (Saturday..Friday). */
  A.createWeek = function (startDateIso, title) {
    var start = D.weekStart(startDateIso || D.today());
    var weekId = util.uid("wk");
    var dayIds = [];
    store.mutate(function (st) {
      var index =
        util.values(st.consultant.weeks).reduce(function (max, w) {
          return Math.max(max, w.index || 0);
        }, 0) + 1;

      st.consultant.weeks[weekId] = {
        id: weekId,
        index: index,
        title: title || "هفته " + index,
        startDate: start,
        endDate: D.addDays(start, 6),
        locked: false,
        consultantNote: "",
        createdAt: D.now()
      };

      D.weekDates(start).forEach(function (iso, i) {
        var dayId = util.uid("day");
        dayIds.push(dayId);
        st.consultant.days[dayId] = {
          id: dayId,
          weekId: weekId,
          date: iso,
          dowIndex: i,
          consultantNote: ""
        };
      });

      st.ui.currentWeekId = weekId;
    }, { plan: true });
    return weekId;
  };

  A.updateWeek = function (weekId, patch) {
    store.mutate(function (st) {
      var w = st.consultant.weeks[weekId];
      if (!w) return;
      Object.assign(w, patch);
      /* Moving the start date moves every day with it. */
      if (patch.startDate) {
        w.endDate = D.addDays(patch.startDate, 6);
        util.values(st.consultant.days)
          .filter(function (d) {
            return d.weekId === weekId;
          })
          .forEach(function (d) {
            d.date = D.addDays(patch.startDate, d.dowIndex);
          });
      }
    }, { plan: true });
  };

  A.deleteWeek = function (weekId) {
    store.mutate(function (st) {
      var dayIds = util.values(st.consultant.days)
        .filter(function (d) {
          return d.weekId === weekId;
        })
        .map(function (d) {
          return d.id;
        });

      Object.keys(st.consultant.tasks).forEach(function (tid) {
        if (dayIds.indexOf(st.consultant.tasks[tid].dayId) >= 0) {
          delete st.consultant.tasks[tid];
          delete st.student.taskLogs[tid];
          delete st.student.timers[tid];
        }
      });
      dayIds.forEach(function (id) {
        delete st.consultant.days[id];
        delete st.student.dailyNotes[id];
      });
      delete st.consultant.weeks[weekId];
      delete st.student.weeklyReflections[weekId];
      delete st.consultant.feedback[weekId];

      if (st.ui.currentWeekId === weekId) {
        st.ui.currentWeekId = store.pickCurrentWeek(st);
      }
    }, { plan: true });
  };

  A.setDayNote = function (dayId, note) {
    store.mutate(function (st) {
      var d = st.consultant.days[dayId];
      if (d) d.consultantNote = note;
    }, { plan: true });
  };

  function taskDefaults() {
    return {
      subjectId: null,
      topic: "",
      title: "",
      description: "",
      type: "study",
      plannedMinutes: 60,
      startTime: "",
      targetQuestions: 0,
      priority: "normal",
      consultantNote: ""
    };
  }

  A.taskDefaults = taskDefaults;

  A.addTask = function (dayId, data) {
    var id = util.uid("tsk");
    store.mutate(function (st) {
      var siblings = util.values(st.consultant.tasks).filter(function (t) {
        return t.dayId === dayId;
      });
      st.consultant.tasks[id] = Object.assign(taskDefaults(), data, {
        id: id,
        dayId: dayId,
        order: siblings.length,
        createdAt: D.now()
      });
    }, { plan: true });
    return id;
  };

  A.updateTask = function (taskId, patch) {
    store.mutate(function (st) {
      var t = st.consultant.tasks[taskId];
      if (t) Object.assign(t, patch);
    }, { plan: true });
  };

  A.deleteTask = function (taskId) {
    store.mutate(function (st) {
      delete st.consultant.tasks[taskId];
      delete st.student.taskLogs[taskId];
      delete st.student.timers[taskId];
    }, { plan: true });
  };

  A.duplicateTask = function (taskId) {
    var newId = util.uid("tsk");
    store.mutate(function (st) {
      var t = st.consultant.tasks[taskId];
      if (!t) return;
      var copy = util.clone(t);
      copy.id = newId;
      copy.order = (t.order || 0) + 0.5;
      copy.createdAt = D.now();
      copy.title = t.title + " (کپی)";
      st.consultant.tasks[newId] = copy;
      reindexDay(st, t.dayId);
    }, { plan: true });
    return newId;
  };

  function reindexDay(st, dayId) {
    util.sortByOrder(
      util.values(st.consultant.tasks).filter(function (t) {
        return t.dayId === dayId;
      })
    ).forEach(function (t, i) {
      t.order = i;
    });
  }

  A.moveTask = function (taskId, direction) {
    store.mutate(function (st) {
      var t = st.consultant.tasks[taskId];
      if (!t) return;
      var list = util.sortByOrder(
        util.values(st.consultant.tasks).filter(function (x) {
          return x.dayId === t.dayId;
        })
      );
      var idx = list.findIndex(function (x) {
        return x.id === taskId;
      });
      var target = idx + direction;
      if (target < 0 || target >= list.length) return;
      var tmp = list[idx];
      list[idx] = list[target];
      list[target] = tmp;
      list.forEach(function (x, i) {
        x.order = i;
      });
    }, { plan: true });
  };

  A.moveTaskToDay = function (taskId, newDayId) {
    store.mutate(function (st) {
      var t = st.consultant.tasks[taskId];
      if (!t || t.dayId === newDayId) return;
      var oldDay = t.dayId;
      var siblings = util.values(st.consultant.tasks).filter(function (x) {
        return x.dayId === newDayId;
      });
      t.dayId = newDayId;
      t.order = siblings.length;
      reindexDay(st, oldDay);
    }, { plan: true });
  };

  /**
   * Builds a whole week from a plan the consultant prepared as a JSON file.
   * `plan` is the normalised shape produced by weekImport.parse().
   * Subjects that do not exist yet are created automatically.
   */
  A.createWeekFromPlan = function (plan) {
    var weekId = A.createWeek(plan.startDate, plan.title);

    store.mutate(function (st) {
      if (plan.studentName) {
        var parts = String(plan.studentName).trim().split(/\s+/);
        st.consultant.student.firstName = parts.shift() || st.consultant.student.firstName;
        if (parts.length) st.consultant.student.lastName = parts.join(" ");
      }
      if (plan.consultantName) st.consultant.student.consultantName = plan.consultantName;
      if (plan.weekNote) st.consultant.weeks[weekId].consultantNote = plan.weekNote;

      var byDow = {};
      util.values(st.consultant.days)
        .filter(function (d) {
          return d.weekId === weekId;
        })
        .forEach(function (d) {
          byDow[d.dowIndex] = d;
        });

      /* Reuse a subject with the same name, otherwise create it. */
      function subjectIdFor(name) {
        var clean = String(name || "").trim() || "سایر";
        var found = st.consultant.subjects.filter(function (s) {
          return s.name === clean;
        })[0];
        if (found) return found.id;
        var id = util.uid("sub");
        st.consultant.subjects.push({
          id: id,
          name: clean,
          color: util.subjectColor(st.consultant.subjects.length),
          order: st.consultant.subjects.length,
          archived: false
        });
        return id;
      }

      plan.days.forEach(function (planDay) {
        var day = byDow[planDay.dowIndex];
        if (!day) return;
        if (planDay.note) day.consultantNote = planDay.note;
        planDay.tasks.forEach(function (t, i) {
          var id = util.uid("tsk");
          st.consultant.tasks[id] = Object.assign(taskDefaults(), {
            id: id,
            dayId: day.id,
            subjectId: subjectIdFor(t.subject),
            topic: t.topic || "",
            title: t.title,
            description: t.description || "",
            type: t.type || "study",
            plannedMinutes: t.plannedMinutes,
            targetQuestions: t.targetQuestions || 0,
            startTime: t.startTime || "",
            priority: t.priority || "normal",
            consultantNote: t.note || "",
            order: i,
            createdAt: D.now()
          });
        });
      });
    }, { plan: true });

    return weekId;
  };

  /** Copies every task of `sourceWeekId` into a brand-new following week. */
  A.duplicateWeek = function (sourceWeekId, newStartIso) {
    var src = state.consultant.weeks[sourceWeekId];
    if (!src) return null;
    var start = D.weekStart(newStartIso || D.addDays(src.startDate, 7));
    var newWeekId = A.createWeek(start, null);

    store.mutate(function (st) {
      var srcDays = util.values(st.consultant.days).filter(function (d) {
        return d.weekId === sourceWeekId;
      });
      var newDays = util.values(st.consultant.days).filter(function (d) {
        return d.weekId === newWeekId;
      });
      var byDow = {};
      newDays.forEach(function (d) {
        byDow[d.dowIndex] = d;
      });

      srcDays.forEach(function (srcDay) {
        var target = byDow[srcDay.dowIndex];
        if (!target) return;
        target.consultantNote = srcDay.consultantNote || "";
        util
          .sortByOrder(
            util.values(st.consultant.tasks).filter(function (t) {
              return t.dayId === srcDay.id;
            })
          )
          .forEach(function (t, i) {
            var id = util.uid("tsk");
            var copy = util.clone(t);
            copy.id = id;
            copy.dayId = target.id;
            copy.order = i;
            copy.createdAt = D.now();
            st.consultant.tasks[id] = copy;
          });
      });

      st.consultant.weeks[newWeekId].consultantNote = src.consultantNote || "";
    }, { plan: true });

    return newWeekId;
  };

  A.setWeekNote = function (weekId, note) {
    store.mutate(function (st) {
      var w = st.consultant.weeks[weekId];
      if (w) w.consultantNote = note;
    }, { plan: true });
  };

  A.setConsultantFeedback = function (weekId, text) {

    }, { plan: true });

  A.setWeekLocked = function (weekId, locked) {
    store.mutate(function (st) {
      var w = st.consultant.weeks[weekId];
      if (w) w.locked = !!locked;
    }, { plan: true });
  };

    <script>
/* ===== js/charts.js ===== */
/* ==========================================================================
   charts.js - dependency-free SVG charts

   Deliberately no charting library: the student artifact must stay a single
   offline file, RTL-correct, printable, and themed from the same CSS tokens.
   Every chart draws ONLY from stats.js output - no chart invents data, and
   empty inputs return an explicit "not enough data" state instead of a
   misleading flat line at zero.

   MOBILE: a chart is drawn into a viewBox and then scaled to fit its box. A
   fixed 640-wide viewBox on a 320px phone scales to 0.41, which would render
   an 11px label at 4px. So the viewBox is matched to the viewport instead of
   being constant, and label density drops on narrow screens.

   Categories are laid out right-to-left to match the reading direction.
   ========================================================================== */
(function (global) {
  "use strict";

  var HDML = (global.HDML = global.HDML || {});
  var util = HDML.util;
  var UI = HDML.ui;
  var C = (HDML.charts = {});

  var NS = "http://www.w3.org/2000/svg";
  var doc = global.document;

  var PALETTE = {
    planned: "#c3cbdb",
    plannedStroke: "#a9b4c8",
    actual: "#2368e7",
    accent: "#cead3a",
    grid: "#e6eaf2",
    axis: "#9aa4bb",
    text: "#47536f",
    textSoft: "#77839d",
    navy: "#0e1a32"
  };

  C.PALETTE = PALETTE;

  /**
   * Drawing metrics matched to the current viewport, so label text keeps its
   * intended on-screen size instead of shrinking with the viewBox.
   */
  /*
   * A chart is rendered inside a card, so its real width is roughly
   *   viewport - page padding - card padding  (about 50px on a phone).
   * The viewBox is set close to that real width, and the font sizes are then
   * chosen so that after scaling they land at ~11px or more on screen.
   */
  function metrics(override) {
    var vw = override || global.innerWidth || 1024;
    if (vw < 400) {
      /* 320-399px: renders ~268-334px, scale ~0.9-1.1 */
      return { W: 300, fs: 14, fsSmall: 12.5, fsTiny: 11.5, ticks: 3, narrow: true };
    }
    if (vw < 560) {
      /* 400-559px: renders ~344-500px, scale ~0.95-1.4 */
      return { W: 360, fs: 13, fsSmall: 12, fsTiny: 11, ticks: 4, narrow: true };
    }
    if (vw < 900) {
      return { W: 520, fs: 12, fsSmall: 11, fsTiny: 10, ticks: 4, narrow: false };
    }
    return { W: 640, fs: 11.5, fsSmall: 10.5, fsTiny: 9.5, ticks: 4, narrow: false };
  }

  C.metrics = metrics;

  function svgEl(tag, attrs, children) {
    var node = doc.createElementNS(NS, tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (attrs[k] === null || attrs[k] === undefined) return;
        node.setAttribute(k, attrs[k]);
      });
    }
    if (children) {
      (Array.isArray(children) ? children : [children]).forEach(function (c) {
        if (c) node.appendChild(c);
      });
    }
    return node;
  }

  C.svgEl = svgEl;

  function text(str, x, y, attrs) {
    var t = svgEl(
      "text",
      Object.assign(
        {
          x: x,
          y: y,
          fill: PALETTE.text,
          "font-size": "11",
          "text-anchor": "middle",
          "font-family": "inherit"
        },
        attrs || {}
      )
    );
    t.textContent = str;
    return t;
  }

  C.text = text;

  function withTitle(node, label) {
    if (!label) return node;
    var t = svgEl("title");
    t.textContent = label;
    node.appendChild(t);
    return node;
  }

  function chartRoot(width, height, ariaLabel) {
    return svgEl("svg", {
      viewBox: "0 0 " + width + " " + height,
      class: "chart-svg",
      role: "img",
      "aria-label": ariaLabel || "نمودار",
      preserveAspectRatio: "xMidYMid meet",
      direction: "ltr"

  }

  /** "Not enough data yet" - never a fake zeroed chart. */
  function emptyChart(message, hint) {
    return UI.el("div", { class: "empty", style: { padding: "24px 12px" } }, [
      UI.el("div", { class: "empty__icon" }, UI.icon("progress", 40)),
      UI.el("div", { class: "empty__title", text: message }),
      hint ? UI.el("p", { class: "empty__text", text: hint }) : null
    ]);

  C.empty = emptyChart;

  function niceCeil(value) {
    if (value <= 0) return 60;
    var magnitude = Math.pow(10, Math.floor(Math.log10(value)));
    var normalized = value / magnitude;
    var step = normalized <= 1 ? 1 : normalized <= 2 ? 2 : normalized <= 5 ? 5 : 10;
    return step * magnitude;

  function legend(items) {

      "div",
      { class: "chart-legend" },

          UI.el("span", {
            class: "chart-legend__swatch",
            style: { background: item.color }

          UI.el("span", { text: item.label })

      })
    );

  C.legend = legend;

  C.plannedVsActual = function (series, options) {
    var opts = options || {};
    var M = metrics(opts.viewport);
    var data = (series || []).filter(function (d) {
      return d.plannedMinutes > 0 || d.actualMinutes > 0;
    });
    if (!data.length) {
      return emptyChart(
        "هنوز داده‌ای برای مقایسه نیست",
        "بعد از اینکه کارها را تیک بزنی، این نمودار پر می‌شود."
      );
    }

    var W = opts.width || M.W;
    var H = opts.height || (M.narrow ? 230 : 260);
    var padTop = 14;
    var padBottom = M.narrow ? 44 : 40;
    var padRight = M.narrow ? 34 : 46;
    var padLeft = 8;
    var plotW = W - padRight - padLeft;
    var plotH = H - padTop - padBottom;

    var maxVal = data.reduce(function (m, d) {
      return Math.max(m, d.plannedMinutes, d.actualMinutes);
    }, 0);
    var top = niceCeil(maxVal * 1.1);
    var scale = function (v) {
      return plotH - (v / top) * plotH;
    };

    var svg = chartRoot(W, H, "نمودار مقایسه زمان برنامه و زمان واقعی");
    var g = svgEl("g", { transform: "translate(" + padLeft + "," + padTop + ")" });

    for (var i = 0; i <= M.ticks; i++) {
      var v = (top / M.ticks) * i;
      var y = scale(v);
      g.appendChild(
        svgEl("line", {
          x1: 0,
          x2: plotW,
          y1: y,
          y2: y,
          stroke: PALETTE.grid,
          "stroke-width": 1
        })
      );
      g.appendChild(
        text(util.n(util.round(v / 60, v >= 60 ? 0 : 1)), plotW + padRight / 2, y + 4, {
          fill: PALETTE.textSoft,
          "font-size": M.fsSmall
        })
      );
    }
    g.appendChild(
      text("ساعت", plotW + padRight / 2, -3, {
        fill: PALETTE.textSoft,
        "font-size": M.fsTiny
      })
    );

    var step = plotW / data.length;
    var barW = Math.min(M.narrow ? 11 : 16, step * 0.32);
    var gap = M.narrow ? 2 : 3;

    data.forEach(function (d, idx) {
      var center = plotW - (idx + 0.5) * step; /* right-to-left */

      g.appendChild(
        withTitle(
          svgEl("rect", {
            x: center + gap / 2,
            y: scale(d.plannedMinutes),
            width: barW,
            height: Math.max(0, plotH - scale(d.plannedMinutes)),
            rx: 3,
            fill: PALETTE.planned
          }),
          d.dayName + " — برنامه: " + util.fmtDur(d.plannedMinutes)
        )
      );

      g.appendChild(
        withTitle(
          svgEl("rect", {
            x: center - barW - gap / 2,
            y: scale(d.actualMinutes),
            width: barW,
            height: Math.max(0, plotH - scale(d.actualMinutes)),
            rx: 3,
            fill: d.isFuture ? "#c9d8f6" : PALETTE.actual
          }),
          d.dayName + " — واقعی: " + util.fmtDur(d.actualMinutes)
        )
      );

      /* Full day names do not fit on a phone; the short form does. */
      g.appendChild(
        text(M.narrow ? d.dayName.slice(0, 1) : d.dayName, center, plotH + 16, {
          fill: PALETTE.textSoft,
          "font-size": M.fs,
          direction: "rtl"
        })
      );
      if (!M.narrow || data.length <= 7) {
        g.appendChild(
          text(d.label, center, plotH + 30, {
            fill: PALETTE.axis,
            "font-size": M.fsTiny
          })
        );
      }
    });

    g.appendChild(
      svgEl("line", {
        x1: 0,
        x2: plotW,
        y1: plotH,
        y2: plotH,
        stroke: PALETTE.axis,
        "stroke-width": 1
      })
    );

    svg.appendChild(g);

    return UI.el("div", {}, [
      UI.el("div", { class: "chart-box" }, svg),
      legend([
        { label: "واقعی", color: PALETTE.actual },
        { label: "برنامه", color: PALETTE.planned }
      ])
    ]);
  };

  C.studyTrend = function (series, options) {
    var opts = options || {};
    var M = metrics(opts.viewport);

    /* Days that have happened, plus any future-dated day already worked on. */
    var data = (series || []).filter(function (d) {
      return !d.isFuture || d.actualMinutes > 0;
    });

    if (!HDML.stats.hasTrendData(data)) {
      return emptyChart(
        "هنوز سابقه‌ی کافی نیست",
        "برای دیدن روند، حداقل دو روز با زمان مطالعه لازم است."
      );
    }

    var W = opts.width || M.W;
    var H = opts.height || (M.narrow ? 210 : 240);
    var padTop = 16;
    var padBottom = 34;
    var padRight = M.narrow ? 32 : 44;
    var padLeft = 8;
    var plotW = W - padRight - padLeft;
    var plotH = H - padTop - padBottom;

    var maxVal = data.reduce(function (m, d) {
      return Math.max(m, d.actualMinutes);
    }, 0);
    var top = niceCeil(maxVal * 1.15);

    var xAt = function (i) {
      if (data.length === 1) return plotW / 2;
      return plotW - (i / (data.length - 1)) * plotW;
    };
    var yAt = function (v) {
      return plotH - (v / top) * plotH;
    };

    var svg = chartRoot(W, H, "نمودار روند ساعت مطالعه‌ی روزانه");
    var g = svgEl("g", { transform: "translate(" + padLeft + "," + padTop + ")" });

    for (var i = 0; i <= M.ticks; i++) {
      var v = (top / M.ticks) * i;
      var y = yAt(v);
      g.appendChild(
        svgEl("line", {
          x1: 0,
          x2: plotW,
          y1: y,
          y2: y,
          stroke: PALETTE.grid,
          "stroke-width": 1
        })
      );
      g.appendChild(
        text(util.n(util.round(v / 60, v >= 60 ? 0 : 1)), plotW + padRight / 2, y + 4, {
          fill: PALETTE.textSoft,
          "font-size": M.fsSmall
        })
      );
    }
    g.appendChild(
      text("ساعت", plotW + padRight / 2, -4, {
        fill: PALETTE.textSoft,
        "font-size": M.fsTiny
      })
    );

    var linePts = data.map(function (d, i) {
      return xAt(i) + "," + yAt(d.actualMinutes);
    });

    var gradId = "tg" + Math.random().toString(36).slice(2, 8);
    var defs = svgEl("defs");
    var grad = svgEl("linearGradient", { id: gradId, x1: "0", y1: "0", x2: "0", y2: "1" });
    grad.appendChild(
      svgEl("stop", { offset: "0%", "stop-color": PALETTE.actual, "stop-opacity": "0.34" })
    );
    grad.appendChild(
      svgEl("stop", { offset: "100%", "stop-color": PALETTE.actual, "stop-opacity": "0.02" })
    );
    defs.appendChild(grad);
    svg.appendChild(defs);

    g.appendChild(
      svgEl("polygon", {
        points:
          xAt(0) + "," + plotH + " " + linePts.join(" ") + " " + xAt(data.length - 1) + "," + plotH,
        fill: "url(#" + gradId + ")"
      })
    );
    g.appendChild(
      svgEl("polyline", {
        points: linePts.join(" "),
        fill: "none",
        stroke: PALETTE.actual,
        "stroke-width": M.narrow ? 2.6 : 2.2,
        "stroke-linejoin": "round",
        "stroke-linecap": "round"
      })
    );

    var avg =
      data.reduce(function (a, d) {
        return a + d.actualMinutes;
      }, 0) / data.length;
    g.appendChild(
      svgEl("line", {
        x1: 0,
        x2: plotW,
        y1: yAt(avg),
        y2: yAt(avg),
        stroke: PALETTE.accent,
        "stroke-width": 1.4,
        "stroke-dasharray": "5 4"
      })
    );
    g.appendChild(
      text("میانگین " + util.fmtHM(avg), plotW * 0.18, yAt(avg) - 6, {
        fill: "#a98a24",
        "font-size": M.fsSmall
      })
    );

    /* Keep roughly one label per 52px of width so they never collide. */
    var maxLabels = Math.max(2, Math.floor(plotW / 52));
    var labelEvery = Math.ceil(data.length / maxLabels);

    data.forEach(function (d, i) {
      var x = xAt(i);
      var y = yAt(d.actualMinutes);
      g.appendChild(
        withTitle(
          svgEl("circle", {
            cx: x,
            cy: y,
            r: M.narrow ? 3.8 : 3.4,
            fill: "#fff",
            stroke: PALETTE.actual,
            "stroke-width": 2
          }),
          d.dayName + " " + d.label + " — " + util.fmtDur(d.actualMinutes)
        )
      );
      if (i % labelEvery === 0 || i === data.length - 1) {
        g.appendChild(
          text(d.label, x, plotH + 16, {
            fill: PALETTE.textSoft,
            "font-size": M.fsSmall
          })
        );
      }
    });

    g.appendChild(
      svgEl("line", {
        x1: 0,
        x2: plotW,
        y1: plotH,
        y2: plotH,
        stroke: PALETTE.axis,
        "stroke-width": 1
      })
    );

    svg.appendChild(g);

    return UI.el("div", {}, [
      UI.el("div", { class: "chart-box" }, svg),
      UI.el("div", {
        class: "chart-note",
        text: "ساعت مطالعه‌ی هر روز · " + util.n(data.length) + " روز"
      })
    ]);
  };

  C.subjectRadar = function (rows, options) {
    var opts = options || {};
    var M = metrics(opts.viewport);
    var data = (rows || []).filter(function (r) {
      return r.plannedMinutes > 0 || r.actualMinutes > 0;
    });

    if (data.length < 3) {
      return emptyChart("برای نمودار راداری حداقل سه درس لازم است");
    }

    var size = opts.size || (M.narrow ? M.W : 320);
    var cx = size / 2;
    var cy = size / 2 + 4;
    /* Labels sit outside the ring - leave room or they clip on a phone. */
    var radius = size / 2 - (M.narrow ? 58 : 54);
    var n = data.length;

    var svg = chartRoot(size, size + 10, "نمودار راداری پیشرفت دروس");

    function point(index, ratio) {
      var angle = -Math.PI / 2 + (index / n) * Math.PI * 2;
      return {
        x: cx + Math.cos(angle) * radius * ratio,
        y: cy + Math.sin(angle) * radius * ratio
      };
    }

    [0.25, 0.5, 0.75, 1].forEach(function (ratio) {
      var pts = [];
      for (var i = 0; i < n; i++) {
        var p = point(i, ratio);
        pts.push(p.x + "," + p.y);
      }
      svg.appendChild(
        svgEl("polygon", {
          points: pts.join(" "),
          fill: ratio === 1 ? "#fbfcfe" : "none",
          stroke: ratio === 1 ? PALETTE.axis : PALETTE.grid,
          "stroke-width": ratio === 1 ? 1.4 : 1
        })
      );
    });

    for (var i = 0; i < n; i++) {
      var p = point(i, 1);
      svg.appendChild(
        svgEl("line", {
          x1: cx,
          y1: cy,
          x2: p.x,
          y2: p.y,
          stroke: PALETTE.grid,
          "stroke-width": 1
        })
      );
    }

    var dataPts = [];
    data.forEach(function (row, idx) {
      var pt = point(idx, util.clamp(row.value / 100, 0, 1));
      dataPts.push(pt.x + "," + pt.y);
    });

    svg.appendChild(
      svgEl("polygon", {
        points: dataPts.join(" "),
        fill: "rgba(35,104,231,0.22)",
        stroke: PALETTE.actual,
        "stroke-width": 2,
        "stroke-linejoin": "round"
      })
    );

    data.forEach(function (row, idx) {
      var pt = point(idx, util.clamp(row.value / 100, 0, 1));
      svg.appendChild(
        withTitle(
          svgEl("circle", {
            cx: pt.x,
            cy: pt.y,
            r: 3.6,
            fill: "#fff",
            stroke: row.color || PALETTE.actual,
            "stroke-width": 2
          }),
          row.name + " — " + util.fmtPct(row.value)
        )
      );

      var lp = point(idx, 1.14);
      var anchor = Math.abs(lp.x - cx) < 12 ? "middle" : lp.x > cx ? "start" : "end";
      svg.appendChild(
        text(util.truncate(row.name, M.narrow ? 9 : 14), lp.x, lp.y + 4, {
          "text-anchor": anchor,
          fill: PALETTE.navy,
          "font-size": M.fs,
          direction: "rtl"
        })
      );
      svg.appendChild(
        text(util.fmtPct(row.value), lp.x, lp.y + 16, {
          "text-anchor": anchor,
          fill: PALETTE.textSoft,
          "font-size": M.fsSmall
        })
      );
    });

    return UI.el("div", {}, [
      UI.el("div", { class: "chart-box" }, svg),
      UI.el("div", {
        class: "chart-note",
        text: "درصد = زمان واقعی ÷ زمان برنامه‌ی همان درس"
      })
    ]);
  };

  C.subjectBars = function (rows, options) {
    var opts = options || {};
    var M = metrics(opts.viewport);
    var data = (rows || [])
      .filter(function (r) {
        return r.plannedMinutes > 0 || r.actualMinutes > 0;
      })
      .slice(0, opts.limit || 12);

    if (!data.length) return emptyChart("هنوز مطالعه‌ای ثبت نشده است");

    var W = opts.width || M.W;
    var rowH = M.narrow ? 40 : 34;
    var labelW = M.narrow ? 72 : 108;
    var padRight = M.narrow ? 46 : 58;
    var H = data.length * rowH + 12;
    var barW = W - labelW - padRight;

    var maxVal = data.reduce(function (m, r) {
      return Math.max(m, r.plannedMinutes, r.actualMinutes);
    }, 0);
    var top = niceCeil(maxVal * 1.05);

    var svg = chartRoot(W, H, "مقایسه‌ی زمان برنامه و واقعی به تفکیک درس");

    data.forEach(function (r, i) {
      var y = i * rowH + 6;
      svg.appendChild(
        text(util.truncate(r.name, M.narrow ? 9 : 14), W - 4, y + 15, {
          "text-anchor": "end",
          fill: PALETTE.navy,
          "font-size": M.fs,
          direction: "rtl"
        })
      );

      var plannedLen = (r.plannedMinutes / top) * barW;
      var actualLen = (r.actualMinutes / top) * barW;
      var right = W - labelW;

      svg.appendChild(
        withTitle(
          svgEl("rect", {
            x: right - plannedLen,
            y: y + 3,
            width: Math.max(1, plannedLen),
            height: M.narrow ? 10 : 9,
            rx: 4,
            fill: PALETTE.planned
          }),
          r.name + " — برنامه: " + util.fmtDur(r.plannedMinutes)
        )
      );
      svg.appendChild(
        withTitle(
          svgEl("rect", {
            x: right - actualLen,
            y: y + (M.narrow ? 17 : 15),
            width: Math.max(1, actualLen),
            height: M.narrow ? 10 : 9,
            rx: 4,
            fill: r.color || PALETTE.actual
          }),
          r.name + " — واقعی: " + util.fmtDur(r.actualMinutes)
        )
      );

      svg.appendChild(
        text(
          util.fmtHM(r.actualMinutes) + " / " + util.fmtHM(r.plannedMinutes),
          2,
          y + (M.narrow ? 19 : 17),
          { "text-anchor": "start", fill: PALETTE.textSoft, "font-size": M.fsSmall }
        )
      );
    });

    return UI.el("div", {}, [
      UI.el("div", { class: "chart-box" }, svg),
      legend([
        { label: "واقعی", color: PALETTE.actual },
        { label: "برنامه", color: PALETTE.planned }
      ])
    ]);
  };

  C.ring = function (rate, options) {
    var opts = options || {};
    var size = opts.size || 92;
    var stroke = opts.stroke || 9;
    var r = (size - stroke) / 2;
    var circumference = 2 * Math.PI * r;
    var value = rate === null ? 0 : util.clamp(rate, 0, 100);
    var color = util.toneColor(opts.tone || util.rateTone(rate));

    var svg = chartRoot(size, size, (opts.label || "پیشرفت") + " " + util.fmtPct(rate));
    svg.setAttribute("width", size);
    svg.setAttribute("height", size);

    svg.style.height = size + "px";

    svg.appendChild(
      svgEl("circle", {
        cx: size / 2,
        cy: size / 2,
        r: r,
        fill: "none",
        stroke: "#eef1f8",
        "stroke-width": stroke
      })
    );
    svg.appendChild(
      svgEl("circle", {
        cx: size / 2,
        cy: size / 2,
        r: r,
        fill: "none",
        stroke: color,
        "stroke-width": stroke,
        "stroke-linecap": "round",
        "stroke-dasharray": circumference,
        "stroke-dashoffset": circumference * (1 - value / 100),
        transform: "rotate(-90 " + size / 2 + " " + size / 2 + ")"
      })
    );
    svg.appendChild(
      text(rate === null ? "—" : util.fmtPct(rate), size / 2, size / 2 + 5, {

  C.examTrend = function (points, options) {
    var opts = options || {};
    var M = metrics(opts.viewport);
    var data = points || [];
    if (data.length < 2) {
      return emptyChart(
        "برای دیدن روند، حداقل دو آزمون لازم است",
        data.length === 1 ? "تا حالا یک آزمون ثبت کرده‌ای." : "هنوز آزمونی ثبت نشده."
      );
    }

    var W = opts.width || M.W;
    var H = opts.height || (M.narrow ? 215 : 230);
    var padTop = 22;
    var padBottom = M.narrow ? 46 : 42;
    var padRight = M.narrow ? 34 : 40;
    var plotW = W - padRight - 8;
    var plotH = H - padTop - padBottom;

    var values = data.map(function (p) {
      return p.value;
    });
    var lo = Math.floor(Math.min.apply(null, values.concat([0])) / 10) * 10;
    var hi = Math.ceil(Math.max(Math.max.apply(null, values) * 1.1, lo + 20) / 10) * 10;

    var xAt = function (i) {
      return data.length === 1 ? plotW / 2 : plotW - (i / (data.length - 1)) * plotW;
    };
    var yAt = function (v) {
      return plotH - ((v - lo) / (hi - lo)) * plotH;
    };

    var svg = chartRoot(W, H, "نمودار روند درصد کل آزمون‌ها");
    var g = svgEl("g", { transform: "translate(8," + padTop + ")" });

    for (var i = 0; i <= M.ticks; i++) {
      var v = lo + ((hi - lo) / M.ticks) * i;
      var y = yAt(v);
      g.appendChild(
        svgEl("line", {
          x1: 0,
          x2: plotW,
          y1: y,
          y2: y,
          stroke: PALETTE.grid,
          "stroke-width": 1
        })
      );
      g.appendChild(
        text(util.n(util.round(v, 0)) + "٪", plotW + padRight / 2, y + 4, {
          fill: PALETTE.textSoft,
          "font-size": M.fsSmall
        })
      );
    }

    g.appendChild(
      svgEl("polyline", {
        points: data
          .map(function (p, idx) {
            return xAt(idx) + "," + yAt(p.value);
          })
          .join(" "),
        fill: "none",
        stroke: PALETTE.actual,
        "stroke-width": 2.4,
        "stroke-linejoin": "round"
      })
    );

    var maxLabels = Math.max(2, Math.floor(plotW / 58));
    var every = Math.ceil(data.length / maxLabels);

    data.forEach(function (p, idx) {
      var x = xAt(idx);
      var y = yAt(p.value);
      g.appendChild(
        withTitle(
          svgEl("circle", {
            cx: x,
            cy: y,
            r: 4.2,
            fill: "#fff",
            stroke: PALETTE.actual,
            "stroke-width": 2.4
          }),
          p.label + " — " + util.fmtPct(p.value)
        )
      );
      g.appendChild(
        text(util.fmtPct(p.value), x, y - 11, {
          fill: PALETTE.navy,
          "font-size": M.fsSmall,
          "font-weight": "700"
        })
      );
      if (idx % every === 0 || idx === data.length - 1) {
        g.appendChild(
          text(util.truncate(p.label, M.narrow ? 8 : 12), x, plotH + 16, {
            fill: PALETTE.textSoft,
            "font-size": M.fsSmall,
            direction: "rtl"
          })
        );
        g.appendChild(
          text(HDML.date.format(p.date, "short"), x, plotH + 30, {
            fill: PALETTE.axis,
            "font-size": M.fsTiny
          })
        );
      }
    });

    g.appendChild(
      svgEl("line", {
        x1: 0,
        x2: plotW,
        y1: plotH,
        y2: plotH,
        stroke: PALETTE.axis,
        "stroke-width": 1
      })
    );

    svg.appendChild(g);
    return UI.el("div", { class: "chart-box" }, svg);
