    <!-- Error boundary. Deliberately the FIRST script in the document and
         written in plain ES5 with no dependencies, so it still works if
         everything after it fails to parse. Turns any fatal startup problem
         into a readable message instead of a white screen. -->
    <script>
      (function () {
        var handled = false;

        function mounted() {
          return !!document.querySelector("#app-root .app");
        }

        function showFailure(kind, detail) {
          /* Once the real app is on screen, a later error must not wipe it. */
          if (handled || mounted()) {
            if (window.console) console.error(kind, detail);
            return;
          }
          handled = true;
          var root = document.getElementById("app-root");
          if (!root) return;

          var box = document.createElement("div");
          box.className = "boot-error";

          var title = document.createElement("div");
          title.className = "boot-error__title";
          title.appendChild(document.createTextNode("یک خطای غیرمنتظره رخ داد."));

          var text = document.createElement("p");
          text.className = "boot-error__text";
          text.appendChild(
            document.createTextNode(
              "برنامه به‌درستی باز نشد. لطفاً متن زیر را برای پشتیبانی بفرستید."
            )
          );

          var pre = document.createElement("pre");
          pre.className = "boot-error__detail";
          pre.setAttribute("dir", "ltr");
          pre.appendChild(
            document.createTextNode(
              kind +
                ": " +
                detail +
                "\nUA: " +
                (navigator.userAgent || "?") +
                "\nURL: " +
                String(location.protocol)
            )
          );

          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "boot-error__btn";
          btn.appendChild(document.createTextNode("تلاش دوباره"));
          btn.onclick = function () {
            location.reload();
          };

          root.innerHTML = "";
          box.appendChild(title);
          box.appendChild(text);
          box.appendChild(pre);
          box.appendChild(btn);
          root.appendChild(box);
        }

        window.__enigmaFail = showFailure;

        window.addEventListener("error", function (e) {
          showFailure(
            "Error",
            (e.message || "unknown") + " @" + (e.lineno || 0) + ":" + (e.colno || 0)
          );
        });

        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          showFailure("Promise", String((r && r.message) || r));
        });

        /* Watchdog: if the shell never mounted, say why instead of staying
           blank. Generous delay so a slow phone is not accused unfairly. */
        window.addEventListener("load", function () {
          setTimeout(function () {
            if (!mounted()) {
              showFailure(
                "Startup",
                "برنامه بالا نیامد. HDML=" +
                  (typeof window.HDML) +
                  " views=" +
                  (window.HDML && window.HDML.views ? "yes" : "no")
              );
            }
          }, 4000);
        });
      })();
    </script>

    <!-- Capture a pristine copy of this document so the app can re-emit
         itself with a different payload (the student HTML export). Must run
         before app.js registers its own DOMContentLoaded handler. -->
    <script>
      (function () {
        window.HDML = window.HDML || {};
        function capture() {
          try {
            window.HDML.IS_MULTIFILE =
              document.querySelectorAll('link[rel="stylesheet"]').length > 0;
            window.HDML.PRISTINE_HTML =
              "<!doctype html>\n" + document.documentElement.outerHTML;
          } catch (err) {
            /* Only the "save a new file" feature needs this; never fatal. */
            if (window.console) console.error("pristine capture failed", err);
          }
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", capture);
        } else {
          capture();
        }
      })();
    </script>
